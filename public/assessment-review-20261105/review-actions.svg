<svg xmlns="http://www.w3.org/2000/svg" width="560" height="920" viewBox="0 0 560 920"><style>text{font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;fill:#173a40;font-weight:700}.title{font-size:44px}.head{font-size:38px}.body{font-size:32px}</style><rect width="560" height="920" rx="18" fill="#f4f8f7"/><text x="28" y="62" class="title">这轮先落实四个动作</text><rect x="24" y="94" width="512" height="170" rx="16" fill="#e1efe8"/><text x="42" y="142" class="head">先把关系说清楚</text><text x="42" y="192" class="body">三词造句，核对方向</text><text x="42" y="235" class="body">混合平均，先认权重</text><rect x="24" y="294" width="512" height="170" rx="16" fill="#e4edf6"/><text x="42" y="342" class="head">分母写出比较期</text><text x="42" y="392" class="body">增长率＝增量÷基期</text><text x="42" y="435" class="body">先标“上年”，再取数</text><rect x="24" y="494" width="512" height="170" rx="16" fill="#f5ebd9"/><text x="42" y="542" class="head">估算先落实参照</text><text x="42" y="592" class="body">180×2/3＝120</text><text x="42" y="635" class="body">131＞120，方向不反</text><rect x="24" y="694" width="512" height="170" rx="16" fill="#e6e8f3"/><text x="42" y="742" class="head">时间紧也保留排除</text><text x="42" y="792" class="body">已知错误项先划掉</text><text x="42" y="835" class="body">只从剩余选项中选择</text></svg>