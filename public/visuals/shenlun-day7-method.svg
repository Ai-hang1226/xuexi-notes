<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title"><title id="title">DAY7：先找作用，再回看材料合并特点</title><rect width="1120" height="960" rx="24" fill="#f4f7fc"/><style>text{font-family:'Times New Roman','Microsoft YaHei','微软雅黑',sans-serif;fill:#163353;font-size:32px;font-weight:600}.h{font-size:38px;font-weight:800}.title{font-size:44px;font-weight:800}.small{font-size:28px}</style><text x="44" y="74" class="title">DAY7｜特点与作用怎么分</text><rect x="36" y="108" width="1048" height="144" rx="16" fill="#fff" stroke="#327469" stroke-width="3"/><text x="60" y="161" class="h">特点：模式有什么独特属性、特殊安排？</text><text x="60" y="218" class="h">作用：对谁发挥什么功能、带来什么影响？</text><text x="44" y="314" class="h">特点难找时，先找作用，再回看材料</text><rect x="36" y="348" width="1048" height="220" rx="16" fill="#fff" stroke="#3367ad" stroke-width="3"/><text x="60" y="405">① 找作用：特色产业、脱贫、技术、信用文明</text><text x="60" y="467">② 回看：产生这些作用，靠哪些做法？</text><text x="60" y="529">③ 比较合并：产品定制／考核多元／人才下沉</text><rect x="36" y="602" width="1048" height="152" rx="16" fill="#e8f4ef"/><text x="60" y="657">蟹苗专属产品＋贫困户信贷计划</text><text x="60" y="717" class="h">→ 共同属性：产品灵活定制</text><text x="44" y="817" class="small">校验：特点必须有材料依据，不能只凭结果猜原因。</text><text x="44" y="867" class="small">找点顺序：先作用后特点；成稿顺序：按题干要求。</text><text x="44" y="919" class="small">定义据讲义；先找作用法据用户转述老师课堂方法。</text></svg>