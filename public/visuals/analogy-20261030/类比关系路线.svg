<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1240" viewBox="0 0 1420 1240"><rect width="1420" height="1240" fill="#faf9f5"/><g fill="#243642" font-family="Times New Roman, Microsoft YaHei, 微软雅黑, sans-serif"><text x="50" y="70" font-size="44" font-weight="800">类比推理｜积累具体关系，也积累验证句</text><text x="50" y="124" font-size="32" font-weight="600">原卷3/10 · 7分53秒 · 本轮7道错题讨论完成</text><rect x="45" y="170" width="650" height="285" rx="18" fill="#edf5ef" stroke="#627e8d"/><text x="70" y="222" font-size="38" font-weight="800">词义／词性</text><text x="70" y="275" font-size="32" font-weight="800">先把词语放回短句</text><text x="70" y="343" font-size="32" font-weight="600">现实既可指情况，也可描述性质</text><text x="70" y="391" font-size="32" font-weight="600">临渊羡鱼→空想；不是伴随动作</text><rect x="725" y="170" width="650" height="285" rx="18" fill="#ecf2fa" stroke="#627e8d"/><text x="750" y="222" font-size="38" font-weight="800">职业／场所</text><text x="750" y="275" font-size="32" font-weight="800">把具体动作说清楚</text><text x="750" y="343" font-size="32" font-weight="600">谁创作什么：画家→画作</text><text x="750" y="391" font-size="32" font-weight="600">在哪里创作？在哪里展示？</text><rect x="45" y="485" width="650" height="285" rx="18" fill="#edf5ef" stroke="#627e8d"/><text x="70" y="537" font-size="38" font-weight="800">工具／原料</text><text x="70" y="590" font-size="32" font-weight="800">核对事物扮演的角色</text><text x="70" y="658" font-size="32" font-weight="600">笔墨用于创作；布料制成衣裳</text><text x="70" y="706" font-size="32" font-weight="600">雅称指代与“大类的一种”分开</text><rect x="725" y="485" width="650" height="285" rx="18" fill="#ecf2fa" stroke="#627e8d"/><text x="750" y="537" font-size="38" font-weight="800">比率／方向</text><text x="750" y="590" font-size="32" font-weight="800">先写分式，再核对位置</text><text x="750" y="658" font-size="32" font-weight="600">生师比＝学生÷教师</text><text x="750" y="706" font-size="32" font-weight="600">名称不保证顺序：存贷比＝贷÷存</text><rect x="45" y="800" width="650" height="285" rx="18" fill="#edf5ef" stroke="#627e8d"/><text x="70" y="852" font-size="38" font-weight="800">方式／效果</text><text x="70" y="905" font-size="32" font-weight="800">辨清手段、效果和种属</text><text x="70" y="973" font-size="32" font-weight="600">移动支付→便捷交易</text><text x="70" y="1021" font-size="32" font-weight="600">移动支付属于电子支付</text><rect x="725" y="800" width="650" height="285" rx="18" fill="#ecf2fa" stroke="#627e8d"/><text x="750" y="852" font-size="38" font-weight="800">时段／因果</text><text x="750" y="905" font-size="32" font-weight="800">两边分别判断，再画箭头</text><text x="750" y="973" font-size="32" font-weight="600">白天—夜晚，两边保持一致</text><text x="750" y="1021" font-size="32" font-weight="600">原因→可能结果，条件不能省</text><text x="50" y="1160" font-size="32" font-weight="800">核词义 → 造短句 → 对角色与方向 → 必要时再细分关系</text><text x="50" y="1210" font-size="32">原始首答保留；讨论后的理解，仍需陌生题独立验证。</text></g></svg>
