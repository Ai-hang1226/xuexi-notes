<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>第19题：过B作水平辅助线，构造直角三角形</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8990B5"/></marker></defs><rect width="100%" height="100%" fill="#FBFCFF"/>
<text x="45" y="52" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#26324A">
<tspan x="45" dy="0">19｜补直角 → 求底宽 → 面积差</tspan>
</text>
<text x="45" y="87" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#68748D">
<tspan x="45" dy="0">过 B 作 BE ∥ DC，E 落在 AD 上。图按原题比例绘制。</tspan>
</text>
<polygon points="130,155 130,515 310,515" fill="#FFE4BC" stroke="none" stroke-width="1"/>
<polygon points="562,335 562,515 310,515" fill="#CFECE4" stroke="none" stroke-width="1"/>
<polygon points="130,155 562,335 310,515" fill="#E3E4FF" stroke="none" stroke-width="1"/>
<polygon points="130,155 562,335 562,515 130,515" fill="none" stroke="#344060" stroke-width="3"/>
<line x1="130" y1="155" x2="310" y2="515" stroke="#5964D8" stroke-width="3"/>
<line x1="562" y1="335" x2="310" y2="515" stroke="#5964D8" stroke-width="3"/>
<line x1="130" y1="335" x2="562" y2="335" stroke="#DC8A26" stroke-width="3" stroke-dasharray="9 6"/>
<path d="M130 320 L145 320 L145 335" fill="none" stroke="#DC8A26" stroke-width="2"/>
<text x="105" y="145" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#26324A">
<tspan x="105" dy="0">A</tspan>
</text>
<text x="575" y="335" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#26324A">
<tspan x="575" dy="0">B</tspan>
</text>
<text x="574" y="538" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#26324A">
<tspan x="574" dy="0">C</tspan>
</text>
<text x="103" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#26324A">
<tspan x="103" dy="0">D</tspan>
</text>
<text x="310" y="547" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#26324A">
<tspan x="310" dy="0">Q</tspan>
</text>
<text x="103" y="340" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#26324A">
<tspan x="103" dy="0">E</tspan>
</text>
<text x="320" y="224" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#26324A">
<tspan x="320" dy="0">AB = 260</tspan>
</text>
<text x="30" y="418" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="30" dy="0">AD = 200</tspan>
</text>
<text x="583" y="439" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="583" dy="0">BC = 100</tspan>
</text>
<text x="146" y="267" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#BA711E">
<tspan x="146" dy="0">AE = 100</tspan>
</text>
<text x="266" y="322" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#BA711E">
<tspan x="266" dy="0">BE = DC = 240</tspan>
</text>
<text x="170" y="569" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#26324A">
<tspan x="170" dy="0">DQ = 100</tspan>
</text>
<text x="396" y="569" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#26324A">
<tspan x="396" dy="0">QC = 140</tspan>
</text>
<rect x="725" y="145" width="425" height="126" rx="18" fill="#ECEEFF" stroke="#5964D8" stroke-width="1.5"/>
<text x="745" y="179" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#5964D8">
<tspan x="745" dy="0">① 勾股求宽</tspan>
</text>
<text x="745" y="214" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="745" dy="0">高差 200 − 100 = 100</tspan>
</text>
<text x="745" y="242" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="745" dy="0">底宽 √(260² − 100²) = 240</tspan>
</text>
<rect x="725" y="292" width="425" height="126" rx="18" fill="#E5F6EF" stroke="#169879" stroke-width="1.5"/>
<text x="745" y="326" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#169879">
<tspan x="745" dy="0">② 大图减小图</tspan>
</text>
<text x="745" y="361" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="745" dy="0">梯形面积 36 000</tspan>
</text>
<text x="745" y="389" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="745" dy="0">左三角 10 000 · 右三角 7 000</tspan>
</text>
<rect x="725" y="439" width="425" height="126" rx="18" fill="#FFF1DD" stroke="#DC8A26" stroke-width="1.5"/>
<text x="745" y="473" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#DC8A26">
<tspan x="745" dy="0">③ 目标面积</tspan>
</text>
<text x="745" y="508" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="745" dy="0">36 000 − 10 000 − 7 000</tspan>
</text>
<text x="745" y="536" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#26324A">
<tspan x="745" dy="0">= 19 000 m²</tspan>
</text>
<text x="45" y="651" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#69748C">
<tspan x="45" dy="0">提示：原卷本题答对；本人确认辅助线构造不会。方法点积累，后续再验证。</tspan>
</text>
</svg>