<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="逻辑与定义｜四个检查句"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">逻辑与定义｜四个检查句</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">解释原因</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">原因是选项提供的？</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">还是我自己补进去的？</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">必要条件</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">这个条件服务于哪个结果</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">？</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">是否对准题干结论？</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">陌生表达</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">先看哪些短语能读懂</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">再判断它表达的态度</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">最适合</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">一个选项能用以后</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">还要比较谁更适合</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">四类问题分别检查，陌生题仍需验证。</text></g></svg>