<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 729" role="img" aria-label="常识积累四步走"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="729" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">常识积累四步走</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">一条知识，留下一个区别</text><rect x="30" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">① 按领域归位</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">政治／法律／科技</text><text x="50" y="286" font-size="27" fill="#26374c" font-weight="500">文史／经济／地理</text><rect x="618" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="188" font-size="31" fill="#2b5288" font-weight="700">② 记核心区别</text><text x="638" y="246" font-size="27" fill="#26374c" font-weight="500">用一句话写清关键点</text><text x="638" y="286" font-size="27" fill="#26374c" font-weight="500">易混概念放在一起对照</text><rect x="30" y="399" width="552" height="184" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="437" font-size="31" fill="#7e591c" font-weight="700">③ 保留来源</text><text x="50" y="495" font-size="27" fill="#26374c" font-weight="500">记录标题、链接和日期</text><text x="50" y="535" font-size="27" fill="#26374c" font-weight="500">有变化的信息回原文核实</text><rect x="618" y="399" width="552" height="184" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="437" font-size="31" fill="#176552" font-weight="700">④ 隔天回看</text><text x="638" y="495" font-size="27" fill="#26374c" font-weight="500">遮住笔记，自己说一遍</text><text x="638" y="535" font-size="27" fill="#26374c" font-weight="500">说不清楚，回看易混点</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 242 H613"/><path d="M894 338 V366.5 H306 V394"/><path d="M584 491 H613"/></g><text x="30" y="633" font-size="27" fill="#3b4c61" font-weight="600">分类 → 区别 → 来源</text><text x="30" y="669" font-size="27" fill="#3b4c61" font-weight="600">隔天再提取，持续积累</text></g></svg>