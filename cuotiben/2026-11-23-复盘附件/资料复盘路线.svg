<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1120" viewBox="0 0 600 1120" role="img" aria-labelledby="title desc">
  <title id="title">资料分析复盘路线</title><desc id="desc">先确认时间和对象，再检查问法、符号、计算与边界。</desc>
  <rect width="600" height="1120" rx="24" fill="#f5f8ff"/>
  <g font-family="Microsoft YaHei,sans-serif" fill="#17324e">
    <text x="30" y="58" font-size="34" font-weight="700">资料分析｜先找对，再算快</text>
    <text x="30" y="103" font-size="25" fill="#52687d">今天的错题 · 下次逐步验证</text>
    <rect x="24" y="145" width="552" height="230" rx="20" fill="#e2efff" stroke="#b5d3fa" stroke-width="2"/>
    <text x="48" y="192" font-size="31" font-weight="700" fill="#155ca3">① 时间与对象</text>
    <text x="48" y="239" font-size="27">年份、月份：3月对3月</text>
    <text x="48" y="282" font-size="27">汽车总量 ≠ 新能源销量</text>
    <text x="48" y="325" font-size="27">小数点、单位别漏看</text>
    <text x="300" y="410" text-anchor="middle" font-size="37" fill="#7993b5">↓</text>
    <rect x="24" y="430" width="552" height="230" rx="20" fill="#e7f6ef" stroke="#abdcc2" stroke-width="2"/>
    <text x="48" y="477" font-size="31" font-weight="700" fill="#1a7953">② 问法与符号</text>
    <text x="48" y="524" font-size="27">平均数：分子 a、分母 b</text>
    <text x="48" y="567" font-size="27">下降率记负号</text>
    <text x="48" y="610" font-size="27">“多几倍”：先作差再除</text>
    <text x="300" y="695" text-anchor="middle" font-size="37" fill="#7993b5">↓</text>
    <rect x="24" y="715" width="552" height="230" rx="20" fill="#fff2dc" stroke="#f1d29d" stroke-width="2"/>
    <text x="48" y="762" font-size="31" font-weight="700" fill="#985c0d">③ 计算与边界</text>
    <text x="48" y="809" font-size="27">先判断数量级</text>
    <text x="48" y="852" font-size="27">接近选项分界时回乘</text>
    <text x="48" y="895" font-size="27">计算精度看选项间距</text>
    <text x="32" y="1011" font-size="27" font-weight="700">同题理解 ≠ 独立掌握</text>
    <text x="32" y="1055" font-size="25" fill="#52687d">后续用另一道完整真题验证</text>
  </g>
</svg>