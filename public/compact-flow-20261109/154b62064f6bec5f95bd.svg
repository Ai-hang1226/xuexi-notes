<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" role="img" aria-label="第134题｜同分母比重差"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="436" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第134题｜同分母比重差</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 找共同分母</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">集中式项目：46.77 亿个</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">风电 19.07，太阳能 </text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">8.03</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 先求数量差</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">19.07 − 8.03 = 11.04</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">再用差除以共同分母</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 换算百分点</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">11.04 ÷ 46.77 ≈ </text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">23.6%</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">高约 24 个百分点；参考</text><text x="830" y="316" font-size="27" font-weight="500" fill="#26374c"> C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/></g></g></svg>