<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">截位直除：看选项、定精度、截谁、核量级</title>
  <desc id="desc">先按选项选择试算精度；一步除法分子不变只截分母，多步乘除各因子截位再约分；最后核对误差和量级。</desc>
  <rect x="2" y="2" width="1396" height="786" rx="28" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="60" y="78" font-family="Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="#183153">截位直除：先看选项，再定精度</text>
  <rect x="55" y="110" width="1290" height="125" rx="20" fill="#eaf1ff" stroke="#94b5f4" stroke-width="3"/>
  <text x="82" y="160" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#194bab">看选项：差距较大先试两位；差距较小先试三位</text>
  <text x="82" y="207" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#183153">相邻很近或误差易累积 → 增加位数，再核验</text>
  <rect x="55" y="275" width="625" height="300" rx="20" fill="#ffffff" stroke="#a9bde2" stroke-width="3"/>
  <text x="85" y="335" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#194bab">一步除法</text>
  <text x="85" y="395" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#183153">分子不变，只截分母</text>
  <text x="85" y="460" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#183153">12345 ÷ 6789</text>
  <text x="85" y="512" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#183153">≈ 12345 ÷ 6800</text>
  <rect x="720" y="275" width="625" height="300" rx="20" fill="#e8f6f1" stroke="#85c9b2" stroke-width="3"/>
  <text x="750" y="335" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#087965">多步乘除</text>
  <text x="750" y="395" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#183153">各因子截位，再约分</text>
  <text x="750" y="460" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#183153">注意每个数的数量级</text>
  <text x="750" y="512" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#183153">留意连续计算的误差</text>
  <rect x="55" y="620" width="1290" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="82" y="686" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#7c3e08">最后：核对小数点、单位和选项分界</text>
</svg>
