<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1260" viewBox="0 0 1120 1260" role="img" aria-labelledby="title"><title id="title">五题申论首答基线，不直接比较能力趋势</title><rect width="1120" height="1260" rx="24" fill="#f4f7fc"/><style>text{font-family:'Times New Roman','Microsoft YaHei','微软雅黑',sans-serif;fill:#173758;font-size:32px;font-weight:600}.title{font-size:44px;font-weight:800}.head{font-size:38px;font-weight:800}.small{font-size:28px}</style><text x="44" y="70" class="title">我的申论｜五题首答基线</text><text x="44" y="122">评分：DAY5—7为10/28，DAY8—9为11/02</text><rect x="36" y="156" width="1048" height="138" rx="16" fill="white"/><text x="60" y="204" class="head">DAY5｜城市绿化 · 做法</text><rect x="60" y="233" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="233" width="475.3333333333333" height="28" rx="14" fill="#3568a0"/><text x="720" y="258">11.5／15 · 76.7%</text><rect x="36" y="314" width="1048" height="138" rx="16" fill="white"/><text x="60" y="362" class="head">DAY6｜营商环境 · 措施与成效</text><rect x="60" y="391" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="391" width="413.3333333333333" height="28" rx="14" fill="#3568a0"/><text x="720" y="416">10／15 · 66.7%</text><rect x="36" y="472" width="1048" height="138" rx="16" fill="white"/><text x="60" y="520" class="head">DAY7｜背包银行 · 特点与作用</text><rect x="60" y="549" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="549" width="372" height="28" rx="14" fill="#3568a0"/><text x="720" y="574">12／20 · 60.0%</text><rect x="36" y="630" width="1048" height="138" rx="16" fill="white"/><text x="60" y="678" class="head">DAY8｜创新公共服务 · 问题不足</text><rect x="60" y="707" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="707" width="475.3333333333333" height="28" rx="14" fill="#3568a0"/><text x="720" y="732">11.5／15 · 76.7%</text><rect x="36" y="788" width="1048" height="138" rx="16" fill="white"/><text x="60" y="836" class="head">DAY9｜Q市加数前行 · 原因</text><rect x="60" y="865" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="865" width="434" height="28" rx="14" fill="#3568a0"/><text x="720" y="890">7／10 · 70.0%</text><text x="44" y="1010" class="head">首答5份｜改写0份｜迁移0份</text><text x="44" y="1074" class="small">题型和难度不同，不能直接判断能力进步或退步。</text><text x="44" y="1126" class="small">同题改写、陌生同类题验证，按真实反馈另记。</text><text x="44" y="1178" class="small">实际作答日期和用时未知，未提交不填成绩。</text><text x="44" y="1230" class="small">学习性参考分；旧首答保留。</text></svg>