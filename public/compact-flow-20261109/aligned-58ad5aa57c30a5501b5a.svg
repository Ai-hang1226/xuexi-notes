<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" role="img" aria-label="选组长｜两个条件同时满足"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="608" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">选组长｜两个条件同时满足</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 先圈目标</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">组长 ＝ 中年 ＋ 语文</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">两个条件缺一不可</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 分别排查</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">年龄：中年为乙及丁或戊</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">科目：乙、戊是数学</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 合并条件</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">乙、戊排除</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">原页结论：丁是组长</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 代回核对</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">青年：甲、丙、戊</text><text x="638" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">中年：乙、丁；语文：甲、丁</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 194 H613"/><path d="M894 292 V318 H306 V343"/><path d="M584 442 H613"/></g></g></svg>