<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="第112题｜双打队伍"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="800" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第112题｜双打队伍</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 代入额外条件</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">网球队＝宋＋韩</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">因此网球队没有吴</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 用条件对应</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">王参加乒乓 ↔ 吴参加网</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">球</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">吴不在网球队 → 王不打</text><text x="440" y="316" font-size="27" font-weight="500" fill="#26374c">乒乓</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 核对不能同队</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">王与韩不能参加同一项目</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">王不在韩所在的网球队</text><rect x="30" y="430" width="360" height="264" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="468" font-size="31" font-weight="700" fill="#5e4487">④ 结合每人都参加</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">王只能参加羽毛球</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">题库参考B</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/><path d="M990 368 V397 H210 V425"/></g><text x="30" y="744" font-size="27" font-weight="600" fill="#3b4c61">详情见正文；参考法非首答。</text></g></svg>