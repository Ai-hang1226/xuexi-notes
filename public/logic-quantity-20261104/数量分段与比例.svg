<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="945" viewBox="0 0 1160 945"><style>text{font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;fill:#16333b;font-size:32px;font-weight:700}.title{font-size:44px}.head{font-size:38px}.muted{fill:#49636b}</style><rect width="1160" height="945" fill="#f4f8f7"/><text class="title" x="42" y="72">数量关系：把时间、对象和比例接起来</text><rect x="35" y="125" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="57" y="173">工作与休息</text><text x="57" y="225">含休息总时长 → 拆周期</text><text x="57" y="268">纯工作时间 → 补间隔</text><text x="57" y="311">任务完成，立即停表</text><rect x="605" y="125" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="627" y="173">相似与锥柱</text><text x="627" y="225">相似：长度比k → 体积k³</text><text x="627" y="268">同底等体积：锥高÷3</text><text x="627" y="311">圆柱段：高度与时间正比</text><rect x="35" y="360" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="57" y="408">车间分工</text><text x="57" y="460">比较甲相对乙的效率倍数</text><text x="57" y="503">优先安排相对优势任务</text><text x="57" y="546">一种完成，再合做剩余</text><rect x="605" y="360" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="627" y="408">有序枚举</text><text x="627" y="460">固定最大数，由大到小</text><text x="627" y="503">组内保持大 ≥ 中 ≥ 小</text><text x="627" y="546">分类查全，组内防重复</text><rect x="35" y="595" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="57" y="643">预算与所求时点</text><text x="57" y="695">原预算 → 减压缩额</text><text x="57" y="738">每个中间数写清对象</text><text x="57" y="781">选前回看“当前”二字</text><rect x="605" y="595" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="627" y="643">年龄组与整数比</text><text x="627" y="695">流入 − 流出 = 净变化</text><text x="627" y="738">跨70岁边界 → 次年71岁</text><text x="627" y="781">最简比例 → 人数倍数</text><text class="muted" x="42" y="910">复盘阈值用于筛题；不能仅凭用时判定方法错误</text></svg>