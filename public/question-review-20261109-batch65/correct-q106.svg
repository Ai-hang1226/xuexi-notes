<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 970" role="img" aria-label="第106题｜先锁定可用位置：一种可行安排与条件核对"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="600" height="970" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="56" font-size="40" font-weight="700" fill="#182a48">第106题｜先锁定可用位置</text><rect x="30" y="120" width="80" height="110" rx="12" fill="#fff0dd" stroke="#a6bad2" stroke-width="2"/><text x="70" y="151" text-anchor="middle" font-size="24" fill="#405671">1号</text><text x="70" y="207" text-anchor="middle" font-size="43" font-weight="700" fill="#203f62">B</text><rect x="120" y="120" width="80" height="110" rx="12" fill="#d9edff" stroke="#a6bad2" stroke-width="2"/><text x="160" y="151" text-anchor="middle" font-size="24" fill="#405671">2号</text><text x="160" y="207" text-anchor="middle" font-size="43" font-weight="700" fill="#203f62">C</text><rect x="210" y="120" width="80" height="110" rx="12" fill="#eef3fa" stroke="#a6bad2" stroke-width="2"/><text x="250" y="151" text-anchor="middle" font-size="24" fill="#405671">3号</text><text x="250" y="207" text-anchor="middle" font-size="43" font-weight="700" fill="#203f62">D</text><rect x="300" y="120" width="80" height="110" rx="12" fill="#d9edff" stroke="#a6bad2" stroke-width="2"/><text x="340" y="151" text-anchor="middle" font-size="24" fill="#405671">4号</text><text x="340" y="207" text-anchor="middle" font-size="43" font-weight="700" fill="#203f62">E</text><rect x="390" y="120" width="80" height="110" rx="12" fill="#eef3fa" stroke="#a6bad2" stroke-width="2"/><text x="430" y="151" text-anchor="middle" font-size="24" fill="#405671">5号</text><text x="430" y="207" text-anchor="middle" font-size="43" font-weight="700" fill="#203f62">A</text><rect x="480" y="120" width="80" height="110" rx="12" fill="#fff0dd" stroke="#a6bad2" stroke-width="2"/><text x="520" y="151" text-anchor="middle" font-size="24" fill="#405671">6号</text><text x="520" y="207" text-anchor="middle" font-size="43" font-weight="700" fill="#203f62">F</text><text x="35" y="278" font-size="26" fill="#405671">一种可行排列，颜色帮助定位已知位置。</text><rect x="30" y="385" width="540" height="155" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="52" y="432" font-size="36" font-weight="700" fill="#173d79">① 固定 C 与 E</text><text x="52" y="479" font-size="30" fill="#26374c">C 在 2 号；E 在 4 号</text><text x="52" y="522" font-size="30" fill="#26374c">A、F 都不能挨着 C</text><path d="M300 545 V568" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="575" width="540" height="155" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="52" y="622" font-size="36" font-weight="700" fill="#78511c">② 看 A、F 剩余位置</text><text x="52" y="669" font-size="30" fill="#26374c">1、3 紧邻 C；4 已放 E</text><text x="52" y="712" font-size="30" fill="#26374c">因此 A、F 占 5、6 号</text><path d="M300 735 V758" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="765" width="540" height="155" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="52" y="812" font-size="36" font-weight="700" fill="#176659">③ 展示一种可行排列</text><text x="52" y="859" font-size="30" fill="#26374c">1—6 号：B C D E A F</text><text x="52" y="902" font-size="30" fill="#26374c">B 在 1 号可行；参考 A</text></g></svg>