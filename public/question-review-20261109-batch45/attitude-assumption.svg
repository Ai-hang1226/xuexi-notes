<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 816" role="img" aria-label="态度题｜区分请求与结果"><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="816" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="40" font-weight="700" fill="#182a48">态度题｜区分请求与结果</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="149" font-size="38" font-weight="700" fill="#173d79">① 题干已知</text><text x="54" y="198" font-size="31" fill="#26374c">甲希望乙告知态度</text><text x="54" y="242" font-size="31" fill="#26374c">乙的态度会影响甲</text><path d="M300 268 V293" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="54" y="355" font-size="38" font-weight="700" fill="#78511c">② 不要直接跳步</text><text x="54" y="404" font-size="31" fill="#26374c">请求乙告知</text><text x="54" y="448" font-size="31" fill="#26374c">不等于乙一定会告知</text><path d="M300 474 V499" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="54" y="561" font-size="38" font-weight="700" fill="#176659">③ 留意原题边界</text><text x="54" y="610" font-size="31" fill="#26374c">现存为题干与选项摘要</text><text x="54" y="654" font-size="31" fill="#26374c">须结合完整设问判断</text><text x="32" y="791" font-size="24" fill="#73501d">“不能确定会告知”不等于“不可能告知”。</text></g></svg>