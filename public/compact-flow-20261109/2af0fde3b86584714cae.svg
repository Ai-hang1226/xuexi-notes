<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="语句排序｜先衔接再验证"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">语句排序｜先衔接再验证</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 看选项差异</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">哪里顺序不同？</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">优先比较这些位置</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 标句子功能</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">背景、观点、解释</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">例子、转折或对策</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 找衔接证据</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">指代、因果、时间</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">话题怎样继续？</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 比候选组合</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">哪组更直接？</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">需要补的假设更少？</text><rect x="420" y="350" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="440" y="388" font-size="31" font-weight="700" fill="#173d79">⑤ 验证整体</text><text x="440" y="446" font-size="27" font-weight="500" fill="#26374c">指代有着落</text><text x="440" y="486" font-size="27" font-weight="500" fill="#26374c">话题和逻辑连贯</text><rect x="810" y="350" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="388" font-size="31" font-weight="700" fill="#176659">⑥ 回答题问</text><text x="830" y="446" font-size="27" font-weight="500" fill="#26374c">通读完整顺序</text><text x="830" y="486" font-size="27" font-weight="500" fill="#26374c">别只凭局部顺口</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/><path d="M990 288 V317 H210 V345"/><path d="M392 442 H415"/><path d="M782 442 H805"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">方法供检查，陌生题独立运用仍需验证。</text></g></svg>