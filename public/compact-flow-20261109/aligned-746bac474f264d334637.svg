<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="数量题，先选方法"><rect width="1200" height="620" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">数量题，先选方法</text><text x="30" y="105" font-size="27" fill="#526378" font-weight="600" xml:space="preserve">先认线索，再调用方法</text><rect x="30" y="145" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">比例／平均值</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">共同尺度能消去</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">可赋值；真实参数设元</text><rect x="618" y="145" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">计数／比赛概率</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">先查违规、同组条件</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">再数合法情况或求概率</text><rect x="30" y="373" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="413" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">数字规律</text><text x="50" y="468" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">数位内部→相邻运算</text><text x="50" y="510" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">还可试同一除数取余</text><rect x="618" y="373" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="413" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">几何／辅助线</text><text x="638" y="468" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">平行边＋斜边→补直角</text><text x="638" y="510" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">勾股求宽→面积作差</text><text x="30" y="588" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">各方法均须回到原题核验</text></g></svg>