<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" role="img" aria-label="第67题｜先算费用下界"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="566" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第67题｜先算费用下界</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 至少要几辆</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">6 辆最多运 6 × 24 = 144 吨</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不足 160 吨，至少 7 辆</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 算最低可能费用</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">每辆车费用至少 350 元</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">7 × 350 = 2450 元</text><rect x="30" y="328" width="1140" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 验证能否达到</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">7 辆 A 车运 168 吨</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">7 名司机；参考 A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H600 V323"/></g></g></svg>