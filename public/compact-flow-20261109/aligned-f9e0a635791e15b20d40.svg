<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 653" role="img" aria-label="图形：按组成找规律"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="653" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">图形：按组成找规律</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">平面与空间，分路观察</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">平面图｜先看组成</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">同：位置；似：样式</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">异：数量、属性</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#7e591c" font-weight="700" xml:space="preserve">不同元素｜查两类</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">数：面、线、点、笔画</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">看：对称、曲直、封闭</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">空间图｜另走此路</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">特殊面 → 箭头判邻位</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">面太远 → 移面再画箭头</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">空间核对｜再验证</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">公共棱、时针法辅助</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">方向与相邻面一起核对</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M584 487 H613"/></g></g></svg>