<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1270" viewBox="0 0 500 1270" role="img" aria-labelledby="title desc">
<title id="title">错题复盘闭环</title>
<desc id="desc">来源：站内《学习闭环》通用框架与三模块专项复盘。按归位、找病因、记对策、新题复测循环；复盘完成不等于独立掌握，猜对题仍须验证。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5777a8" stroke-width="2"/></marker></defs>
<rect width="500" height="1270" rx="24" fill="#f3f7fd"/>
<g font-family="'Times New Roman', 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Hiragino Sans GB', sans-serif" fill="#162a4b">
<text x="250" y="70" font-size="44" font-weight="800" text-anchor="middle">错题复盘闭环</text>
<text x="250" y="120" font-size="32" font-weight="600" text-anchor="middle">错题、猜对、慢题都检查</text>
<rect x="20" y="150" width="460" height="180" rx="20" fill="#fff" stroke="#bfd0e8" stroke-width="2"/>
<text x="44" y="204" font-size="38" font-weight="800" fill="#2b5288">① 归位</text>
<text x="44" y="256" font-size="32" font-weight="600">定位模块和知识点</text>
<text x="44" y="302" font-size="32" font-weight="600">关联真实方法笔记</text>
<path d="M250 339 V366" fill="none" stroke="#5777a8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="380" width="460" height="180" rx="20" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/>
<text x="44" y="434" font-size="38" font-weight="800" fill="#7e591c">② 找病因</text>
<text x="44" y="486" font-size="32" font-weight="600">条件漏看？方法不会？</text>
<text x="44" y="532" font-size="32" font-weight="600">计算出错？速度偏慢？</text>
<path d="M250 569 V596" fill="none" stroke="#5777a8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="610" width="460" height="180" rx="20" fill="#fff" stroke="#bfd0e8" stroke-width="2"/>
<text x="44" y="664" font-size="38" font-weight="800" fill="#2b5288">③ 记对策</text>
<text x="44" y="716" font-size="32" font-weight="600">留下可复用的触发线索</text>
<text x="44" y="762" font-size="32" font-weight="600">写清方法和易错提醒</text>
<path d="M250 799 V826" fill="none" stroke="#5777a8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="840" width="460" height="180" rx="20" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/>
<text x="44" y="894" font-size="38" font-weight="800" fill="#176552">④ 新题复测</text>
<text x="44" y="946" font-size="32" font-weight="600">遮住解析，独立做新题</text>
<text x="44" y="992" font-size="32" font-weight="600">记录正确率、用时和错因</text>
<text x="250" y="1082" font-size="38" font-weight="800" text-anchor="middle" fill="#7e591c">猜对仍待验证</text>
<text x="250" y="1134" font-size="32" font-weight="600" text-anchor="middle">复盘完成 ≠ 独立掌握</text>
<text x="250" y="1184" font-size="32" font-weight="600" text-anchor="middle">未通过 → 回到找病因</text>
<text x="250" y="1234" font-size="32" font-weight="600" text-anchor="middle">跨时间复测，再更新状态</text>
</g></svg>
