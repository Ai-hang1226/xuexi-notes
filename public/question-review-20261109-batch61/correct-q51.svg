<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="第51题｜拆开点号看差值：参考核算"><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="760" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="40" font-weight="700" fill="#182a48">第51题｜拆开点号看差值</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="149" font-size="38" font-weight="700" fill="#173d79">① 点号两侧分别看</text><text x="54" y="198" font-size="31" fill="#26374c">13 − 1 = 12；18 − 3 = 15</text><text x="54" y="242" font-size="31" fill="#26374c">25 − 7 = 18；25 − 4 = 21</text><path d="M300 268 V293" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="54" y="355" font-size="38" font-weight="700" fill="#78511c">② 差值每次增加 3</text><text x="54" y="404" font-size="31" fill="#26374c">再算 33 − 9 = 24</text><text x="54" y="448" font-size="31" fill="#26374c">下一项应有差值 27</text><path d="M300 474 V499" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="54" y="561" font-size="38" font-weight="700" fill="#176659">③ 对照选项</text><text x="54" y="610" font-size="31" fill="#26374c">35 − 8 = 27</text><text x="54" y="654" font-size="31" fill="#26374c">参考 B：8.35</text></g></svg>