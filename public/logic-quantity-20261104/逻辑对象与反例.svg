<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="710" viewBox="0 0 1160 710"><style>text{font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;fill:#16333b;font-size:32px;font-weight:700}.title{font-size:44px}.head{font-size:38px}.muted{fill:#49636b}</style><rect width="1160" height="710" fill="#f4f8f7"/><text class="title" x="42" y="72">逻辑判断：固定对象，再判断关系</text><rect x="35" y="125" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="57" y="173">对象与结论</text><text x="57" y="225">细菌 ≠ 提取的衍生产物</text><text x="57" y="268">安全、有效可分别补证</text><text x="57" y="311">论据按题内已知使用</text><rect x="605" y="125" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="627" y="173">因果链方向</text><text x="627" y="225">原原因 → 中间环节 → 结果</text><text x="627" y="268">补通机制可以支持</text><text x="627" y="311">反向因果可削弱原归因</text><rect x="35" y="360" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="57" y="408">同条件反例</text><text x="57" y="460">A → B；反例为A且非B</text><text x="57" y="503">对齐对象、程度和条件</text><text x="57" y="546">强刺激不能替代轻刺激</text><rect x="605" y="360" width="550" height="212" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="627" y="408">范围词与必选项</text><text x="627" y="460">“通常”允许个别例外</text><text x="627" y="503">连锁超量 → 分情况</text><text x="627" y="546">全部合法情况取交集</text><text class="muted" x="42" y="675">关系判断与真实慢因分开；讨论理解仍待新题验证</text></svg>