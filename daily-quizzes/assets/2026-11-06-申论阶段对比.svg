<svg xmlns="http://www.w3.org/2000/svg" id="essay-stages" width="760" height="1060" viewBox="0 0 760 1060">
<style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-weight:700;fill:#18363a}.title{font-size:44px}.head{font-size:38px}.body{font-size:32px}</style>
<rect width="760" height="1060" rx="24" fill="#f4f8f7"/><text x="30" y="65" class="title">互联网发展：先抓四组内容</text>
<text x="30" y="115" class="body">三段、四段都要回到材料核对</text>
<rect x="24" y="145" width="712" height="165" rx="18" fill="#dceee7"/><text x="44" y="193" class="head">① 接入与起步</text><text x="44" y="243" class="body">接入国际互联网；慢、少 → 普及</text><text x="44" y="287" class="body">从模仿到孕育内生力量</text>
<rect x="24" y="330" width="712" height="165" rx="18" fill="#e8edf8"/><text x="44" y="378" class="head">② 迈向网络大国</text><text x="44" y="428" class="body">三项第一；企业快速发展</text><text x="44" y="472" class="body">互联网＋拓展并获国家重视</text>
<rect x="24" y="515" width="712" height="165" rx="18" fill="#f3e7d8"/><text x="44" y="563" class="head">③ 建设网络强国</text><text x="44" y="613" class="body">提出目标；乌镇大会搭建平台</text><text x="44" y="657" class="body">共享共治；参与全球网络治理</text>
<rect x="24" y="700" width="712" height="165" rx="18" fill="#dceee7"/><text x="44" y="748" class="head">④ 新技术与自主创新</text><text x="44" y="798" class="body">5G商用；展现多样应用场景</text><text x="44" y="842" class="body">区块链：核心技术自主创新</text>
<text x="30" y="925" class="body">三段写法可将③④放在同一阶段，</text><text x="30" y="973" class="body">关键是治理和技术两组信息都覆盖。</text><text x="30" y="1020" class="body">本图为学习整理，不代表官方评分。</text>
</svg>