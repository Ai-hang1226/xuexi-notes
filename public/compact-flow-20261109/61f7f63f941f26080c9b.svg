<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="逻辑判断｜四类检查"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">逻辑判断｜四类检查</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">对象与结论</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">细菌 ≠ 衍生产物</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">安全与有效可分别核对</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">因果链方向</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">新信息补通还是切断关系？</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">不自行否认题内已知论据</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">同条件反例</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">A → B；反例为 A 且非 B</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">对象、条件、程度须对齐</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">范围词与必选</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">“通常”允许个别例外</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">必选项取全部合法情况交集</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">理解与独立应用分开；慢因按事实记录。</text></g></svg>