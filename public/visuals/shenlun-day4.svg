<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130" viewBox="0 0 1120 1130" role="img" aria-labelledby="title desc">
<title id="title">DAY4｜F市城市绿化</title><desc id="desc">只问主要做法。四类行动：民主决策、科学养护、保护利用古树、节俭高效绿化。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526078"/></marker></defs>
<rect width="1120" height="1130" fill="#f4f7fb"/>
<g font-family="'Times New Roman', 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Hiragino Sans GB', sans-serif" fill="#172a43">
<text x="48" y="76" font-size="44" font-weight="800">DAY4｜F市城市绿化</text>
<text x="48" y="134" font-size="32" fill="#263b55" font-weight="600">做法题：总括一类行动，再保留关键操作</text>
<rect x="40" y="190" width="500" height="340" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="243" font-size="38" fill="#216b63" font-weight="800">1. 民主决策</text>
<text x="66" y="290" font-size="32" fill="#263b55" font-weight="600">多渠道征求民意</text>
<text x="66" y="334" font-size="32" fill="#263b55" font-weight="600">调研论证</text>
<text x="66" y="378" font-size="32" fill="#263b55" font-weight="600">因地制宜种乡土树木</text>
<rect x="580" y="190" width="500" height="340" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="606" y="243" font-size="38" fill="#216b63" font-weight="800">2. 科学养护</text>
<text x="606" y="290" font-size="32" fill="#263b55" font-weight="600">研究本地养护办法</text>
<text x="606" y="334" font-size="32" fill="#263b55" font-weight="600">精细管理</text>
<text x="606" y="378" font-size="32" fill="#263b55" font-weight="600">监测分析、针对修复</text>
<rect x="40" y="575" width="500" height="400" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="628" font-size="38" fill="#216b63" font-weight="800">3. 保护利用古树</text>
<text x="66" y="675" font-size="32" fill="#263b55" font-weight="600">保护：调查登记、建库挂牌</text>
<text x="66" y="719" font-size="32" fill="#263b55" font-weight="600">　　　智慧平台、技术跟踪</text>
<text x="66" y="763" font-size="32" fill="#263b55" font-weight="600">利用：开发古树资源</text>
<text x="66" y="807" font-size="32" fill="#263b55" font-weight="600">　　　融合绿化、经济、文化</text>
<rect x="580" y="575" width="500" height="400" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="606" y="628" font-size="38" fill="#216b63" font-weight="800">4. 节俭高效绿化</text>
<text x="606" y="675" font-size="32" fill="#263b55" font-weight="600">建设口袋公园</text>
<text x="606" y="719" font-size="32" fill="#263b55" font-weight="600">观赏、休闲、娱乐、科普</text>
<text x="606" y="763" font-size="32" fill="#263b55" font-weight="600">串点成线、连线成片</text>
<text x="48" y="1042" font-size="32" fill="#263b55" font-weight="600">复习重点：先把行动分组，再给整组命名。</text>
<text x="48" y="1090" font-size="32" fill="#263b55" font-weight="600">本人的下一步：只重写第3条“保护＋利用”。</text>
</g></svg>