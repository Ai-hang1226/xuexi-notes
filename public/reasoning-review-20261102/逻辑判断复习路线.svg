<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-labelledby="t d"><title id="t">逻辑判断：先找要证明的结果</title><desc id="d">本轮两题的方法路线，讨论完成与独立运用分别记录。</desc><rect width="1240" height="480" rx="20" fill="#f5f7fa"/><g font-family="Times New Roman,Microsoft YaHei,微软雅黑,sans-serif" fill="#182b43" font-weight="700"><text x="48" y="66" font-size="44">逻辑判断：先找要证明的结果</text><rect x="48" y="108" width="550" height="266" rx="15" fill="#e8f2ed"/><text x="72" y="164" font-size="38">第6题｜不补关键事实</text><text x="72" y="225" font-size="32">B只说使用范围有限</text><text x="72" y="283" font-size="32">损失更大是自己补入的</text><text x="72" y="341" font-size="32">C补操作失误这一原因</text><rect x="638" y="108" width="550" height="266" rx="15" fill="#e8eff6"/><text x="662" y="164" font-size="38">第10题｜核对条件的对象</text><text x="662" y="225" font-size="32">C讨论吸血与繁殖能量</text><text x="662" y="283" font-size="32">题干讨论气味与寻找猎物</text><text x="662" y="341" font-size="32">D直接补气味缺失后的表现</text><text x="48" y="439" font-size="32">原答和真实用时保留；听懂与认可不等于独立新题掌握。</text></g></svg>
