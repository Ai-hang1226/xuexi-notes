<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第2题｜双空一起看"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第2题｜双空一起看</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 读上下文</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">快递物流是经济活力的</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">“风向标”</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 比较第一空</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">名副其实：名实相符</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">当之无愧：有资格担当</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 比较第二空</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">映照、折射均可表达反映</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">两空结合全文检查</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 保留证据边界</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">题库参考B，本人首答C</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">A、C缺少绝对排除证据</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/><path d="M990 288 V317 H210 V345"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">不把有争议的排除理由当定论。</text></g></svg>