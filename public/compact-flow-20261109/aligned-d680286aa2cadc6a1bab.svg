<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 338" role="img" aria-label="关键词题｜两种口径对照"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="338" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">关键词题｜两种口径对照</text><rect x="30" y="100" width="360" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 文段两处重点</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">开头：知情同意、自决权</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">结尾：风险承担</text><rect x="420" y="100" width="360" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="140" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 既有记录存在分歧</text><text x="440" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">A：强调末句风险承担</text><text x="440" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">D：强调患者自决权</text><rect x="810" y="100" width="360" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 不当成唯一结论</text><text x="830" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">本人原选 D；应用参考 A</text><text x="830" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不同来源口径待核</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 184 H415"/><path d="M782 184 H805"/></g></g></svg>