<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 945" role="img" aria-label="第132题｜累计量还原当年：参考核算与数据对比"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="600" height="945" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="56" font-size="40" font-weight="700" fill="#182a48">第132题｜累计量还原当年</text><text x="45" y="100" font-size="27" fill="#405671">年末累计核发量（万个）</text><path d="M60 300 H550" stroke="#8aa0bb" stroke-width="2"/><rect x="105" y="268" width="85" height="32" rx="4" fill="#8bb8e7"/><rect x="250" y="251" width="85" height="49" rx="4" fill="#6ca5df"/><rect x="395" y="120" width="85" height="180" rx="4" fill="#397bbd"/><text x="147" y="259" text-anchor="middle" font-size="25" fill="#244869">3893</text><text x="292" y="242" text-anchor="middle" font-size="25" fill="#244869">5954</text><text x="437" y="111" text-anchor="middle" font-size="25" fill="#244869">22075</text><text x="147" y="330" text-anchor="middle" font-size="25" fill="#405671">2021末</text><text x="292" y="330" text-anchor="middle" font-size="25" fill="#405671">2022末</text><text x="437" y="330" text-anchor="middle" font-size="25" fill="#405671">2023末</text><rect x="30" y="365" width="540" height="155" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="52" y="412" font-size="36" font-weight="700" fill="#173d79">① 相邻累计量相减</text><text x="52" y="459" font-size="30" fill="#26374c">2022：5954 − 3893 = 2061</text><text x="52" y="502" font-size="30" fill="#26374c">2023：22075 − 5954 = 16121</text><path d="M300 525 V548" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="555" width="540" height="155" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="52" y="602" font-size="36" font-weight="700" fill="#78511c">② 比较当年核发量</text><text x="52" y="649" font-size="30" fill="#26374c">16121 ÷ 2061 ≈ 7.82</text><text x="52" y="692" font-size="30" fill="#26374c">约为 7.8 倍</text><path d="M300 715 V738" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="745" width="540" height="155" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="52" y="792" font-size="36" font-weight="700" fill="#176659">③ 对照原卷记录</text><text x="52" y="839" font-size="30" fill="#26374c">参考 D；原卷首答 D</text><text x="52" y="882" font-size="30" fill="#26374c">本人具体方法与用时未知</text></g></svg>