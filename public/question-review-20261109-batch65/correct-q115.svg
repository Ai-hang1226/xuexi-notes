<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 970" role="img" aria-label="第115题｜给出可行例子：一种可行安排与条件核对"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="600" height="970" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="56" font-size="40" font-weight="700" fill="#182a48">第115题｜给出可行例子</text><rect x="55" y="95" width="490" height="62" rx="12" fill="#e8f0ff"/><text x="80" y="137" font-size="30" font-weight="700" fill="#284767">网球</text><text x="345" y="137" font-size="34" font-weight="700" fill="#243e5d">王、宋</text><rect x="55" y="171" width="490" height="62" rx="12" fill="#fff2df"/><text x="80" y="213" font-size="30" font-weight="700" fill="#284767">乒乓球</text><text x="345" y="213" font-size="34" font-weight="700" fill="#243e5d">宋、韩</text><rect x="55" y="247" width="490" height="62" rx="12" fill="#e8f6f2"/><text x="80" y="289" font-size="30" font-weight="700" fill="#284767">羽毛球</text><text x="345" y="289" font-size="34" font-weight="700" fill="#243e5d">吴、宋</text><text x="55" y="350" font-size="25" fill="#52657d">图中是一种可行安排，不代表唯一。</text><rect x="30" y="385" width="540" height="155" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="52" y="432" font-size="36" font-weight="700" fill="#173d79">① 固定已知乒乓队</text><text x="52" y="479" font-size="30" fill="#26374c">乒乓球：宋、韩</text><text x="52" y="522" font-size="30" fill="#26374c">王不打乒乓 → 吴不打网球</text><path d="M300 545 V568" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="575" width="540" height="155" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="52" y="622" font-size="36" font-weight="700" fill="#78511c">② 构造一种安排</text><text x="52" y="669" font-size="30" fill="#26374c">网球：王、宋；乒乓：宋、韩</text><text x="52" y="712" font-size="30" fill="#26374c">羽毛球：吴、宋</text><path d="M300 735 V758" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="765" width="540" height="155" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="52" y="812" font-size="36" font-weight="700" fill="#176659">③ 验证各条条件</text><text x="52" y="859" font-size="30" fill="#26374c">王、韩不共队；四人均参加</text><text x="52" y="902" font-size="30" fill="#26374c">吴、宋打羽毛球可行；参考 D</text></g></svg>