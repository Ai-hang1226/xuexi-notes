<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1300" viewBox="0 0 1120 1300" role="img" aria-labelledby="title desc">
<title id="title">申论概括｜先分任务，再组织</title><desc id="desc">左列只概括主要做法；右列概括措施与成效。两种题目分别组织，改写和陌生题验证仍待完成。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526078"/></marker></defs>
<rect width="1120" height="1300" fill="#f4f7fb"/>
<g font-family="'Times New Roman', 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Hiragino Sans GB', sans-serif" fill="#172a43">
<text x="48" y="76" font-size="44" font-weight="800">申论概括｜先分任务，再组织</text>
<text x="48" y="134" font-size="32" fill="#263b55" font-weight="600">同样找信息，最终答案的组织方式不同</text>
<rect x="40" y="185" width="500" height="130" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="238" font-size="38" fill="#216b63" font-weight="800">DAY5｜只问做法</text>
<rect x="580" y="185" width="500" height="130" rx="20" fill="white" stroke="#315fa8" stroke-width="3"/>
<text x="606" y="238" font-size="38" fill="#315fa8" font-weight="800">DAY6｜措施＋成效</text>
<rect x="40" y="365" width="500" height="160" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="418" font-size="38" fill="#216b63" font-weight="800">读清任务</text>
<text x="66" y="465" font-size="32" fill="#263b55" font-weight="600">已经做了什么？</text>
<path d="M290,530 L290,550" stroke="#526078" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="560" width="500" height="160" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="613" font-size="38" fill="#216b63" font-weight="800">筛选行动</text>
<text x="66" y="660" font-size="32" fill="#263b55" font-weight="600">决策、养护、古树、公园</text>
<path d="M290,725 L290,745" stroke="#526078" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="755" width="500" height="160" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="808" font-size="38" fill="#216b63" font-weight="800">归类并概括</text>
<text x="66" y="855" font-size="32" fill="#263b55" font-weight="600">同类行动合并</text>
<text x="66" y="899" font-size="32" fill="#263b55" font-weight="600">给整组内容命名</text>
<path d="M290,920 L290,940" stroke="#526078" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="950" width="500" height="160" rx="20" fill="white" stroke="#216b63" stroke-width="3"/>
<text x="66" y="1003" font-size="38" fill="#216b63" font-weight="800">组织答案</text>
<text x="66" y="1050" font-size="32" fill="#263b55" font-weight="600">总括做法＋行动主干</text>
<rect x="580" y="365" width="500" height="160" rx="20" fill="white" stroke="#315fa8" stroke-width="3"/>
<text x="606" y="418" font-size="38" fill="#315fa8" font-weight="800">读清任务</text>
<text x="606" y="465" font-size="32" fill="#263b55" font-weight="600">做了什么？效果怎样？</text>
<path d="M830,530 L830,550" stroke="#526078" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="580" y="560" width="500" height="160" rx="20" fill="white" stroke="#315fa8" stroke-width="3"/>
<text x="606" y="613" font-size="38" fill="#315fa8" font-weight="800">分别找点</text>
<text x="606" y="660" font-size="32" fill="#263b55" font-weight="600">措施：具体行动</text>
<text x="606" y="704" font-size="32" fill="#263b55" font-weight="600">成效：结果与变化</text>
<path d="M830,725 L830,745" stroke="#526078" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="580" y="755" width="500" height="160" rx="20" fill="white" stroke="#315fa8" stroke-width="3"/>
<text x="606" y="808" font-size="38" fill="#315fa8" font-weight="800">逐组配对</text>
<text x="606" y="855" font-size="32" fill="#263b55" font-weight="600">一类措施 → 对应成效</text>
<path d="M830,920 L830,940" stroke="#526078" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="580" y="950" width="500" height="160" rx="20" fill="white" stroke="#315fa8" stroke-width="3"/>
<text x="606" y="1003" font-size="38" fill="#315fa8" font-weight="800">组织答案</text>
<text x="606" y="1050" font-size="32" fill="#263b55" font-weight="600">总括措施＋操作＋成效</text>
<text x="48" y="1210" font-size="32" fill="#263b55" font-weight="600">已讨论、已归档；本人改写与陌生题验证待完成。</text>
</g></svg>