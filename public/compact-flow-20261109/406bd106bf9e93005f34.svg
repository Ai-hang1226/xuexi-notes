<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第2题｜检查句子"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第2题｜检查句子</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 检查主语</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">A句“通过……使……”</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">缺少明确的主语</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 检查搭配</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">B句“提高办事流程”</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">动宾搭配不当</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 检查句式</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">C句“原因是由于……造</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">成”</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">两种原因句式混用</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 回看 D</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">主体、动作、对象清楚</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">结构完整 → D</text><g fill="none" strok