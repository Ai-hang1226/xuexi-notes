<svg id="quiz-figure" xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-label="11月6日真题复测：原卷成绩、三项修复与状态边界"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173147;font-size:32px;font-weight:600}.title{font-size:44px;font-weight:800}.head{font-size:38px;font-weight:800}.small{font-size:30px}</style><rect width="100%" height="100%" fill="#f5f8fb"/><text x="48" y="70" class="title">11月6日真题复测｜首答诊断</text><text x="48" y="128" class="">行测 4/8 · 12分钟　申论 10.5/20 · 16分钟</text><rect x="32" y="180" width="1136" height="230" rx="20" fill="#e7f2fc"/><text x="56" y="230" class="head">① 申论：补回整段，先保覆盖</text><text x="56" y="284" class="">已有：起步与发展阶段；2019年技术名称</text><text x="56" y="330" class="">遗漏：网络强国目标、乌镇平台、全球治理</text><text x="56" y="376" class="">动作：回查每段主题，再给阶段命名</text><rect x="32" y="440" width="1136" height="230" rx="20" fill="#f1ebfc"/><text x="56" y="490" class="head">② 错题：关系与范围要对应</text><text x="56" y="544" class="">第2题：两空一起比较语境和搭配</text><text x="56" y="590" class="">第3题：交叉关系 ≠ 种属包含</text><text x="56" y="636" class="">第7、8题：限定对象与科技知识需补</text><rect x="32" y="700" width="1136" height="230" rx="20" fill="#e6f3ed"/><text x="56" y="750" class="head">③ 第5、6题：答对但仍不稳</text><text x="56" y="804" class="">浓度：总量、溶质两列，按每步条件连接</text><text x="56" y="850" class="">单价：金额增速与数量增速同口径比较</text><text x="56" y="896" class="">下一步：选另一道真题验证</text><text x="48" y="1007" class="small">提交11月7日；第7、8题猜选；独立掌握未验证</text></svg>