<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 899.5999999999999" role="img" aria-label="第63题｜梯形扩成长方形"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="899.5999999999999" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第63题｜梯形扩成长方形</text><svg x="240" y="100" width="720" height="345.59999999999997" viewBox="0 60 600 288" overflow="hidden"><defs><marker id="dim" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#cd6c20"/></marker><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="600" height="930" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><rect x="90" y="100" width="420" height="190" fill="#fff0dd" stroke="#ba7a32" stroke-width="3" stroke-dasharray="8 6"/><polygon points="174,100 426,100 510,290 90,290" fill="#dceefc" stroke="#264d78" stroke-width="4"/><path d="M174 100 L510 290 M426 100 L90 290" stroke="#5a76a2" stroke-width="3"/><circle cx="300" cy="171" r="5" fill="#b44f31"/><text x="160" y="91" font-size="26" fill="#203b5a">A</text><text x="429" y="91" font-size="26" fill="#203b5a">B</text><text x="66" y="310" font-size="26" fill="#203b5a">C</text><text x="514" y="310" font-size="26" fill="#203b5a">D</text><text x="306" y="165" font-size="25" fill="#a34326">O</text><text x="268" y="92" font-size="26" fill="#1d5b87">上底 3</text><text x="267" y="321" font-size="26" fill="#1d5b87">下底 5</text><rect x="30" y="350" width="540" height="155" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="52" y="397" font-size="36" font-weight="700" fill="#173d79">