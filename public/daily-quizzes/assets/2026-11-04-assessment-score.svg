<svg xmlns="http://www.w3.org/2000/svg" width="520" height="960" viewBox="0 0 520 960"><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18363a;font-weight:700}.title{font-size:40px}.num{font-size:48px}.body{font-size:32px}.small{font-size:29px}</style><rect width="520" height="960" rx="22" fill="#f3f7f6"/><text x="28" y="60" class="title">阶段测评 · 首答</text><rect x="24" y="88" width="472" height="164" rx="18" fill="#c9e8df"/><text x="44" y="135" class="body">两科等权模拟折算</text><text x="44" y="195" class="num">76／100</text><text x="44" y="235" class="small">78×50%＋74×50%</text><rect x="24" y="272" width="472" height="164" rx="18" fill="#dceee7"/><text x="44" y="319" class="body">行测 · 39／50题</text><text x="44" y="379" class="num">78／100</text><text x="44" y="419" class="small">实际用时43分钟</text><rect x="24" y="456" width="472" height="164" rx="18" fill="#e8edf8"/><text x="44" y="503" class="body">申论 · 学习性参考分</text><text x="44" y="563" class="num">18.5／25</text><text x="44" y="603" class="small">用时约15分钟 · 约462字</text><rect x="24" y="640" width="472" height="164" rx="18" fill="#f3e7d8"/><text x="44" y="687" class="body">原卷诊断总分</text><text x="44" y="747" class="num">96.5／125</text><text x="44" y="787" class="small">原卷得分率77.2%</text><text x="28" y="851" class="small">两部分作答合计约58分钟</text><text x="28" y="891" class="small">不能作为正式考试预测分</text><text x="28" y="931" class="small">2026-11-04 · 保留首答</text></svg>