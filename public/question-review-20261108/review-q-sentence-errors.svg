<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1390" role="img" aria-labelledby="t d"><title id="t">语病辨析｜先看句子主干</title><desc id="d">根据已有方法指南制作的六步竖向速查图。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1390" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">语病辨析｜先看句子主干</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">① 找主干</text><text x="58" y="198" font-size="32" fill="#26374c">谁做什么？</text><text x="58" y="242" font-size="32" fill="#26374c">说的是什么？</text><path d="M300 268 V294" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="355" font-size="38" font-weight="700" fill="#176659">② 检查搭配</text><text x="58" y="404" font-size="32" fill="#26374c">主谓、动宾与修饰</text><text x="58" y="448" font-size="32" fill="#26374c">并列项分别代回</text><path d="M300 474 V500" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="561" font-size="38" font-weight="700" fill="#78511c">③ 语序和句式</text><text x="58" y="610" font-size="32" fill="#26374c">修饰位置是否合适？</text><text x="58" y="654" font-size="32" fill="#26374c">是否混用了两种句式？</text><path d="M300 680 V706" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="718" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="767" font-size="38" font-weight="700" fill="#5e4487">④ 指代和歧义</text><text x="58" y="816" font-size="32" fill="#26374c">对象指的是谁？</text><text x="58" y="860" font-size="32" fill="#26374c">会不会出现两种理解？</text><path d="M300 886 V912" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="924" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="973" font-size="38" font-weight="700" fill="#173d79">⑤ 检查逻辑</text><text x="58" y="1022" font-size="32" fill="#26374c">否定、数量、范围</text><text x="58" y="1066" font-size="32" fill="#26374c">是否符合原意？</text><path d="M300 1092 V1118" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="1130" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="1179" font-size="38" font-weight="700" fill="#176659">⑥ 回到题问</text><text x="58" y="1228" font-size="32" fill="#26374c">选有语病还是没有？</text><text x="58" y="1272" font-size="32" fill="#26374c">比较各项明确缺陷</text><text x="36" y="1370" font-size="26" font-weight="600" fill="#3b4c61">方法供检查，陌生题独立运用仍需验证。</text></g></svg>