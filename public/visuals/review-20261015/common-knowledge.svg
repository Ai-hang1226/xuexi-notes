<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1200" viewBox="0 0 500 1200" role="img" aria-labelledby="title desc">
<title id="title">常识积累：一条知识四步记</title>
<desc id="desc">依据站内《常识判断》的政治、法律、科技、文史、经济、地理分类及日期、知识点、来源积累表，整理为按领域归位、记核心区别、保留来源日期、隔天回看的学习流程。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5777a8" stroke-width="2"/></marker></defs>
<rect width="500" height="1200" rx="24" fill="#f3f7fd"/>
<g font-family="'Times New Roman', 'KaiTi', '楷体', 'STKaiti', 'Kaiti SC', serif" fill="#162a4b">
<text x="250" y="70" font-size="44" font-weight="800" text-anchor="middle">常识积累四步走</text>
<text x="250" y="120" font-size="32" font-weight="600" text-anchor="middle">一条知识，留下一个区别</text>
<rect x="20" y="150" width="460" height="180" rx="20" fill="#fff" stroke="#bfd0e8" stroke-width="2"/>
<text x="44" y="204" font-size="38" font-weight="800" fill="#2b5288">① 按领域归位</text>
<text x="44" y="256" font-size="32" font-weight="600">政治／法律／科技</text>
<text x="44" y="302" font-size="32" font-weight="600">文史／经济／地理</text>
<path d="M250 339 V366" fill="none" stroke="#5777a8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="380" width="460" height="180" rx="20" fill="#fff" stroke="#bfd0e8" stroke-width="2"/>
<text x="44" y="434" font-size="38" font-weight="800" fill="#2b5288">② 记核心区别</text>
<text x="44" y="486" font-size="32" font-weight="600">用一句话写清关键点</text>
<text x="44" y="532" font-size="32" font-weight="600">易混概念放在一起对照</text>
<path d="M250 569 V596" fill="none" stroke="#5777a8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="610" width="460" height="180" rx="20" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/>
<text x="44" y="664" font-size="38" font-weight="800" fill="#7e591c">③ 保留来源</text>
<text x="44" y="716" font-size="32" font-weight="600">记录标题、链接和日期</text>
<text x="44" y="762" font-size="32" font-weight="600">有变化的信息回原文核实</text>
<path d="M250 799 V826" fill="none" stroke="#5777a8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="840" width="460" height="180" rx="20" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/>
<text x="44" y="894" font-size="38" font-weight="800" fill="#176552">④ 隔天回看</text>
<text x="44" y="946" font-size="32" font-weight="600">遮住笔记，自己说一遍</text>
<text x="44" y="992" font-size="32" font-weight="600">说不清楚，回看易混点</text>
<text x="250" y="1082" font-size="38" font-weight="800" text-anchor="middle">分类 → 区别 → 来源</text>
<text x="250" y="1134" font-size="32" font-weight="600" text-anchor="middle">隔天再提取，持续积累</text>
</g></svg>
