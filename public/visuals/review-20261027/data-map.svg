<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="595" viewBox="0 0 1300 595" role="img" aria-label="资料分析：先读准，再选法">
<rect width="100%" height="100%" rx="28" fill="#f5f8fc"/>
<g font-family="Times New Roman, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="55" y="72" font-size="44" font-weight="800">资料分析：先读准，再选法</text>
<rect x="45" y="110" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="71" y="161" font-size="38" font-weight="800">第3题｜数据定位</text>
<text x="71" y="210" font-size="32" font-weight="600">先对年份、对象、单位</text>
<text x="71" y="251" font-size="32" font-weight="600">取数后回看原行列</text>
<rect x="670" y="110" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="696" y="161" font-size="38" font-weight="800">第7题｜护理型限定</text>
<text x="696" y="210" font-size="32" font-weight="600">总床位 × 65.7%</text>
<text x="696" y="251" font-size="32" font-weight="600">再除以登记养老机构数</text>
<rect x="45" y="335" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="71" y="386" font-size="38" font-weight="800">第9题｜算法选择</text>
<text x="71" y="435" font-size="32" font-weight="600">百化分与直除先比较</text>
<text x="71" y="476" font-size="32" font-weight="600">不熟的对应值不勉强使用</text>
<rect x="670" y="335" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="696" y="386" font-size="38" font-weight="800">第10、18题｜独立审题</text>
<text x="696" y="435" font-size="32" font-weight="600">答案字母分布不能当条件</text>
<text x="696" y="476" font-size="32" font-weight="600">同比 → 上年同期；环比 → 上期</text>
</g></svg>
