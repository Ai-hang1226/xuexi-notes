<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#142d3b;font-size:32px;font-weight:600}.title{font-size:44px;font-weight:800}.node{font-size:38px;font-weight:800}.muted{fill:#46616a}rect{stroke:#7aa3a0;stroke-width:2}</style><rect width="1400" height="850" rx="24" fill="#f2f7f4"/><text x="60" y="75" class="title">资料分析：先把目标与数据对上</text><text x="60" y="130" class="muted">3道错题＋4道耗时题｜原卷17/20，28:04｜迁移待验证</text><rect x="50" y="175" width="625" height="235" rx="20" fill="#fff"/><text x="80" y="232" class="node">① 每组先扫结构</text><text x="80" y="291">对象、时间、单位、数据分布</text><text x="80" y="347">第9、11题：知道数据在哪</text><text x="80" y="388" class="muted">评估整组时间，首题含读材料</text><rect x="725" y="175" width="625" height="235" rx="20" fill="#fff"/><text x="755" y="232" class="node">② 每题先定目标</text><text x="755" y="291">第13题：同年 Q2 − Q1</text><text x="755" y="347">第17题：现期比重 − 基期比重</text><text x="755" y="388" class="muted">先写短式，再调用公式</text><rect x="50" y="455" width="625" height="235" rx="20" fill="#fff"/><text x="80" y="512" class="node">③ 看选项决定精度</text><text x="80" y="571">第9题：近似误差能否区分？</text><text x="80" y="627">第8题：商的量级＋必要时回乘</text><text x="80" y="668" class="muted">不固定每题保留相同位数</text><rect x="725" y="455" width="625" height="235" rx="20" fill="#fff"/><text x="755" y="512" class="node">④ 核对对象与分母</text><text x="755" y="571">第12题：和谁比，就除以谁</text><text x="755" y="627">第15题：前十事项 ≠ 全部事项</text><text x="755" y="668" class="muted">分子统计谁？分母包括谁？</text><text x="60" y="765" class="node">下一组正常练习：看整组用时、首答正确率、返工</text><text x="60" y="817" class="muted">本人思路 → 讨论定稿 → 新题独立验证；复盘不改原卷成绩</text></svg>