<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 857" role="img" aria-label="图推复盘｜先看见，再调用"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="857" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">图推复盘｜先看见，再调用</text><text x="30" y="112" font-size="27" font-weight="700" fill="#182a48">10题2对 · 14分42秒 · 独立迁移待验证</text><rect x="30" y="150" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="188" font-size="31" font-weight="700" fill="#173d79">① 提取对象</text><text x="50" y="246" font-size="27" font-weight="500" fill="#26374c">黑白方形、特定白面、完整面</text><text x="50" y="286" font-size="27" font-weight="500" fill="#26374c">乱图先找跨图重复的清晰对象</text><rect x="618" y="150" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="188" font-size="31" font-weight="700" fill="#173d79">② 由特征列候选</text><text x="638" y="246" font-size="27" font-weight="500" fill="#26374c">交点／连接／笔画／种类／视图</text><text x="638" y="286" font-size="27" font-weight="500" fill="#26374c">有依据地换方向，不只用熟悉方法</text><rect x="30" y="399" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="437" font-size="31" font-weight="700" fill="#173d79">③ 把方法变成操作</text><text x="50" y="495" font-size="27" font-weight="500" fill="#26374c">数公共边、查奇点、画投影</text><text x="50" y="535" font-size="27" font-weight="500" fill="#26374c">比较对象和统计口径保持一致</text><rect x="618" y="399" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="437" font-size="31" font-weight="700" fill="#173d79">④ 验证全部题图与选项</text><text x="638" y="495" font-size="27" font-weight="500" fill="#26374c">局部成立 → 检查整组是否成立</text><text x="638" y="535" font-size="27" font-weight="500" fill="#26374c">保留解析分歧，不为答案凑条件</text><rect x="30" y="648" width="1140" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="686" font-size="31" font-weight="700" fill="#173d79">⑤ 无提示新题与延后复测</text><text x="50" y="744" font-size="27" font-weight="500" fill="#26374c">旧题听懂 ≠ 陌生题独立完成</text><text x="50" y="784" font-size="27" font-weight="500" fill="#26374c">记录正确率、用时和是否独立</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 242 H613"/><path d="M894 338 V366.5 H306 V394"/><path d="M584 491 H613"/><path d="M894 587 V615.5 H600 V643"/></g></g></svg>