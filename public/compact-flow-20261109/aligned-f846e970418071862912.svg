<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 901" role="img" aria-label="图推复盘｜先看见，再调用"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="901" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">图推复盘｜先看见，再调用</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">10题2对 · 14分42秒 · 独立迁移待验证</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">① 提取对象</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">黑白方形、特定白面、完整面</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">乱图先找跨图重复的清晰对象</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">② 由特征列候选</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">交点／连接／笔画／种类／视图</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">有依据地换方向，不只用熟悉方法</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">③ 把方法变成操作</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">数公共边、查奇点、画投影</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">比较对象和统计口径保持一致</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">④ 验证全部题图与选项</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">局部成立 → 检查整组是否成立</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">保留解析分歧，不为答案凑条件</text><rect x="30" y="641" width="1140" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="681" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">⑤ 无提示新题与延后复测</text><text x="50" y="736" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">旧题听懂 ≠ 陌生题独立完成</text><text x="50" y="778" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">记录正确率、用时和是否独立</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H306 V388"/><path d="M584 487 H613"/><path d="M894 585 V611 H600 V636"/></g></g></svg>