<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="0 0 1160 860"><style>text{font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;fill:#16333b;font-size:32px;font-weight:700}.title{font-size:44px}.head{font-size:38px}.muted{fill:#49636b}</style><rect width="1160" height="860" fill="#f4f8f7"/><text class="title" x="42" y="68">同一份水：圆锥高12 → 同底圆柱高4</text><path d="M110 180 L410 180 L260 460 Z" fill="#bae2e5" stroke="#225c66" stroke-width="4"/><ellipse cx="260" cy="180" rx="150" ry="28" fill="#d7eff0" stroke="#225c66" stroke-width="4"/><text x="90" y="515">圆锥：底面积S，高12厘米</text><text x="105" y="565">体积 = S × 12 ÷ 3 = 4S</text><text class="head" x="520" y="310">同一份水</text><text class="head" x="560" y="365">→</text><rect x="750" y="330" width="300" height="130" fill="#bae2e5" stroke="#225c66" stroke-width="4"/><ellipse cx="900" cy="330" rx="150" ry="28" fill="#d7eff0" stroke="#225c66" stroke-width="4"/><path d="M750 460 A150 28 0 0 0 1050 460" fill="none" stroke="#225c66" stroke-width="4"/><text x="730" y="515">圆柱：同底面积S，高h</text><text x="760" y="565">Sh = 4S → h = 4厘米</text><rect x="45" y="615" width="1070" height="185" rx="14" fill="white" stroke="#8bb4b0" stroke-width="2"/><text class="head" x="75" y="665">8分钟水量 → 圆柱高4厘米</text><text x="75" y="715">每分钟：4 ÷ 8 = 0.5厘米</text><text x="75" y="765">23分钟：23 × 0.5 = 11.5厘米；总高23.5厘米</text><text class="muted" x="45" y="840">示意不按比例绘制；原圆锥水深仍为12厘米，4厘米是换算水高</text></svg>