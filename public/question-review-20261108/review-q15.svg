<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1020" role="img" aria-labelledby="title desc"><title id="title">第15题｜先定整体</title><desc id="desc">依题干、本人思路及最终解析绘制的复习流程。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1020" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei, sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">第15题｜先定整体</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">① 看D项</text><text x="58" y="198" font-size="32" fill="#26374c">劳动合同的咨询量</text><text x="58" y="242" font-size="32" fill="#26374c">占“前十事项”的比例</text><path d="M300 269 V298" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="313" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">② 找分子</text><text x="58" y="411" font-size="32" fill="#26374c">劳动合同：10708 人次</text><text x="58" y="455" font-size="32" fill="#26374c">不换成其他事项</text><path d="M300 482 V511" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="526" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="575" font-size="38" font-weight="700" fill="#78511c">③ 找分母</text><text x="58" y="624" font-size="32" fill="#26374c">前十事项咨询量＝</text><text x="58" y="668" font-size="32" fill="#26374c">102428 × 85.85%</text><path d="M300 695 V724" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="739" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="788" font-size="38" font-weight="700" fill="#5e4487">④ 核对判断</text><text x="58" y="837" font-size="32" fill="#26374c">10708 ÷ 前十事项咨询量</text><text x="58" y="881" font-size="32" fill="#26374c">约12.18%，超过11%</text><text x="36" y="1000" font-size="30" font-weight="600" fill="#3b4c61">本人原答A；D项曾漏算前十事项。</text></g></svg>