<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第10题｜比较程度"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第10题｜比较程度</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 找第一空后果</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">缺少必要仪式感</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">文化传承发展受影响</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 比较程度</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">步履维艰：推进困难</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">止步不前：完全停滞</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 看第二空</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">无需大费周章</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">回代“繁文缛节”</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 不生造区别</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">繁文末节／繁文缛节</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">为异形说法 → 参考 B</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><p