<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1060" viewBox="0 0 520 1060"><style>text{font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;fill:#18363a;font-weight:700}.title{font-size:44px}.head{font-size:38px}.body{font-size:32px}.foot{font-size:28px}</style><rect width="520" height="1060" rx="20" fill="#f3f7f6"/><text x="24" y="60" class="title">浓度：先追两列</text><rect x="24" y="92" width="472" height="156" rx="16" fill="#dceee7"/><text x="42" y="138" class="head">原液</text><text x="42" y="183" class="body">总量 x；溶质 0.3x</text><path d="M260 252v17m-7-7 7 7 7-7" fill="none" stroke="#527b74" stroke-width="3"/><rect x="24" y="276" width="472" height="156" rx="16" fill="#e8edf8"/><text x="42" y="322" class="head">加100克水</text><text x="42" y="367" class="body">总量变为 x＋100</text><text x="42" y="406" class="body">溶质仍为 0.3x</text><path d="M260 436v17m-7-7 7 7 7-7" fill="none" stroke="#527b74" stroke-width="3"/><rect x="24" y="460" width="472" height="156" rx="16" fill="#f3e7d8"/><text x="42" y="506" class="head">混匀后倒出1/5</text><text x="42" y="551" class="body">总量、溶质都剩4/5</text><text x="42" y="590" class="body">浓度与倒出前相同</text><path d="M260 620v17m-7-7 7 7 7-7" fill="none" stroke="#527b74" stroke-width="3"/><rect x="24" y="644" width="472" height="156" rx="16" fill="#e8edf8"/><text x="42" y="690" class="head">加入80克、10%溶液</text><text x="42" y="735" class="body">总量增加80克</text><text x="42" y="774" class="body">溶质增加8克</text><path d="M260 804v17m-7-7 7 7 7-7" fill="none" stroke="#527b74" stroke-width="3"/><rect x="24" y="828" width="472" height="156" rx="16" fill="#c9e8df"/><text x="42" y="874" class="head">用最终20%列式</text><text x="42" y="919" class="body">末溶质＝末总量×20%</text><text x="24" y="1034" class="foot">已做第25题的步骤图</text></svg>