<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第6题｜平均价格升降"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第6题｜平均价格升降</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 锁定对象</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">按柴油机／汽油机</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">分别看出口与进口</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 平均价格＝金额÷数量</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">金额增速大于数量增速</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">在本题条件下单价上升</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 对照同口径数据</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">柴油出口18.9%＞10.0%</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">柴油进口41.7%＞7.3%</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 再核对汽油机</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">出口3.4%＜6.3%</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">进口－28.5%＜－28.2%</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">原答D不确定；平均数和比重要区分。</text></g></svg>