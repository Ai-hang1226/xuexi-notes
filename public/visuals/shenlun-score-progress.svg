<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title"><title id="title">四道申论首答基线：改写及迁移未提交</title><rect width="1120" height="1100" rx="24" fill="#f4f7fc"/><style>text{font-family:'Times New Roman','Microsoft YaHei','微软雅黑',sans-serif;fill:#173758;font-size:32px;font-weight:600}.title{font-size:44px;font-weight:800}.head{font-size:38px;font-weight:800}.small{font-size:28px}</style><text x="44" y="70" class="title">我的申论｜四题首答基线</text><text x="44" y="122">评分：DAY5—7为10/28，DAY8为11/02</text><rect x="36" y="156" width="1048" height="138" rx="16" fill="white"/><text x="60" y="204" class="head">DAY5｜城市绿化 · 做法</text><rect x="60" y="233" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="233" width="475.3333333333333" height="28" rx="14" fill="#3568a0"/><text x="720" y="258">11.5／15 · 76.7%</text><rect x="36" y="314" width="1048" height="138" rx="16" fill="white"/><text x="60" y="362" class="head">DAY6｜营商环境 · 措施与成效</text><rect x="60" y="391" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="391" width="413.3333333333333" height="28" rx="14" fill="#3568a0"/><text x="720" y="416">10／15 · 66.7%</text><rect x="36" y="472" width="1048" height="138" rx="16" fill="white"/><text x="60" y="520" class="head">DAY7｜背包银行 · 特点与作用</text><rect x="60" y="549" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="549" width="372" height="28" rx="14" fill="#3568a0"/><text x="720" y="574">12／20 · 60.0%</text><rect x="36" y="630" width="1048" height="138" rx="16" fill="white"/><text x="60" y="678" class="head">DAY8｜创新公共服务 · 问题不足</text><rect x="60" y="707" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="707" width="475.3333333333333" height="28" rx="14" fill="#3568a0"/><text x="720" y="732">11.5／15 · 76.7%</text><text x="44" y="858" class="head">首答4份｜改写0份｜迁移0份</text><text x="44" y="920" class="small">不同题型和难度不可直接判断能力进步或退步。</text><text x="44" y="970" class="small">按真实反馈记录同题改写及陌生同类题验证。</text><text x="44" y="1020" class="small">实际作答日期、用时未知；未提交不填成绩。</text><text x="44" y="1070" class="small">学习性参考分；旧首答不覆盖。</text></svg>