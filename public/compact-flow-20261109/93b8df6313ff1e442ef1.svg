<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第6题｜同向投影"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第6题｜同向投影</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 列出候选</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">小正方体堆积</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">可尝试块数、层数或投影</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 固定观察方向</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">各图沿同一方向压掉深度</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">不能逐图换方向</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 比较列高</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">题干同向投影为L形</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">列高4、1、1</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 对照选项</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">A的同向投影相同</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M39