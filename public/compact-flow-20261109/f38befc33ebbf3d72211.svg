<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第13题｜橙子礼盒"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第13题｜橙子礼盒</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 翻译成数列条件</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">三个数互不相同</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">中间数等于平均值</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 识别等差数列</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">三盒橙子个数组成等差数</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">列</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">逐组列出</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 统计样本</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">从6盒选3盒：共20组</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">符合条件：6组</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 计算概率</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">6÷20＝0.3</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">参考C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答C；本题按本人要求保留简版。</text></g></svg>