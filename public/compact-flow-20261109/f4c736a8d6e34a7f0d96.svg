<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="第3题｜基期排序"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="800" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第3题｜基期排序</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 看年份</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">材料给2023年</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">题目问2022年底</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 对象和增速配对</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">同一类别：现期量÷(1＋</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">增速)</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">不能跨行取数</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 比较基期</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">其他：约64.27万小时</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">非经营：约45.14万小时</text><rect x="30" y="430" width="360" height="264" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="468" font-size="31" font-weight="700" fill="#5e4487">④ 核对排序</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">载人约10.76，载客约</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">1.81</text><text x="50" y="606" font-size="27" font-weight="500" fill="#26374c">其他＞非经营＞载人 → </text><text x="50" y="646" font-size="27" font-weight="500" fill="#26374c">参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/><path d="M990 368 V397 H210 V425"/></g><text x="30" y="744" font-size="27" font-weight="600" fill="#3b4c61">原答B；具体错读哪项尚未确认。</text></g></svg>