<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 402" role="img" aria-label="第39题｜找没有提到的"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="402" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第39题｜找没有提到的</text><rect x="30" y="100" width="360" height="230" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 已提到的做法</text><text x="50" y="242" font-size="27" font-weight="500" fill="#26374c">番薯叶与高汤炖煮</text><text x="50" y="282" font-size="27" font-weight="500" fill="#26374c">对应烹饪方式</text><rect x="420" y="100" width="360" height="230" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 已提到的外观与名</text><text x="440" y="184" font-size="31" font-weight="700" fill="#78511c">称</text><text x="440" y="242" font-size="27" font-weight="500" fill="#26374c">太极图案；少帝赐名</text><text x="440" y="282" font-size="27" font-weight="500" fill="#26374c">对应视觉美感和名字由来</text><rect x="810" y="100" width="360" height="230" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 核对问法</text><text x="830" y="242" font-size="27" font-weight="500" fill="#26374c">没有交代传承途径</text><text x="830" y="282" font-size="27" font-weight="500" fill="#26374c">参考 B；原卷首答 B</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 215 H415"/><path d="M782 215 H805"/></g></g></svg>