<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1020" viewBox="0 0 980 1020" role="img" aria-label="图推特征与操作路线"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-weight:700} .num{font-family:'Times New Roman',serif}</style><rect width="100%" height="100%" fill="white"/><text x="36" y="66" font-size="44" fill="#24354b">图推：从特征到具体操作</text><text x="36" y="114" font-size="32" fill="#24354b">教学整理｜候选必须验证整组</text><rect x="30" y="150" width="440" height="235" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="50" y="202" font-size="38" fill="#24354b">外框固定</text><text x="50" y="258" font-size="32" fill="#24354b">提取框上连接点</text><text x="50" y="306" font-size="32" fill="#24354b">数量相同，再看位置</text><text x="50" y="354" font-size="32" fill="#24354b">整组验证同向、同步</text><rect x="500" y="150" width="440" height="235" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="520" y="202" font-size="38" fill="#24354b">面数相同</text><text x="520" y="258" font-size="32" fill="#24354b">细分直曲边界</text><text x="520" y="306" font-size="32" fill="#24354b">或按大小给面排序</text><text x="520" y="354" font-size="32" fill="#24354b">再比较局部对称</text><rect x="30" y="410" width="440" height="235" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="50" y="462" font-size="38" fill="#24354b">规则网格</text><text x="50" y="518" font-size="32" fill="#24354b">把格子串成路径</text><text x="50" y="566" font-size="32" fill="#24354b">先追同色，再验另一色</text><text x="50" y="614" font-size="32" fill="#24354b">轨迹与步长必须一致</text><rect x="500" y="410" width="440" height="235" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="520" y="462" font-size="38" fill="#24354b">两类数量突出</text><text x="520" y="518" font-size="32" fill="#24354b">灰色边数、白面数</text><text x="520" y="566" font-size="32" fill="#24354b">分别列数，再比差值</text><text x="520" y="614" font-size="32" fill="#24354b">不能预设永远差1</text><rect x="30" y="670" width="440" height="235" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="50" y="722" font-size="38" fill="#24354b">空间折叠</text><text x="50" y="778" font-size="32" fill="#24354b">固定参照面与顶点</text><text x="50" y="826" font-size="32" fill="#24354b">沿公共边核对方向</text><text x="50" y="874" font-size="32" fill="#24354b">单色方块另查颜色</text><rect x="500" y="670" width="440" height="235" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="520" y="722" font-size="38" fill="#24354b">多个视图＋总数</text><text x="520" y="778" font-size="32" fill="#24354b">先标确定缺失位置</text><text x="520" y="826" font-size="32" fill="#24354b">用总数核对剩余占位</text><text x="520" y="874" font-size="32" fill="#24354b">只还原区分选项的局部</text><text x="36" y="980" font-size="32" fill="#24354b">记录：答对、猜测、用时与掌握分别保留</text></svg>