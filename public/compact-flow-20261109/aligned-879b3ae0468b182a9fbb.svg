<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 892" role="img" aria-label="浓度：先追两列"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="892" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">浓度：先追两列</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#dceee7" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">原液</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">总量 x；溶质 0.3x</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e8edf8" stroke="#9fb9e6" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">加100克水</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">总量变为 x＋100</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">溶质仍为 0.3x</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#f3e7d8" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">混匀后倒出1/5</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">总量、溶质都剩4/5</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">浓度与倒出前相同</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#e8edf8" stroke="#9fb9e6" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">加入80克、10%溶液</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">总量增加80克</text><text x="638" y="485" font-size="26