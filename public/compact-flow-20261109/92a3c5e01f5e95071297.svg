<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第66题｜治理费用下界"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第66题｜治理费用下界</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 设两家公司长度</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">甲x米、乙y米</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">总长度x＋y至少200</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 写工期条件</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">1.5x＋2y≤365</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">两家公司不能同时作业</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 求费用下界</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">由工期和总长得x≥70</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">费用5x＋4y≥870万元</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 检查能否达到</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">甲70米、乙130米</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">365天、870万元 → 参考</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">详情见正文；独立掌握未验证。</text></g></svg>