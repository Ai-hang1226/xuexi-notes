<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 929" role="img" aria-label="言语：沿结构找落点"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="929" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">言语：沿结构找落点</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">先读文段，再核对选项</text><rect x="30" y="145" width="552" height="272" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">① 圈标志词</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">但是／因此／需要／更</text><rect x="618" y="145" width="552" height="272" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">② 定全文结构</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">转折后、递进后</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">因果看结果；总分看总句</text><text x="638" y="324" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">并列提共性</text><text x="638" y="366" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">对策找上位总对策</text><rect x="30" y="477" width="552" height="272" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="517" font-size="29" fill="#7e591c" font-weight="700" xml:space="preserve">③ 找作者落点</text><text x="50" y="572" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">分句在为哪句服务？</text><text x="50" y="614" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">排除背景、举例和修饰</text><rect x="618" y="477" width="552" height="272" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="517" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">④ 再匹配选项</text><text x="638" y="572" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">话题词 ＋ 落点词</text><text x="638" y="614" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">保持范围和语气一致</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 281 H613"/><path d="M894 421 V447 H306 V472"/><path d="M584 613 H613"/></g><text x="30" y="799" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">尾句、词频：只是线索</text><text x="30" y="835" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">总句、分句：看服务关系</text><text x="30" y="871" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">全文结构才是判断依据</text></g></svg>