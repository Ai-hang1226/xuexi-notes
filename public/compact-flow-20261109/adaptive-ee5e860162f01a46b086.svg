<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第1题｜词性要看用法"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第1题｜词性要看用法</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先把词放进句子</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">实现目标：实现是动作</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">方案现实：现实是性质</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 对照A项</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">适合岗位：适合是动作</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">安排合适：合适是性质</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 看原答D</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">积累经验、累积经验</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">本题语境下两者都是动作</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 保留兼类边界</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">“面对现实”中现实可作名词</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">按本题用法 → 参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答D；不把现实固定为一种词性。</text></g></svg>