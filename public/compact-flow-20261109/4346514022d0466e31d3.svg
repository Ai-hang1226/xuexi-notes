<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第10题｜别把词换掉"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第10题｜别把词换掉</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 为题干造句</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">整理收纳师</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">是一种新兴职业</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 核对C项</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">高科技人才属于人才资源</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">种属方向一致</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 回看原答A</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">五公里越野可作为体能训</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">练</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">不能直接等同军事演习</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 用原词复核</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">联想之后仍用选项原词造</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">句</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">对应C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答A；概念核对与看剧分开。</text></g></svg>