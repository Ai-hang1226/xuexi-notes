<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第5题｜并列信息"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第5题｜并列信息</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 看文化周内容</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">艺术性与专业性</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">体现其活动特点</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 看另外两方面</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">群众性和参与性</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">现代科技诠释戏曲</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 检查关系</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">三个方面并列呈现</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不自行补成手段与目的</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 再回代选项</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">强调／演绎</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">整组优选 A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">依据原题和讨论定稿；独立掌握待验证。</text></g></svg>