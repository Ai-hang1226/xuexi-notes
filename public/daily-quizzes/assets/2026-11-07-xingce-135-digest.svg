  <rect x="674" y="260" width="132" height="26" rx="13" fill="#fdeaea"/>
  <text x="686" y="278" class="pill" fill="#b91c1c">迁移待确认</text>

  <text x="40" y="338" class="foot">首答  →  逐题讨论  →  方法与边界补齐  →  同考点真题验证（待执行）</text>
