<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1170" viewBox="0 0 980 1170" role="img" aria-label="正方体与四面体的边顶点对应教学示意"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-weight:700} .num{font-family:'Times New Roman',serif}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="65" font-size="44" fill="#24354b">折叠判断：固定边、顶点和方向</text><text x="35" y="115" font-size="32" fill="#24354b">教学示意｜不是新增练习题</text><text x="35" y="182" font-size="38" fill="#24354b">正方体：先认相对面</text><rect x="123" y="220" width="78" height="78" fill="#edf3fb" stroke="#24354b" stroke-width="3"/><text x="148" y="273" font-size="42" fill="#24354b">B</text><rect x="45" y="298" width="78" height="78" fill="#edf3fb" stroke="#24354b" stroke-width="3"/><text x="70" y="351" font-size="42" fill="#24354b">C</text><rect x="123" y="298" width="78" height="78" fill="#edf3fb" stroke="#24354b" stroke-width="3"/><text x="148" y="351" font-size="42" fill="#24354b">A</text><rect x="201" y="298" width="78" height="78" fill="#edf3fb" stroke="#24354b" stroke-width="3"/><text x="226" y="351" font-size="42" fill="#24354b">D</text><rect x="279" y="298" width="78" height="78" fill="#edf3fb" stroke="#24354b" stroke-width="3"/><text x="304" y="351" font-size="42" fill="#24354b">E</text><rect x="123" y="376" width="78" height="78" fill="#edf3fb" stroke="#24354b" stroke-width="3"/><text x="148" y="429" font-size="42" fill="#24354b">F</text><text x="425" y="245" font-size="32" fill="#24354b">相对面：A—E</text><text x="425" y="293" font-size="32" fill="#24354b">相对面：B—F</text><text x="425" y="341" font-size="32" fill="#24354b">相对面：C—D</text><text x="425" y="389" font-size="32" fill="#24354b">同一顶点露出的三面</text><text x="425" y="437" font-size="32" fill="#24354b">不能含一对相对面</text><text x="35" y="520" font-size="38" fill="#24354b">四面体：没有相对面，比较边与顶点</text><polygon points="250,595 150,768 350,768" fill="#d9e7fa" stroke="#24354b" stroke-width="3"/><polygon points="250,595 150,768 50,595" fill="#f2f5fa" stroke="#24354b" stroke-width="3"/><polygon points="150,768 350,768 250,941" fill="#f2f5fa" stroke="#24354b" stroke-width="3"/><polygon points="350,768 250,595 450,595" fill="#f2f5fa" stroke="#24354b" stroke-width="3"/><text x="235" y="585" font-size="38" fill="#24354b">A</text><text x="135" y="758" font-size="38" fill="#24354b">B</text><text x="335" y="758" font-size="38" fill="#24354b">C</text><text x="35" y="585" font-size="38" fill="#b43137">D</text><text x="235" y="931" font-size="38" fill="#b43137">D</text><text x="435" y="585" font-size="38" fill="#b43137">D</text><text x="510" y="610" font-size="32" fill="#24354b">四个面：ABC、ABD</text><text x="510" y="658" font-size="32" fill="#24354b">ACD、BCD</text><text x="510" y="706" font-size="32" fill="#24354b">任意两面都相邻</text><text x="510" y="754" font-size="32" fill="#24354b">展开图上的三个D</text><text x="510" y="802" font-size="32" fill="#24354b">折后是同一个顶点</text><rect x="35" y="990" width="900" height="150" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="55" y="1035" font-size="32" fill="#24354b">相邻面：核对公共边及同一端点。</text><text x="55" y="1083" font-size="32" fill="#24354b">三面：统一从外侧看，同顶点的环绕顺序不能镜像。</text><text x="55" y="1131" font-size="32" fill="#24354b">多小方块：确认属于同一单色方块，再核对同色。</text></svg>