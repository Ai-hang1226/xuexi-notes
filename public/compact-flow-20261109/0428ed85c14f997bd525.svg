<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第7题｜对象范围"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第7题｜对象范围</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 对齐②项的对象</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">题目写“每个公民”</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">注意范围是否扩大</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 核对来源表述</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">原文讨论的是劳动者</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">不能替换成每个公民</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 检查选项组合</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">②不符合原文对象</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">参考组合为①③④</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 对照本人首答</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">原答B含②；题库参考C</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">本人当时表示四项都像对</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/><path d="M990 288 V317 H210 V345"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答B为猜选；不反推当时排除③。</text></g></svg>