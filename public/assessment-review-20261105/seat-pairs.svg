<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690"><style>text{font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;fill:#173a40;font-weight:700}.title{font-size:44px}.head{font-size:38px}.body{font-size:32px}</style><rect width="600" height="690" rx="18" fill="#f4f8f7"/><text x="24" y="60" class="title">丙坐3号：看相邻位置对</text><text x="37" y="119" class="body">1号</text><rect x="22" y="140" width="100" height="78" rx="12" fill="#e0e9ed"/><text x="53" y="191" class="head">空</text><text x="151" y="119" class="body">2号</text><rect x="136" y="140" width="100" height="78" rx="12" fill="#e0e9ed"/><text x="167" y="191" class="head">空</text><text x="265" y="119" class="body">3号</text><rect x="250" y="140" width="100" height="78" rx="12" fill="#e9d9c7"/><text x="281" y="191" class="head">丙</text><text x="379" y="119" class="body">4号</text><rect x="364" y="140" width="100" height="78" rx="12" fill="#e0e9ed"/><text x="395" y="191" class="head">空</text><text x="493" y="119" class="body">5号</text><rect x="478" y="140" width="100" height="78" rx="12" fill="#e0e9ed"/><text x="509" y="191" class="head">空</text><rect x="24" y="270" width="552" height="65" rx="12" fill="#deeee3"/><text x="40" y="313" class="body">（1，2）</text><text x="240" y="313" class="body">✓ 可分别放甲乙</text><rect x="24" y="350" width="552" height="65" rx="12" fill="#f4e1dd"/><text x="40" y="393" class="body">（2，3）</text><text x="240" y="393" class="body">× 含丙，不能用</text><rect x="24" y="430" width="552" height="65" rx="12" fill="#f4e1dd"/><text x="40" y="473" class="body">（3，4）</text><text x="240" y="473" class="body">× 含丙，不能用</text><rect x="24" y="510" width="552" height="65" rx="12" fill="#deeee3"/><text x="40" y="553" class="body">（4，5）</text><text x="240" y="553" class="body">✓ 可分别放甲乙</text><text x="24" y="646" class="body">2、4号本身仍可坐甲或乙</text></svg>