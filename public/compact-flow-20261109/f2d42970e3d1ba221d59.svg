<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="第4题｜公共棱配色"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="800" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第4题｜公共棱配色</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 找会重合的边</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">从展开图凹口处</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">找折后重合的公共棱</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 对齐共同端点</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">从同一端点开始</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">逐格配对两侧边</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 利用题目条件</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">同一单色小方块</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">露出的两个面颜色必须一</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">致</text><rect x="30" y="430" width="360" height="264" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="468" font-size="31" font-weight="700" fill="#5e4487">④ 排除颜色冲突</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">B、C、D对应格有黑白冲</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">突</text><text x="50" y="606" 