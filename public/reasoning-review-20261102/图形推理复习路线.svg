<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-labelledby="t d"><title id="t">图形推理：从外形回到结构</title><desc id="d">本轮两题的方法路线，讨论完成与独立运用分别记录。</desc><rect width="1240" height="480" rx="20" fill="#f5f7fa"/><g font-family="Times New Roman,Microsoft YaHei,微软雅黑,sans-serif" fill="#182b43" font-weight="700"><text x="48" y="66" font-size="44">图形推理：从外形回到结构</text><rect x="48" y="108" width="550" height="266" rx="15" fill="#e8f2ed"/><text x="72" y="164" font-size="38">第1题｜笔画触发</text><text x="72" y="225" font-size="32">放下物品名称，看端点交接</text><text x="72" y="283" font-size="32">先查连通，再数奇点</text><text x="72" y="341" font-size="32">不相连部分分别计算相加</text><rect x="638" y="108" width="550" height="266" rx="15" fill="#e8eff6"/><text x="662" y="164" font-size="38">第5题｜最短距离</text><text x="662" y="225" font-size="32">选定两块黑色区域</text><text x="662" y="283" font-size="32">找边缘最近的两点</text><text x="662" y="341" font-size="32">比较间隔并验证整组</text><text x="48" y="439" font-size="32">原答和真实用时保留；听懂与认可不等于独立新题掌握。</text></g></svg>
