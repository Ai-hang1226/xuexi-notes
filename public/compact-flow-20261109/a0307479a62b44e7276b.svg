<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第42题｜局部到整体"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第42题｜局部到整体</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 算审核节省</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">纸质 12 分钟</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">电子 8 分钟 → 省 4 </text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">分钟</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 检查其他环节</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">电子化可能新增步骤</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">也可能改变其他环节耗时</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 必须满足</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">其他环节净新增耗时</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">小于节省的 4 分钟</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 否定代入</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">完全抵消则总时长不缩短</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">D 必要；不必取消人工</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">历史自编模拟题；独立掌握待真题验证。</text></g></svg>