<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第28题｜先转折再展开"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第28题｜先转折再展开</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 引出话题</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">④ 吃播成为解压选择</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">① 转折：可能造成负担</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 展开分析</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">③ 大脑的反应</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">⑥ 心理层面的影响</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 补充身体影响</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">⑤ 描述胃部可能受损</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">按原文内部思路排列</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 结尾给建议</text><text x="638" y="423" font-s