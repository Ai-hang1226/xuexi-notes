<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 774" role="img" aria-label="言语复习：先认问题，再选方法"><rect width="1200" height="774" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">言语复习：先认问题，再选方法</text><text x="30" y="105" font-size="27" fill="#526378" font-weight="600" xml:space="preserve">原卷 17/30 · 28:18 ｜ 讨论完成 ≠ 独立掌握</text><rect x="30" y="145" width="552" height="290" rx="16" fill="#e6f2f5" stroke="#78a8b8" stroke-width="2"/><text x="50" y="189" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">逻辑填空：别只凭顺口</text><text x="50" y="249" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">读完整句 → 预判空意 → </text><text x="50" y="287" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">比侧重 → 整组回代</text><text x="50" y="347" font-size="27" fill="#785b35" font-weight="600" xml:space="preserve">提醒：陌生搭配不等于错误，</text><text x="50" y="385" font-size="27" fill="#785b35" font-weight="600" xml:space="preserve">词义更强未必更好</text><rect x="618" y="145" width="552" height="290" rx="16" fill="#edf2fc" stroke="#9aadd2" stroke-width="2"/><text x="638" y="189" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">阅读与排序：看关系，不只看关键词</text><text x="638" y="249" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">标句子作用 → 找衔接证据 → </text><text x="638" y="287" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">验证整段</text><text x="638" y="347" font-size="27" fill="#785b35" font-weight="600" xml:space="preserve">提醒：首句不必最重要，</text><text x="638" y="385" font-size="27" fill="#785b35" font-weight="600" xml:space="preserve">局部通顺不证明整组对</text><rect x="30" y="459" width="552" height="290" rx="16" fill="#f2f3ea" stroke="#a8b291" stroke-width="2"/><text x="50" y="503" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">语病辨析：先找主干，再逐项检查</text><text x="50" y="563" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">搭配 → 句式与语序 → </text><text x="50" y="601" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">指代 → 逻辑</text><text x="50" y="661" font-size="27" fill="#785b35" font-weight="600" xml:space="preserve">提醒：省略主语未必错，</text><text x="50" y="699" font-size="27" fill="#785b35" font-weight="600" xml:space="preserve">提示词不能机械判病</text><rect x="618" y="459" width="552" height="290" rx="16" fill="#fff" stroke="#245c77" stroke-width="2"/><text x="638" y="503" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">下一步：遮住解析，独立说出判断依据</text><text x="638" y="563" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">旧题能复述 → 新题无提示验证 → </text><text x="638" y="601" font-size="27" fill="#263d4c" font-weight="600" xml:space="preserve">延后复测</text></g></svg>