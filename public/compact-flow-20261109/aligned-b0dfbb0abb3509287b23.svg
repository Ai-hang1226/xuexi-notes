<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 899.5999999999999" role="img" aria-label="第56题｜操场面积与周长"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="899.5999999999999" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第56题｜操场面积与周长</text><svg x="240" y="100" width="720" height="345.59999999999997" viewBox="0 60 600 288" overflow="hidden"><defs><marker id="dim" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#cd6c20"/></marker><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="600" height="930" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><path d="M202.5 120 H397.5 A65 65 0 0 1 397.5 250 H202.5 A65 65 0 0 1 202.5 120 Z" fill="#e7f2ff" stroke="#254a77" stroke-width="4"/><path d="M202.5 120 V250 M397.5 120 V250" stroke="#4c76ac" stroke-width="3" stroke-dasharray="8 6"/><path d="M202.5 105 H397.5" stroke="#cd6c20" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="239" y="96" font-size="27" font-weight="700" fill="#9b4e15">L = 150 米</text><path d="M490 120 V250" stroke="#cd6c20" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="502" y="181" font-size="25" font-weight="700" fill="#9b4e15">100</text><text x="502" y="214" font-size="25" font-weight="700" fill="#9b4e15">米</text><text x="215" y="196" font-size="28" font-weight="700" fill="#27547f">矩形＋两个半圆</text><rect x="30" y="350" width="540" height="155" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="52" y="397" font-size="36" font-weight="700" fill="#173d79">① 利用面积比</text><text x="52" y="444" font-size="30" fill="#26374c">πr² ÷ (2rL) = π／6</text><text x="52" y="487" font-size="30" fill="#26374c">化简得到 L = 3r</text><path d="M300 510 V533" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="540" width="540" height="155" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="52" y="587" font-size="36" font-weight="700" fill="#78511c">② 利用矩形周长</text><text x="52" y="634" font-size="30" fill="#26374c">2(L + 2r) = 500</text><text x="52" y="677" font-size="30" fill="#26374c">得到 r = 50，L = 150</text><path d="M300 700 V723" stroke="#476bb0" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="730" width="540" height="155" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="52" y="777" font-size="36" font-weight="700" fill="#176659">③ 求外轮廓长度</text><text x="52" y="824" font-size="30" fill="#26374c">2L + 2πr = 300 + 100π</text><text x="52" y="867" font-size="30" fill="#26374c">参考 B；原卷首答 B</text></g></svg><rect x="30" y="475.59999999999997" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="515.5999999999999" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 利用面积比</text><text x="50" y="570.5999999999999" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">πr² ÷ (2rL) = π／6</text><text x="50" y="612.5999999999999" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">化简得到 L = 3r</text><rect x="618" y="475.59999999999997" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="638" y="515.5999999999999" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 利用矩形周长</text><text x="638" y="570.5999999999999" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">2(L + 2r) = 500</text><text x="638" y="612.5999999999999" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">得到 r = 50，L = 150</text><rect x="30" y="703.5999999999999" width="1140" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="50" y="743.5999999999999" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 求外轮廓长度</text><text x="50" y="798.5999999999999" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">2L + 2πr = 300 + 100π</text><text x="50" y="840.5999999999999" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">参考 B；原卷首答 B</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 559.5999999999999 H613"/><path d="M894 647.5999999999999 V673.5999999999999 H600 V698.5999999999999"/></g></g></svg>