<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-label="态度题｜区分请求与结果"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="396" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">态度题｜区分请求与结果</text><rect x="30" y="100" width="360" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 题干已知</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">甲希望乙告知态度</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">乙的态度会影响甲</text><rect x="420" y="100" width="360" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="140" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 不要直接跳步</text><text x="440" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">请求乙告知</text><text x="440" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不等于乙一定会告知</text><rect x="810" y="100" width="360" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 留意原题边界</text><text x="830" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">现存为题干与选项摘要</text><text x="830" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">须结合完整设问判断</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 194 H415"/><path d="M782 194 H805"/></g><text x="30" y="338" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">“不能确定会告知”不等于“不可能告知”。</text></g></svg>