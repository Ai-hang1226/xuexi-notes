<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1009" role="img" aria-label="语句排序｜先取证，再验证整体"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="1009" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">语句排序｜先取证，再验证整体</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">局部连接能成立，不等于整组选项成立</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">① 对比选项差异</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">首句、相邻句、句组顺序，差在哪里？</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">相同位置不反复研究，集中比较不同处</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">② 标注句子功能</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">定义／背景／观点／解释／转折／对策</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">同一名词反复出现，也可能承担不同任务</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">③ 寻找衔接证据</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">指代、关联、总分、时间、话题推进</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">相邻关系 ≠ 先后关系 ≠ 同组关系</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">④ 比较候选顺序</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">谁先引入对象？谁解释谁？转折在哪里？</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">用证据筛选，保留暂时无法排除的项</text><rect x="30" y="641" width="552" height="188" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="681" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">⑤ 通读整段验证</text><text x="50" y="736" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">指代有着落，逻辑能解释，话题不乱跳</text><text x="50" y="778" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不能为一个局部连接牺牲整段连贯</text><rect x="618" y="641" width="552" height="188" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="638" y="681" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">⑥ 回看题问后选择</text><text x="638" y="736" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">选的是完整顺序，说明关键比较依据</text><text x="638" y="778" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">看懂本题后，还需用未见新题独立复测</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H306 V388"/><path d="M584 487 H613"/><path d="M894 585 V611 H306 V636"/><path d="M584 735 H613"/></g><text x="30" y="879" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">首句信号不是禁令：“却／因为”也可句内完整</text><text x="30" y="915" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">“那个时代”能跨句回指；不能机械就近绑定</text><text x="30" y="951" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">口诀：找证据 → 比差异 → 验证整段</text></g></svg>