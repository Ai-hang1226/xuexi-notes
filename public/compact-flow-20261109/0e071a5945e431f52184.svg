<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第9题｜每轮先异组"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第9题｜每轮先异组</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 初赛不同组</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">固定张，刘剩 47 个位置</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">不同组有 45 个：45/47</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 初赛都获第一</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">不同组后，两人都第一</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">概率 1/3×1/3=1/9</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 复赛不同组</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">16 人每组 4 人</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">不同组概率 12/15=4/5</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 复赛都获第一</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">再乘 1/16，合计 1/188</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">位于 1/200 与 1/150 </text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">间</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">整式为讲解补充，本人原算式待补。</text></g></svg>