<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第2题｜工作与休息"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第2题｜工作与休息</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 上午拆周期</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">230分钟＝5个40分钟周期</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">再加30分钟工作</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 算上午纯工作</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">5×30＋30＝180分钟</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">完成当天任务的一半</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 下午算工作段</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">人数变1.5倍：180÷1.5</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">＝120分钟，即4段工作</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 只算中间休息</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">4段之间休息3次，共15</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">分钟</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">14:00＋135分钟＝16:15</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答A；完工后不再安排休息。</text></g></svg>