<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1020" role="img" aria-labelledby="title desc"><title id="title">平均数与比重：先辨问法</title><desc id="desc">判断升降比较分子分母增速，定量时区分平均数增长率和两期比重差。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1020" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">平均数与比重｜先看问法</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">只问升降</text><text x="58" y="198" font-size="32" fill="#26374c">a＞b 上升；a＜b 下降</text><text x="58" y="242" font-size="32" fill="#26374c">a＝b 不变</text><rect x="30" y="313" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">若问平均数增长率</text><text x="58" y="411" font-size="32" fill="#26374c">（a－b）÷（1＋b）</text><text x="58" y="455" font-size="32" fill="#26374c">结果是增长率，用百分数表示</text><rect x="30" y="526" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="575" font-size="38" font-weight="700" fill="#78511c">若问两期比重差</text><text x="58" y="624" font-size="32" fill="#26374c">（A÷B）×（a－b）÷（1＋a）</text><text x="58" y="668" font-size="32" fill="#26374c">两期占比之差，用百分点表示</text><rect x="30" y="739" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="788" font-size="38" font-weight="700" fill="#5e4487">所有情况核对口径</text><text x="58" y="837" font-size="32" fill="#26374c">A、B是现期分子、分母</text><text x="58" y="881" font-size="32" fill="#26374c">a、b是对应同一基期的增速</text><text x="36" y="1000" font-size="30" font-weight="600" fill="#3b4c61">比较同口径正数；单位不要混用。</text></g></svg>