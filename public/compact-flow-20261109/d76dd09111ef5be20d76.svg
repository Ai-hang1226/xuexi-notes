<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="第4题｜先对准担忧"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="800" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第4题｜先对准担忧</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 固定担忧</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">初诊患者担心等待变长</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">就诊机会被挤占</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 看A项</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">安排初诊和复诊的次序</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">尽量避免长时间排队</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 比较B、C、D</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">人数、旧安排、诊治连续</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">性</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">均未同样直接回应次序担</text><text x="830" y="316" font-size="27" font-weight="500" fill="#26374c">忧</text><rect x="30" y="430" width="360" height="264" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="468" font-size="31" font-weight="700" fill="#5e4487">④ 选择最贴近的</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">A直接回应等待与次序</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">“尽量避免”不等于绝对</text><text x="50" y="606" font-size="27" font-weight="500" fill="#26374c">保证</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/><path d="M990 368 V397 H210 V425"/></g><text x="30" y="744" font-size="27" font-weight="600" fill="#3b4c61">原答A；先问选项回应什么担忧。</text></g></svg>