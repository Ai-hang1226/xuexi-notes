<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" role="img" aria-label="第99题｜同属一个类别"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="566" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第99题｜同属一个类别</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 标出题干结构</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">清明 → 传统节日 ← 春节</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">两者都是传统节日</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 对照 D 项</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">足球 → 体育用品 ← 哑铃</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">两者都是体育用品</text><rect x="30" y="328" width="1140" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 分清三个位置</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">两侧并列，中间是共同类别</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">参考 D；原卷首答 D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H600 V323"/></g></g></svg>