<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" role="img" aria-label="逻辑填空｜四步找依据"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="634" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">逻辑填空｜四步找依据</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 读语境</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">这句话想表达什么？</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">看主体、对象、动作</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#173d79">② 找线索</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">看解释、转折、因果</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">也看整句或全文意思</text><rect x="30" y="349" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="387" font-size="31" font-weight="700" fill="#173d79">③ 比差别</text><text x="50" y="445" font-size="27" font-weight="500" fill="#26374c">比较词义、对象、程度</text><text x="50" y="485" font-size="27" font-weight="500" fill="#26374c">不清楚的先保留</text><rect x="618" y="349" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="387" font-size="31" font-weight="700" fill="#173d79">④ 回代整组</text><text x="638" y="445" font-size="27" font-weight="500" fill="#26374c">每一空都放回去读</text><text x="638" y="485" font-size="27" font-weight="500" fill="#26374c">检查全句是否贴切</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V316.5 H306 V344"/><path d="M584 441 H613"/></g><text x="30" y="583" font-size="27" font-weight="600" fill="#3b4c61">直觉可提出候选，选择要有依据。</text></g></svg>