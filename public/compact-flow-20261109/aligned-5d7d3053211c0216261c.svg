<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 725" role="img" aria-label="常识积累四步走"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="725" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">常识积累四步走</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">一条知识，留下一个区别</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">① 按领域归位</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">政治／法律／科技</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">文史／经济／地理</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">② 记核心区别</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">用一句话写清关键点</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">易混概念放在一起对照</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#7e591c" font-weight="700" xml:space="preserve">③ 保留来源</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">记录标题、链接和日期</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">有变化的信息回原文核实</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">④ 隔天回看</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">遮住笔记，自己说一遍</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">说不清楚，回看易混点</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H306 V388"/><path d="M584 487 H613"/></g><text x="30" y="631" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">分类 → 区别 → 来源</text><text x="30" y="667" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">隔天再提取，持续积累</text></g></svg>