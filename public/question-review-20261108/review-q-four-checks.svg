<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" role="img" aria-labelledby="t d"><title id="t">逻辑与定义判断：四个检查句</title><desc id="d">解释原因、必要条件、陌生表达和最适合四类问题各自的检查句。</desc><rect width="600" height="1010" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">逻辑与定义｜四个检查句</text><rect x="30" y="100" width="540" height="175" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="152" font-size="38" font-weight="700" fill="#173d79">解释原因</text><text x="58" y="205" font-size="32" fill="#26374c">原因是选项提供的？</text><text x="58" y="250" font-size="32" fill="#26374c">还是我自己补进去的？</text><rect x="30" y="310" width="540" height="175" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">必要条件</text><text x="58" y="415" font-size="32" fill="#26374c">这个条件服务于哪个结果？</text><text x="58" y="460" font-size="32" fill="#26374c">是否对准题干结论？</text><rect x="30" y="520" width="540" height="175" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="572" font-size="38" font-weight="700" fill="#78511c">陌生表达</text><text x="58" y="625" font-size="32" fill="#26374c">先看哪些短语能读懂</text><text x="58" y="670" font-size="32" fill="#26374c">再判断它表达的态度</text><rect x="30" y="730" width="540" height="175" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="782" font-size="38" font-weight="700" fill="#5e4487">最适合</text><text x="58" y="835" font-size="32" fill="#26374c">一个选项能用以后</text><text x="58" y="880" font-size="32" fill="#26374c">还要比较谁更适合</text><text x="36" y="991" font-size="27" font-weight="600" fill="#3b4c61">四类问题分别检查，陌生题仍需验证。</text></g></svg>