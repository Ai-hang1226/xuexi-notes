<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" role="img" aria-label="第119题｜单位量比较"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="566" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第119题｜单位量比较</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 求 2025 年 12 月</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">98.1 ÷ 171.8 × 100</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">约 57.10 千瓦时／辆</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">② 还原 2025 年 11 月</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">(98.1 ÷ 1.049) ÷ (171.8 ÷ 0.914)</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">再乘 100，约 49.75 千瓦时／辆</text><rect x="30" y="328" width="1140" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">③ 比较差值</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">约 57.10 − 49.75 = 7.35</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">高不到 10；参考 C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H600 V323"/></g></g></svg>