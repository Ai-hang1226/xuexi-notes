<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第11题｜累计转当季"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第11题｜累计转当季</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 题目问什么</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">2025年第二季度</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">Q市法律热线咨询量</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 定位两处数据</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">文字给出上半年：102428</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">图表给出第一季度：</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">52802</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 用累计量拆分</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">第二季度＝上半年－第一</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">季度</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">102428－52802</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 换算并选项</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">49626人次＝4.9626万人</