<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-label="第104题｜找论证跳步"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="396" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第104题｜找论证跳步</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 分清论据与论点</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">论据：摄入过多可能有风</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">险</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">论点：长期喝蛋白粉伤肾</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 查中间有没有跳步</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">运动后蛋白质需求增加</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">长期喝未必意味着过量</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 对照已有讨论</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">本人首答 D；复盘重判 B</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">需求增加不等于证明无害</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/></g></g></svg>