<text x="48" y="65" font-size="44">连接AB，延长CB、AO交于D</text><text x="48" y="119" font-size="32">AB = 5；O是直径AD的中点；BO垂直平分AD</text>
<path d="M 240 540 A 360 360 0 0 1 960 540" fill="none" stroke="#17324d" stroke-width="4"/>
<polygon points="600,540 960,540 600,360" fill="#cee3fb"/><polygon points="960,540 816,252 600,360" fill="#d2eee1"/>
