<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-label="第67题｜先算费用下界"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="396" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第67题｜先算费用下界</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 至少要几辆</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">6 辆最多运 6 × 24 = </text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">144 吨</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">不足 160 吨，至少 7 辆</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 算最低可能费用</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">每辆车费用至少 350 元</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">7 × 350 = 2450 元</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 验证能否达到</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">7 辆 A 车运 168 吨</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">7 名司机；参考 A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/></g></g></svg>