<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">DAY7和DAY8：先分清题目任务</title><desc id="desc">DAY7要求概括特点和作用，DAY8要求归纳问题，结合题干区分。</desc><rect width="600" height="650" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">先分清要回答什么</text><rect x="30" y="100" width="540" height="205" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="151" font-size="38" font-weight="700" fill="#173d79">DAY7｜背包银行</text><text x="58" y="207" font-size="32" fill="#26374c">特点：这个模式有什么特征？</text><text x="58" y="255" font-size="32" fill="#26374c">作用：它带来了什么影响？</text><rect x="30" y="330" width="540" height="205" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="381" font-size="38" font-weight="700" fill="#176659">DAY8｜创新公共服务</text><text x="58" y="437" font-size="32" fill="#26374c">问题：创新服务面临什么困难？</text><text x="58" y="485" font-size="32" fill="#26374c">从现象回材料，归纳有依据的缺口</text><text x="36" y="607" font-size="30" font-weight="600" fill="#3b4c61">先审题，再按材料分组和组织答案。</text></g></svg>