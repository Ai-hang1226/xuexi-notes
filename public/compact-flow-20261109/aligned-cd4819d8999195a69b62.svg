<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第10题｜因果方向"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第10题｜因果方向</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 确定题干方向</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">算法偏见</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">可能造成不公平</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 对照D项</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">血栓脱落形成栓子</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">可能堵塞相应动脉</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 回看原答B</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">冠状动脉堵塞可能引发心梗</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">题目词序方向相反</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 保留因果边界</text><text x="638" y="423" font-size="26" fi