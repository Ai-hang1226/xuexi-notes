<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 916" role="img" aria-label="语句排序｜先取证，再验证整体"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="916" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">语句排序｜先取证，再验证整体</text><text x="30" y="112" font-size="27" font-weight="700" fill="#182a48">局部连接能成立，不等于整组选项成立</text><rect x="30" y="150" width="360" height="264" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="188" font-size="31" font-weight="700" fill="#173d79">① 对比选项差异</text><text x="50" y="246" font-size="27" font-weight="500" fill="#26374c">首句、相邻句、句组顺序</text><text x="50" y="286" font-size="27" font-weight="500" fill="#26374c">，差在哪里？</text><text x="50" y="326" font-size="27" font-weight="500" fill="#26374c">相同位置不反复研究，集</text><text x="50" y="366" font-size="27" font-weight="500" fill="#26374c">中比较不同处</text><rect x="420" y="150" width="360" height="264" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="440" y="188" font-size="31" font-weight="700" fill="#173d79">② 标注句子功能</text><text x="440" y="246" font-size="27" font-weight="500" fill="#26374c">定义／背景／观点／解释</text><text x="440" y="286" font-size="27" font-weight="500" fill="#26374c">／转折／对策</text><text x="440" y="326" font-size="27" font-weight="500" fill="#26374c">同一名词反复出现，也可</text><text x="440" y="366" font-size="27" font-weight="500" fill="#26374c">能承担不同任务</text><rect x="810" y="150" width="360" height="264" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="830" y="188" font-size="31" font-weight="700" fill="#173d79">③ 寻找衔接证据</text><text x="830" y="246" font-size="27" font-weight="500" fill="#26374c">指代、关联、总分、时间</text><text x="830" y="286" font-size="27" font-weight="500" fill="#26374c">、话题推进</text><text x="830" y="326" font-size="27" font-weight="500" fill="#26374c">相邻关系 ≠ 先后关系 </text><text x="830" y="366" font-size="27" font-weight="500" fill="#26374c">≠ 同组关系</text><rect x="30" y="479" width="360" height="264" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="517" font-size="31" font-weight="700" fill="#173d79">④ 比较候选顺序</text><text x="50" y="575" font-size="27" font-weight="500" fill="#26374c">谁先引入对象？谁解释谁</text><text x="50" y="615" font-size="27" font-weight="500" fill="#26374c">？转折在哪里？</text><text x="50" y="655" font-size="27" font-weight="500" fill="#26374c">用证据筛选，保留暂时无</text><text x="50" y="695" font-size="27" font-weight="500" fill="#26374c">法排除的项</text><rect x="420" y="479" width="360" height="264" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="440" y="517" font-size="31" font-weight="700" fill="#173d79">⑤ 通读整段验证</text><text x="440" y="575" font-size="27" font-weight="500" fill="#26374c">指代有着落，逻辑能解释</text><text x="440" y="615" font-size="27" font-weight="500" fill="#26374c">，话题不乱跳</text><text x="440" y="655" font-size="27" font-weight="500" fill="#26374c">不能为一个局部连接牺牲</text><text x="440" y="695" font-size="27" font-weight="500" fill="#26374c">整段连贯</text><rect x="810" y="479" width="360" height="264" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="830" y="517" font-size="31" font-weight="700" fill="#173d79">⑥ 回看题问后选择</text><text x="830" y="575" font-size="27" font-weight="500" fill="#26374c">选的是完整顺序，说明关</text><text x="830" y="615" font-size="27" font-weight="500" fill="#26374c">键比较依据</text><text x="830" y="655" font-size="27" font-weight="500" fill="#26374c">看懂本题后，还需用未见</text><text x="830" y="695" font-size="27" font-weight="500" fill="#26374c">新题独立复测</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M392 282 H415"/><path d="M782 282 H805"/><path d="M990 418 V446.5 H210 V474"/><path d="M392 611 H415"/><path d="M782 611 H805"/></g><text x="30" y="793" font-size="27" font-weight="600" fill="#3b4c61">首句信号不是禁令：“却／因为”也可句内完整</text><text x="30" y="829" font-size="27" font-weight="600" fill="#3b4c61">“那个时代”能跨句回指；不能机械就近绑定</text><text x="30" y="865" font-size="27" font-weight="600" fill="#3b4c61">口诀：找证据 → 比差异 → 验证整段</text></g></svg>