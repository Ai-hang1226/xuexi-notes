<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1520" viewBox="0 0 1060 1520" role="img" aria-labelledby="title desc">
<title id="title">语句排序｜先取证，再验证整体</title><desc id="desc">① 对比选项差异：首句、相邻句、句组顺序，差在哪里？，相同位置不反复研究，集中比较不同处；② 标注句子功能：定义／背景／观点／解释／转折／对策，同一名词反复出现，也可能承担不同任务；③ 寻找衔接证据：指代、关联、总分、时间、话题推进，相邻关系 ≠ 先后关系 ≠ 同组关系；④ 比较候选顺序：谁先引入对象？谁解释谁？转折在哪里？，用证据筛选，保留暂时无法排除的项；⑤ 通读整段验证：指代有着落，逻辑能解释，话题不乱跳，不能为一个局部连接牺牲整段连贯；⑥ 回看题问后选择：选的是完整顺序，说明关键比较依据，看懂本题后，还需用未见新题独立复测</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#1c6271"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-weight:700;fill:#173343}.main{font-size:44px}.node{font-size:38px}.body{font-size:32px}</style>
<rect width="1060" height="1520" fill="#f5f8f9"/>
<text class="main" x="50" y="65">语句排序｜先取证，再验证整体</text>
<text class="body" x="50" y="115" fill="#315766">局部连接能成立，不等于整组选项成立</text>
<rect x="50" y="150" width="960" height="160" rx="20" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/>
<text class="node" x="85" y="198">① 对比选项差异</text>
<text class="body" x="85" y="247">首句、相邻句、句组顺序，差在哪里？</text>
<text class="body" x="85" y="289">相同位置不反复研究，集中比较不同处</text>
<path d="M530,318 L530,339" stroke="#1c6271" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="350" width="960" height="160" rx="20" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/>
<text class="node" x="85" y="398">② 标注句子功能</text>
<text class="body" x="85" y="447">定义／背景／观点／解释／转折／对策</text>
<text class="body" x="85" y="489">同一名词反复出现，也可能承担不同任务</text>
<path d="M530,518 L530,539" stroke="#1c6271" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="550" width="960" height="160" rx="20" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/>
<text class="node" x="85" y="598">③ 寻找衔接证据</text>
<text class="body" x="85" y="647">指代、关联、总分、时间、话题推进</text>
<text class="body" x="85" y="689">相邻关系 ≠ 先后关系 ≠ 同组关系</text>
<path d="M530,718 L530,739" stroke="#1c6271" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="750" width="960" height="160" rx="20" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/>
<text class="node" x="85" y="798">④ 比较候选顺序</text>
<text class="body" x="85" y="847">谁先引入对象？谁解释谁？转折在哪里？</text>
<text class="body" x="85" y="889">用证据筛选，保留暂时无法排除的项</text>
<path d="M530,918 L530,939" stroke="#1c6271" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="950" width="960" height="160" rx="20" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/>
<text class="node" x="85" y="998">⑤ 通读整段验证</text>
<text class="body" x="85" y="1047">指代有着落，逻辑能解释，话题不乱跳</text>
<text class="body" x="85" y="1089">不能为一个局部连接牺牲整段连贯</text>
<path d="M530,1118 L530,1139" stroke="#1c6271" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="1150" width="960" height="160" rx="20" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/>
<text class="node" x="85" y="1198">⑥ 回看题问后选择</text>
<text class="body" x="85" y="1247">选的是完整顺序，说明关键比较依据</text>
<text class="body" x="85" y="1289">看懂本题后，还需用未见新题独立复测</text>
<rect x="50" y="1340" width="960" height="145" rx="20" fill="#fff0d3" stroke="#d6be8c" stroke-width="2"/>
<text class="body" x="85" y="1386">首句信号不是禁令：“却／因为”也可句内完整</text>
<text class="body" x="85" y="1428">“那个时代”能跨句回指；不能机械就近绑定</text>
<text class="body" x="85" y="1470">口诀：找证据 → 比差异 → 验证整段</text>
</svg>