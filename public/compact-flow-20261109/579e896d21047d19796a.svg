<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第1题｜先找因果"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第1题｜先找因果</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 题干起点</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">只用升学率评价</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">评价方向受到影响</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 看后果</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">片面追求分数</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">其他发展空间被占用</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 比较第二空</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">挤压强调一方占用</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">“限制空间”也不是错搭</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">配</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 整组回代</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">偏离教育本质</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">挤压发展空间 → B</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">依据原题和讨论定稿；独立掌握待验证。</text></g></svg>