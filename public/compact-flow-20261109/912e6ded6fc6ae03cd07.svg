<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第3题｜人和成果"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第3题｜人和成果</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先解释题干词</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">翰墨丹青：书画语境</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">霓裳羽衣：本题按衣裳理</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">解</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 看A项</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">画家 → 创作书画</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">绣娘 → 制作衣裳</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 再核对其他项</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">画室创作、舞台展示</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">笔墨是工具、布料是原料</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 对齐具体角色</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">两边均为从业者与成果</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答C；先造准确短句再归类。</text></g></svg>