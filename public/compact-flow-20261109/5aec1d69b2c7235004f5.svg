<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" role="img" aria-label="空间折叠｜先面再边和点"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="686" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">空间折叠｜先面再边和点</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先辨认立体</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">正方体／长方体：可找相</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">对面</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">四面体：没有相对面</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 固定参照面</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">先选一个有明显图案的面</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">注意统一观察方向</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 核对公共边</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">先确认折后对应同一条边</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">再比边上图案与两端点</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 三面交于同一顶点</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">固定同一顶点与同组三个</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">面</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">从同方向比较环绕顺序</text><rect x="420" y="390" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="440" y="428" font-size="31" font-weight="700" fill="#173d79">⑤ 最后代回原图</text><text x="440" y="486" font-size="27" font-weight="500" fill="#26374c">检查题目特殊条件与选项</text><text x="440" y="526" font-size="27" font-weight="500" fill="#26374c">原图保留在下方，可放大</text><text x="440" y="566" font-size="27" font-weight="500" fill="#26374c">看</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/><path d="M392 502 H415"/></g></g></svg>