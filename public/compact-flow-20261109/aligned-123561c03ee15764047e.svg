<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 689" role="img" aria-label="类比：关系要对齐"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="689" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">类比：关系要对齐</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">先横向，再纵向比较</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">① 先造句</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">少加字，保持句式一致</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">② 判一级关系</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">一种／一部分？</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">因果／目的／条件？</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#7e591c" font-weight="700" xml:space="preserve">③ 比二级关系</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">方向、必要性、语义结构</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">必要条件：没它不行</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">④ 核对各组选项</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">与题干保持同一关系</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">方向、层次也要一致</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H306 V388"/><path d="M584 487 H613"/></g><text x="30" y="631" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">能搭配，只是第一步</text></g></svg>