<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第8题｜单位与对象"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第8题｜单位与对象</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 先确定对象</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">题目问电能</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不是功率或电流</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 电能单位</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">千瓦时</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">用于计量电能</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 对照其他单位</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">千瓦：功率</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">安培：电流</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 再核一项</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">伏特：电压</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">计量对象不同</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">历史自编题复盘；独立掌握另行验证。</text></g></svg>