<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" role="img" aria-label="第65题｜分情况算概率"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="356" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第65题｜分情况算概率</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先算面试通过率</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">1／5 × 0.6 = 0.12</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">4／5 × 0.4 = 0.32</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 合并面试两种情况</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">0.12 + 0.32 = 0.44</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">再按题意乘笔试通过率</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 计算总通过率</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">0.7 × 0.44 = 0.308</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">超过 0.3；参考 D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/></g></g></svg>