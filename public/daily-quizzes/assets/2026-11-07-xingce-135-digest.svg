  <!-- 120 -->
  <rect x="652" y="104" width="272" height="200" rx="14" fill="#ffffff" stroke="#dfe6ee"/>
  <rect x="652" y="104" width="5" height="200" rx="2.5" fill="#dc2626"/>
  <text x="674" y="150" class="num" fill="#dc2626">120</text>
