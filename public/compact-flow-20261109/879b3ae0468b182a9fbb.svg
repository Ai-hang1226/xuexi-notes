<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" role="img" aria-label="浓度：先追两列"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="634" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">浓度：先追两列</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#dceee7" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">原液</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">总量 x；溶质 0.3x</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8edf8" stroke="#9fb9e6" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#173d79">加100克水</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">总量变为 x＋100</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">溶质仍为 0.3x</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#f3e7d8" stroke="#9fb9e6" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#173d79">混匀后倒出1/5</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">总量、溶质都剩4/5</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">浓度与倒出前相同</text><rect x="30" y="349" width="360" height="184" rx="16" fill="#e8edf8" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="387" font-size="31" font-weight="700" fill="#173d79">加入80克、10%溶液</text><text x="50" y="445" font-size="27" font-weight="500" fill="#26374c">总量增加80克</text><text x="50" y="485" font-size="27" font-weight="500" fill="#26374c">溶质增加8克</text><rect x="420" y="349" width="360" height="184" rx="16" fill="#c9e8df" stroke="#9fb9e6" stroke-width="2"/><text x="440" y="387" font-size="31" font-weight="700" fill="#173d79">用最终20%列式