<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" role="img" aria-label="逻辑与定义｜四个检查句"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="644" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">逻辑与定义｜四个检查句</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">解释原因</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">原因是选项提供的？</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">还是我自己补进去的？</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">必要条件</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">这个条件服务于哪个结果？</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">是否对准题干结论？</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">陌生表达</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">先看哪些短语能读懂</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">再判断它表达的态度</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">最适合</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">一个选项能用以后</text><text x="638" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">还要比较谁更适合</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"></g><text x="30" y="586" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">四类问题分别检查，陌生题仍需验证。</text></g></svg>