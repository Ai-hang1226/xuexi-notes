<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="第3题｜正确政绩观：参考辨析"><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="760" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="40" font-weight="700" fill="#182a48">第3题｜正确政绩观</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="149" font-size="38" font-weight="700" fill="#173d79">① 为谁、如何出政绩</text><text x="54" y="198" font-size="31" fill="#26374c">为人民出政绩</text><text x="54" y="242" font-size="31" fill="#26374c">坚持实干、造福一方</text><path d="M300 268 V293" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="54" y="355" font-size="38" font-weight="700" fill="#78511c">② 兼顾长远和全局</text><text x="54" y="404" font-size="31" fill="#26374c">功成不必在我、必定有我</text><text x="54" y="448" font-size="31" fill="#26374c">一域增光与全局添彩</text><path d="M300 474 V499" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="54" y="561" font-size="38" font-weight="700" fill="#176659">③ 逐项核对</text><text x="54" y="610" font-size="31" fill="#26374c">一张蓝图接续推进</text><text x="54" y="654" font-size="31" fill="#26374c">五项均正确；参考 D</text></g></svg>