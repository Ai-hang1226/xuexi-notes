<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" role="img" aria-label="选组长｜两个条件同时满足"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="686" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">选组长｜两个条件同时满足</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先圈目标</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">组长 ＝ 中年 ＋ 语文</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">两个条件缺一不可</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 分别排查</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">年龄：中年为乙及丁或戊</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">科目：乙、戊是数学</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 合并条件</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">乙、戊排除</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">原页结论：丁是组长</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 代回核对</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">青年：甲、丙、戊</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">中年：乙、丁；语文：甲</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">、丁</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g></g></svg>