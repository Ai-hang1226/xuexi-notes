<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第1题｜基准与均值"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第1题｜基准与均值</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 设未知基准价</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">基准价设为 x 元</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">两组均值各自表达</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 区分两组</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">中奖：x−12，占 1/4</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">未中奖：x+4，占 3/4</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 按人数加权</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">(x−12)/4 + 3(x+4)/4</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">等于总体均值 88</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 解得基准</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">加权偏差 −3+3=0</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">所以 x=88 元</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">数值相同，基准与总体均值仍不同。</text></g></svg>