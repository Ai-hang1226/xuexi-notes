<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 856" role="img" aria-label="空间折叠｜先面再边和点"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="856" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">空间折叠｜先面再边和点</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 先辨认立体</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">正方体／长方体：可找相对面</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">四面体：没有相对面</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 固定参照面</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">先选一个有明显图案的面</text><text x="638" y="237" font-size="26" fill="#785b35" font-weight="600" xml:space="preserve">注意统一观察方向</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 核对公共边</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">先确认折后对应同一条边</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">再比边上图案与两端点</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 三面交于同一顶点</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">固定同一顶点与同组三个面</text><text x="638" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">从同方向比较环绕顺序</text><rect x="30" y="596" width="1140" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="636" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">⑤ 最后代回原图</text><text x="50" y="691" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">检查题目特殊条件与选项</text><text x="50" y="733" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">原图保留在下方，可放大看</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 194 H613"/><path d="M894 292 V318 H306 V343"/><path d="M584 442 H613"/><path d="M894 540 V566 H600 V591"/></g></g></svg>