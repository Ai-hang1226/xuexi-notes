<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-label="第48题｜玉米种质保存"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="396" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第48题｜玉米种质保存</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 材料概括</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">种子形式是主要保存方式</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">低温种子保存是主要方式</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 联系玉米</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">玉米通常以种子保存</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">作物科学研究所有低温保</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">存记录</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 题目问“最可能”</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">对应低温种子保存</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">参考 A；原卷首答 A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/></g></g></svg>