<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 558" role="img" aria-label="这轮先落实四个动作"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="558" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">这轮先落实四个动作</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e1efe8" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">先把关系说清楚</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">三词造句，核对方向</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">混合平均，先认权重</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e4edf6" stroke="#9fb9e6" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#173d79">分母写出比较期</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">增长率＝增量÷基期</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">先标“上年”，再取数</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#f5ebd9" stroke="#9fb9e6" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#173d79">估算先落实参照</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">180×2/3＝120</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">131＞120，方向不反</text><rect x="30" y="349" width="360" height="184" rx="16" fill="#e6e8f3" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="387" font-size="31" font-weight="700" fill="#173d79">时间紧也保留排除</text><text x="50" y="445" font-size="27" font-weight="500" fill="#26374c">已知错误项先划掉</text><text x="50" y="485" font-size="27" font-weight="500" fill="#26374c">只从剩余选项中选择</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"></g></g></svg>