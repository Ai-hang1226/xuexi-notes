<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1020" viewBox="0 0 1300 1020"><rect width="1300" height="1020" fill="#fbfaf6"/><g font-family="Times New Roman, Microsoft YaHei, 微软雅黑, sans-serif" fill="#20313d"><text x="60" y="78" font-size="44" font-weight="800">言语复盘｜把直觉落实成证据</text><text x="60" y="134" font-size="32" font-weight="600">3道错题 ＋ 第6题答对但纠结 · 原卷7/10，11分58秒</text><rect x="50" y="180" width="590" height="320" rx="20" fill="#eaf4fc" stroke="#245c83" stroke-width="2"/><text x="78" y="236" font-size="38" font-weight="800" fill="#245c83">04｜细节选非</text><text x="78" y="290" font-size="32" font-weight="800">看完四项，再回文定位</text><text x="78" y="354" font-size="32" font-weight="600">“未逐字出现”可合理概括</text><text x="78" y="402" font-size="32" font-weight="600">地区、范围、可能性逐项对照</text><text x="78" y="450" font-size="32" font-weight="600">有明确矛盾，才作为排除依据</text><rect x="670" y="180" width="590" height="320" rx="20" fill="#f2edfb" stroke="#685093" stroke-width="2"/><text x="698" y="236" font-size="38" font-weight="800" fill="#685093">06｜标题填入</text><text x="698" y="290" font-size="32" font-weight="800">共同结论统摄两个例子</text><text x="698" y="354" font-size="32" font-weight="600">真理相对性 → 三角形举例</text><text x="698" y="402" font-size="32" font-weight="600">价值评判同理 → 内卷举例</text><text x="698" y="450" font-size="32" font-weight="600">防止只抓例子或另加判断</text><rect x="50" y="530" width="590" height="320" rx="20" fill="#e8f4ee" stroke="#306c51" stroke-width="2"/><text x="78" y="586" font-size="38" font-weight="800" fill="#306c51">08｜语句排序</text><text x="78" y="640" font-size="32" font-weight="800">先引出，再具体；核对指代</text><text x="78" y="704" font-size="32" font-weight="600">④引出三大碑群 → ⑤谈其一</text><text x="78" y="752" font-size="32" font-weight="600">①“它们”承接④多个对象</text><text x="78" y="800" font-size="32" font-weight="600">④①捆绑 → 回代验证B</text><rect x="670" y="530" width="590" height="320" rx="20" fill="#fff3df" stroke="#936422" stroke-width="2"/><text x="698" y="586" font-size="38" font-weight="800" fill="#936422">10｜逻辑填空</text><text x="698" y="640" font-size="32" font-weight="800">从语义明确的一空突破</text><text x="698" y="704" font-size="32" font-weight="600">生存繁衍 → 开枝散叶</text><text x="698" y="752" font-size="32" font-weight="600">地理环境 → 屏障，回代验证</text><text x="698" y="800" font-size="32" font-weight="600">一空可用，不等于整组最优</text><text x="60" y="933" font-size="32" font-weight="800">原卷首答保留 → 讨论定稿 → 陌生题独立验证（待做）</text><text x="60" y="985" font-size="32">10/30为复盘日；作答日未知，不增加当天新题量。</text></g></svg>
