<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第5题｜比率看方向"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第5题｜比率看方向</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 写出中间指标</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">生师比＝学生人数÷教师人数</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">即第三项÷第一项</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 对照A项</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">合格率＝合格产品数÷总数</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">也是第三项÷第一项</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 核对原答C</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">租售比＝租金÷售价</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">是第一项÷第三项</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 不按名称硬猜</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">浓度＝溶质质量÷溶液质量</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">分母不是单独的溶剂质量</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">原答C；比率要按指标定义写式。</text></g></svg>