<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 732" role="img" aria-label="第6题｜平均价格升降"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="732" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第6题｜平均价格升降</text><rect x="30" y="100" width="360" height="230" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 锁定对象</text><text x="50" y="242" font-size="27" font-weight="500" fill="#26374c">按柴油机／汽油机</text><text x="50" y="282" font-size="27" font-weight="500" fill="#26374c">分别看出口与进口</text><rect x="420" y="100" width="360" height="230" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 平均价格＝金额÷</text><text x="440" y="184" font-size="31" font-weight="700" fill="#176659">数量</text><text x="440" y="242" font-size="27" font-weight="500" fill="#26374c">金额增速大于数量增速</text><text x="440" y="282" font-size="27" font-weight="500" fill="#26374c">在本题条件下单价上升</text><rect x="810" y="100" width="360" height="230" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 对照同口径数据</text><text x="830" y="242" font-size="27" font-weight="500" fill="#26374c">柴油出口18.9%＞10.0%</text><text x="830" y="282" font-size="27" font-weight="500" fill="#26374c">柴油进口41.7%＞7.3%</text><rect x="30" y="396" width="360" height="230" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="434" font-size="31" font-weight="700" fill="#5e4487">④ 再核对汽油机</text><text x="50" y="538" font-size="27" font-weight="500" fill="#26374c">出口3.4%＜6.3%</text><text x="50" y="578" font-size="27" font-weight="500" fill="#26374c">进口－28.5%＜－28.2%</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 215 H415"/><path d="M782 215 H805"/><path d="M990 334 V363 H210 V391"/></g><text x="30" y="676" font-size="27" font-weight="600" fill="#3b4c61">原答D不确定；平均数和比重要区分。</text></g></svg>