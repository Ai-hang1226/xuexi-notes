<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 725" role="img" aria-label="定义：按条件逐项对"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="725" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">定义：按条件逐项对</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">题干定义是判断标准</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">① 先看问法</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">属于／不属于？</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">问哪个定义先读哪条</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#7e591c" font-weight="700" xml:space="preserve">② 圈必要条件</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">谁对谁做？用何方式？</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">原因、目的、结果是什么？</text><rect x="30" y="393" width="1140" height="188" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">③ 逐项对照</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">关键条件不符 → 排除</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">剩余选项比较贴合程度</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H600 V388"/></g><text x="30" y="631" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">以题干定义为准</text><text x="30" y="667" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">生活常识不能替代定义</text></g></svg>