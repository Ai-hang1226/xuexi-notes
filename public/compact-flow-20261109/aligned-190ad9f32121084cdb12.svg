<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" role="img" aria-label="逻辑填空｜四步找依据"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="644" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">逻辑填空｜四步找依据</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 读语境</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">这句话想表达什么？</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">看主体、对象、动作</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 找线索</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">看解释、转折、因果</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">也看整句或全文意思</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 比差别</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">比较词义、对象、程度</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不清楚的先保留</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 回代整组</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">每一空都放回去读</text><text x="638" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">检查全句是否贴切</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 194 H613"/><path d="M894 292 V318 H306 V343"/><path d="M584 442 H613"/></g><text x="30" y="586" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">直觉可提出候选，选择要有依据。</text></g></svg>