<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第2题｜美白剂的论证"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第2题｜美白剂的论证</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 锁定结论</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">讨论的是这种美白剂</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">是否安全有效</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 对齐判断对象</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">C：细菌衍生产物毒性低</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">给安全性补充证据</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 区分D项</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">D：细菌一般不致病</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">不等于衍生产物安全</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 判断支持方向</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">安全或有效的一方面获支</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">持</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">即可构成支持 → 参考C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答D；原题术语混用，原文照录。</text></g></svg>