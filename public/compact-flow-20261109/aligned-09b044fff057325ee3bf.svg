<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第16题｜检查语病"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第16题｜检查语病</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 先找主干</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">谁做什么</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">句子主干是否完整</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 再看结构</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">搭配、句式和语序</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">是否清楚、协调</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 检查指向</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">A、D按平台判定有歧义</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">省略主语不一定有病</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 比较选项</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">B混用定义句式</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">C表意较明确 → 参考 C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">依据原题和讨论定稿；独立掌握待验证。</text></g></svg>