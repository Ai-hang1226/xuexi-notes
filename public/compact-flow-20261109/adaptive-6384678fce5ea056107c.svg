<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第7题｜逐句核验"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第7题｜逐句核验</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 审题对象</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">全过程人民民主</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">逐条对照表述</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 核对 ① 与 ③</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">民主不只体现在投票</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">也不只适用于基层事务</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 核对 ② 与 ④</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">民主选举等环节</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">以及广泛、真实、管用</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 回代选项</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">②④正确 → A</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">入门题不等于全面掌握</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">历史自编题复盘；独立掌握另行验证。</text></g></svg>