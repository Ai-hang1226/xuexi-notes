<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第3题｜交叉与包含"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第3题｜交叉与包含</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 分清三个角度</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">本土：地域；野生：生长</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">方式</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">名贵：价值</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 看能否同时成立</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">同一药材可同时满足</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">三个条件</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 看原答D</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">社区治理属于社会治理</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">这里体现种属包含</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 对照题目关系</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">沿海、跨省、城际高铁</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">可交叉 → 参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答D；本土与野生不是矛盾项。</text></g></svg>