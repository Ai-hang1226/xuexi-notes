<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-labelledby="t d"><title id="t">逻辑与定义判断的四个检查句</title><desc id="d">先定结论或定义，再核对事实、条件对象、陌生表达和适合度。</desc><rect width="1240" height="790" rx="20" fill="#f5f7fa"/><g font-family="Times New Roman,Microsoft YaHei,微软雅黑,sans-serif" fill="#182b43" font-weight="700"><text x="48" y="66" font-size="44">四个检查句：证据、对象与择优</text><rect x="48" y="108" width="550" height="250" rx="15" fill="#e8eff6"/><text x="72" y="166" font-size="38">解释原因</text><text x="72" y="233" font-size="32">原因是选项提供的？</text><text x="72" y="293" font-size="32">还是我补进去的？</text><rect x="638" y="108" width="550" height="250" rx="15" fill="#e8eff6"/><text x="662" y="166" font-size="38">必要条件</text><text x="662" y="233" font-size="32">这个条件服务于哪个结果？</text><text x="662" y="293" font-size="32">是否对准题干结论？</text><rect x="48" y="398" width="550" height="250" rx="15" fill="#e8f2ed"/><text x="72" y="456" font-size="38">陌生表达</text><text x="72" y="523" font-size="32">哪些短语能读懂？</text><text x="72" y="583" font-size="32">它们表达什么具体态度？</text><rect x="638" y="398" width="550" height="250" rx="15" fill="#e8f2ed"/><text x="662" y="456" font-size="38">最适合</text><text x="662" y="523" font-size="32">这个选项能用以后，</text><text x="662" y="583" font-size="32">是否继续比较谁更适合？</text><text x="48" y="729" font-size="32">已讨论的方法，用陌生题检验；认可与听懂不改原答或掌握状态。</text></g></svg>
