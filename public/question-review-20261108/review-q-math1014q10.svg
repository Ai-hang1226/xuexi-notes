<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1020" role="img" aria-labelledby="title desc"><title id="title">第10题｜每天到每周</title><desc id="desc">依据原题与参考解析制作的复习图。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1020" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei, sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">第10题｜每天到每周</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">① 每个对应日</text><text x="58" y="198" font-size="32" fill="#26374c">下一周比上一周</text><text x="58" y="242" font-size="32" fill="#26374c">同一天多 7×2=14 件</text><path d="M300 269 V298" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="313" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">② 整周增加</text><text x="58" y="411" font-size="32" fill="#26374c">7 个对应日各多 14 件</text><text x="58" y="455" font-size="32" fill="#26374c">相邻周总量差 98 件</text><path d="M300 482 V511" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="526" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="575" font-size="38" font-weight="700" fill="#78511c">③ 利用倍数关系</text><text x="58" y="624" font-size="32" fill="#26374c">第五周比第二周多 3×98</text><text x="58" y="668" font-size="32" fill="#26374c">又第五周是第二周的 2 倍</text><path d="M300 695 V724" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="739" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="788" font-size="38" font-weight="700" fill="#5e4487">④ 反推第一周</text><text x="58" y="837" font-size="32" fill="#26374c">第二周 294 件</text><text x="58" y="881" font-size="32" fill="#26374c">第一周 294−98=196 件</text><text x="36" y="1000" font-size="26" font-weight="600" fill="#3b4c61">原题答对；实际提速仍需新题验证。</text></g></svg>