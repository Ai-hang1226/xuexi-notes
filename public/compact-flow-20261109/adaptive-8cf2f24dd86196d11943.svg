<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 925" role="img" aria-label="言语：沿结构找落点"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="925" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">言语：沿结构找落点</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">先读文段，再核对选项</text><rect x="30" y="150" width="552" height="264" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">① 圈标志词</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">但是／因此／需要／更</text><rect x="618" y="150" width="552" height="264" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="188" font-size="31" fill="#2b5288" font-weight="700">② 定全文结构</text><text x="638" y="246" font-size="27" fill="#26374c" font-weight="500">转折后、递进后</text><text x="638" y="286" font-size="27" fill="#26374c" font-weight="500">因果看结果；总分看总句</text><text x="638" y="326" font-size="27" fill="#26374c" font-weight="500">并列提共性</text><text x="638" y="366" font-size="27" fill="#26374c" font-weight="500">对策找上位总对策</text><rect x="30" y="479" width="552" height="264" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="517" font-size="31" fill="#7e591c" font-weight="700">③ 找作者落点</text><text x="50" y="575" font-size="27" fill="#26374c" font-weight="500">分句在为哪句服务？</text><text x="50" y="615" font-size="27" fill="#26374c" font-weight="500">排除背景、举例和修饰</text><rect x="618" y="479" width="552" height="264" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="517" font-size="31" fill="#176552" font-weight="700">④ 再匹配选项</text><text x="638" y="575" font-size="27" fill="#26374c" font-weight="500">话题词 ＋ 落点词</text><text x="638" y="615" font-size="27" fill="#26374c" font-weight="500">保持范围和语气一致</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 282 H613"/><path d="M894 418 V446.5 H306 V474"/><path d="M584 611 H613"/></g><text x="30" y="793" font-size="27" fill="#3b4c61" font-weight="600">尾句、词频：只是线索</text><text x="30" y="829" font-size="27" fill="#3b4c61" font-weight="600">总句、分句：看服务关系</text><text x="30" y="865" font-size="27" fill="#3b4c61" font-weight="600">全文结构才是判断依据</text></g></svg>