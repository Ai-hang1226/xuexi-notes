<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 797" role="img" aria-label="错题复盘闭环"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="797" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">错题复盘闭环</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">错题、猜对、慢题都检查</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">① 归位</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">定位模块和知识点</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">关联真实方法笔记</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#7e591c" font-weight="700" xml:space="preserve">② 找病因</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">条件漏看？方法不会？</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">计算出错？速度偏慢？</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#2b5288" font-weight="700" xml:space="preserve">③ 记对策</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">留下可复用的触发线索</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">写清方法和易错提醒</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#176552" font-weight="700" xml:space="preserve">④ 新题复测</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">遮住解析，独立做新题</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">记录正确率、用时和错因</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H306 V388"/><path d="M584 487 H613"/></g><text x="30" y="631" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">猜对仍待验证</text><text x="30" y="667" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">复盘完成 ≠ 独立掌握</text><text x="30" y="703" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">未通过 → 回到找病因</text><text x="30" y="739" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">跨时间复测，再更新状态</text></g></svg>