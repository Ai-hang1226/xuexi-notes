<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" role="img" aria-label="这轮先落实四个动作"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="608" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">这轮先落实四个动作</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e1efe8" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">先把关系说清楚</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">三词造句，核对方向</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">混合平均，先认权重</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e4edf6" stroke="#9fb9e6" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">分母写出比较期</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">增长率＝增量÷基期</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">先标“上年”，再取数</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#f5ebd9" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">估算先落实参照</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">180×2/3＝120</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">131＞120，方向不反</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#e6e8f3" stroke="#9fb9e6" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">时间紧也保留排除</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">已知错误项先划掉</text><text x="638" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">只从剩余选项中选择</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"></g></g></svg>