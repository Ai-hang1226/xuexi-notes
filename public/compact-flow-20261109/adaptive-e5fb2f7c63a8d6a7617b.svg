<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 765" role="img" aria-label="论证：找准缺口"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="765" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">论证：找准缺口</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">先写论据、结论、缺口</text><rect x="30" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">① 写出论据</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">咖啡饮用者</text><text x="50" y="286" font-size="27" fill="#26374c" font-weight="500">磨牙指数更高</text><rect x="618" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="188" font-size="31" fill="#2b5288" font-weight="700">② 圈定结论</text><text x="638" y="246" font-size="27" fill="#26374c" font-weight="500">饮用咖啡</text><text x="638" y="286" font-size="27" fill="#26374c" font-weight="500">直接导致磨牙</text><rect x="30" y="399" width="552" height="184" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="437" font-size="31" fill="#7e591c" font-weight="700">③ 补出缺口</text><text x="50" y="495" font-size="27" fill="#26374c" font-weight="500">病理、心理等因素</text><text x="50" y="535" font-size="27" fill="#26374c" font-weight="500">是否存在组间差异？</text><rect x="618" y="399" width="552" height="184" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="437" font-size="31" fill="#176552" font-weight="700">④ 检验选项</text><text x="638" y="495" font-size="27" fill="#26374c" font-weight="500">选项是否改变了</text><text x="638" y="535" font-size="27" fill="#26374c" font-weight="500">这条推理链？</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 242 H613"/><path d="M894 338 V366.5 H306 V394"/><path d="M584 491 H613"/></g><text x="30" y="633" font-size="27" fill="#3b4c61" font-weight="600">相关 ≠ 直接因果</text><text x="30" y="669" font-size="27" fill="#3b4c61" font-weight="600">同话题 ≠ 有支持或削弱</text><text x="30" y="705" font-size="27" fill="#3b4c61" font-weight="600">题内示例，不作医学结论</text></g></svg>