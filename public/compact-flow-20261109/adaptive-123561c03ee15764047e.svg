<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 693" role="img" aria-label="类比：关系要对齐"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="693" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">类比：关系要对齐</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">先横向，再纵向比较</text><rect x="30" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">① 先造句</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">少加字，保持句式一致</text><rect x="618" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="638" y="188" font-size="31" fill="#2b5288" font-weight="700">② 判一级关系</text><text x="638" y="246" font-size="27" fill="#26374c" font-weight="500">一种／一部分？</text><text x="638" y="286" font-size="27" fill="#26374c" font-weight="500">因果／目的／条件？</text><rect x="30" y="399" width="552" height="184" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="50" y="437" font-size="31" fill="#7e591c" font-weight="700">③ 比二级关系</text><text x="50" y="495" font-size="27" fill="#26374c" font-weight="500">方向、必要性、语义结构</text><text x="50" y="535" font-size="27" fill="#26374c" font-weight="500">必要条件：没它不行</text><rect x="618" y="399" width="552" height="184" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="437" font-size="31" fill="#176552" font-weight="700">④ 核对各组选项</text><text x="638" y="495" font-size="27" fill="#26374c" font-weight="500">与题干保持同一关系</text><text x="638" y="535" font-size="27" fill="#26374c" font-weight="500">方向、层次也要一致</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 242 H613"/><path d="M894 338 V366.5 H306 V394"/><path d="M584 491 H613"/></g><text x="30" y="633" font-size="27" fill="#3b4c61" font-weight="600">能搭配，只是第一步</text></g></svg>