<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc"><title id="title">申论三题首答基线与改写迁移记录</title><desc id="desc">DAY5得分11.5/15，DAY6得分10/15，DAY7得分12/20。不同题型不可据此判断进退，改写及迁移尚无记录。</desc><rect width="1120" height="940" rx="24" fill="#f4f7fc"/><style>text{font-family:'Times New Roman','Microsoft YaHei','微软雅黑','PingFang SC',sans-serif;fill:#173758;font-size:32px;font-weight:600}.title{font-size:44px;font-weight:800}.head{font-size:38px;font-weight:800}.small{font-size:28px}</style><text x="44" y="70" class="title">我的申论｜首答基线</text><text x="44" y="122">评分日期：2026-10-28；实际作答日期待补</text><rect x="36" y="170" width="1048" height="142" rx="16" fill="white"/><text x="60" y="219" class="head">DAY5｜城市绿化 · 做法</text><rect x="60" y="246" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="246" width="475.3333333333333" height="28" rx="14" fill="#307a69"/><text x="720" y="270">11.5／15 · 76.7%</text><rect x="36" y="334" width="1048" height="142" rx="16" fill="white"/><text x="60" y="383" class="head">DAY6｜营商环境 · 措施与成效</text><rect x="60" y="410" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="410" width="413.3333333333333" height="28" rx="14" fill="#3568b5"/><text x="720" y="434">10／15 · 66.7%</text><rect x="36" y="498" width="1048" height="142" rx="16" fill="white"/><text x="60" y="547" class="head">DAY7｜背包银行 · 特点与作用</text><rect x="60" y="574" width="620" height="28" rx="14" fill="#e1e8f3"/><rect x="60" y="574" width="372" height="28" rx="14" fill="#7b61a3"/><text x="720" y="598">12／20 · 60.0%</text><rect x="36" y="684" width="1048" height="92" rx="16" fill="#e8f3ec"/><text x="60" y="741" class="head">首答3份　｜　改写0份　｜　迁移0份</text><text x="44" y="828" class="small">这是不同题型的基线比较，不是按作答时间绘制的趋势。</text><text x="44" y="876" class="small">等待同题改写与陌生同类题结果，再记录真实改善。</text><text x="44" y="920" class="small">学习性参考分；原答保留，改写另记，不预填进步。</text></svg>