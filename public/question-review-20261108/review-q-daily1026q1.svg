<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1020" role="img" aria-labelledby="title desc"><title id="title">第1题｜完整保护</title><desc id="desc">依据已批改历史自编题及已有解析绘制。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1020" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei, sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">第1题｜完整保护</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">① 文段先提出</text><text x="58" y="198" font-size="32" fill="#26374c">只保存成品</text><text x="58" y="242" font-size="32" fill="#26374c">可能忽略器物背后的联系</text><path d="M300 269 V298" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="313" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">② 找这些联系</text><text x="58" y="411" font-size="32" fill="#26374c">制作技艺、师徒协作</text><text x="58" y="455" font-size="32" fill="#26374c">节庆与日用等生活场景</text><path d="M300 482 V511" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="526" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="575" font-size="38" font-weight="700" fill="#78511c">③ 看“因此”之后</text><text x="58" y="624" font-size="32" fill="#26374c">保护不能只留住成品</text><text x="58" y="668" font-size="32" fill="#26374c">还要延续技艺和生活联系</text><path d="M300 695 V724" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="739" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="788" font-size="38" font-weight="700" fill="#5e4487">④ 完整概括</text><text x="58" y="837" font-size="32" fill="#26374c">保存与延续相结合</text><text x="58" y="881" font-size="32" fill="#26374c">参考 B</text><text x="36" y="1000" font-size="26" font-weight="600" fill="#3b4c61">历史自编题复盘；独立掌握另行验证。</text></g></svg>