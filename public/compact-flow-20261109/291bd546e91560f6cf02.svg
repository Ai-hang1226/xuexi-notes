<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第6题｜三队人数"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第6题｜三队人数</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 用乙统一比例</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">原来甲:乙:丙＝8:12:15</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">设为8x、12x、15x</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 利用乙人数不变</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">调整后甲:乙＝3:4</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">因此调整后甲＝9x</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 用增加人数求x</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">8x＋5＝9x</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">所以x＝5</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 计算原来总人数</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">(8＋12＋15)×5＝175</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">参考B</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/><path d="M990 288 V317 H210 V345"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答C；本人确认末步加错。</text></g></svg>