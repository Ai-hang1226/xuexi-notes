<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 966" role="img" aria-label="选组长｜两个条件同时满足"><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="966" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="40" font-weight="700" fill="#182a48">选组长｜两个条件同时满足</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="149" font-size="38" font-weight="700" fill="#173d79">① 先圈目标</text><text x="54" y="198" font-size="31" fill="#26374c">组长 ＝ 中年 ＋ 语文</text><text x="54" y="242" font-size="31" fill="#26374c">两个条件缺一不可</text><path d="M300 268 V293" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="54" y="355" font-size="38" font-weight="700" fill="#78511c">② 分别排查</text><text x="54" y="404" font-size="31" fill="#26374c">年龄：中年为乙及丁或戊</text><text x="54" y="448" font-size="31" fill="#26374c">科目：乙、戊是数学</text><path d="M300 474 V499" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="54" y="561" font-size="38" font-weight="700" fill="#176659">③ 合并条件</text><text x="54" y="610" font-size="31" fill="#26374c">乙、戊排除</text><text x="54" y="654" font-size="31" fill="#26374c">原页结论：丁是组长</text><path d="M300 680 V705" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="718" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="54" y="767" font-size="38" font-weight="700" fill="#5e4487">④ 代回核对</text><text x="54" y="816" font-size="31" fill="#26374c">青年：甲、丙、戊</text><text x="54" y="860" font-size="31" fill="#26374c">中年：乙、丁；语文：甲、丁</text></g></svg>