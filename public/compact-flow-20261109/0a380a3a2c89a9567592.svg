<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第1题｜交点位置"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第1题｜交点位置</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先数曲直交点</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">每幅都是1个</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">单靠数量无法选择</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 看交点的具体部位</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">端点、非端点交替</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">下一幅应取非端点相交</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 对照平台参考</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">D符合这条交点规则</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">原卷答案按D保留</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 保留另一解释</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">横竖线／斜线交替可支持</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">A</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">本题存在解释分歧</text><g fill="none" 