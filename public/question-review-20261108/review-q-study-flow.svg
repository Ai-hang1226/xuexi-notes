<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">看图复习的三个步骤</title><desc id="desc">先回看原题，再看重点图解，然后用另一道真题验证。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="600" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="66" font-size="44" font-weight="700" fill="#182a48">看图复习，三步走</text><rect x="30" y="100" width="540" height="120" rx="18" fill="#e8f0ff" stroke="#9fb9e6"/><text x="58" y="150" font-size="38" font-weight="700" fill="#173d79">① 回看原题</text><text x="58" y="196" font-size="32" fill="#26374c">看看题目和当时的作答</text><path d="M300 229 V253" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="270" width="540" height="120" rx="18" fill="#e8f6f2" stroke="#a0d0c4"/><text x="58" y="320" font-size="38" font-weight="700" fill="#176659">② 看标记和箭头图</text><text x="58" y="366" font-size="32" fill="#26374c">找条件、关系和解题入口</text><path d="M300 399 V423" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="440" width="540" height="120" rx="18" fill="#fff2df" stroke="#dfc49a"/><text x="58" y="490" font-size="38" font-weight="700" fill="#78511c">③ 换一道真题验证</text><text x="58" y="536" font-size="32" fill="#26374c">记录独立首答和真实用时</text></g></svg>