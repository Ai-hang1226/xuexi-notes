<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第7题｜方式与效果"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第7题｜方式与效果</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 看C项左边</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">移动支付</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">有助于便捷交易</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 看C项右边</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">共享单车</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">有助于提高车辆利用率</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 对照原答D</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">移动支付是电子支付的一</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">种</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">与右边方式和效果不同</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 找一致关系</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">两边均为方式 → 效果</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">参考C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答D；有助于不等于必然实现。</text></g></svg>