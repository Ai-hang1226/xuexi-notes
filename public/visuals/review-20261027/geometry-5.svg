<path d="M240 540 L816 252 M600 360 L960 540" fill="none" stroke="#517da6" stroke-width="4" stroke-dasharray="12 9"/>
<text x="211" y="585" font-size="38">D</text><text x="580" y="585" font-size="38">O</text><text x="965" y="585" font-size="38">A</text><text x="557" y="359" font-size="38">B</text><text x="819" y="232" font-size="38">C</text>
<text x="713" y="475" font-size="38">面积5</text><text x="779" y="374" font-size="38">面积6</text>
<text x="48" y="646" font-size="32">S△ABD = 5 × 4 ÷ 2 = 10 → 中点平分得5 → 四边形面积 = 5 + 6 = 11</text><text x="48" y="689" font-size="28">图解为依据原题条件重绘；原图另行保留。估图“小于6”不作为证明。</text></g></svg>
