<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第35题｜两层关系"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第35题｜两层关系</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先拆内部</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">勤则兴，懒则败</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">各有条件／因果关系</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 再看对应位置</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">勤 ↔ 懒</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">兴 ↔ 败</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 回代选项 D</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">进则荣，退则辱</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">内部与对应位置一起看</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 对比 A</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">大、小虽反义</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">内部关系与题干不同</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/><path d="M990 288 V317 H210 V345"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">依据原题与已有解析；独立掌握待验证。</text></g></svg>