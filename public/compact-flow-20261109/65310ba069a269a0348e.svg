<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第3题｜分组余数"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第3题｜分组余数</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 把“少几人”翻译</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">除4少3、除3少2、除2少1</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">分别都是余1</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 得到人数结构</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">N－1可同时被2、3、4整除</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">所以N＝12k＋1</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 别忘其他条件</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">超过1000且为5的倍数</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">结合选项批量排除</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 核对最小选项</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">1045满足所有条件</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">参考D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答D；不要把k直接当成1。</text></g></svg>