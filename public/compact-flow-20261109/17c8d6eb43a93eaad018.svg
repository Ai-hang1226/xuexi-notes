<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第3题｜圆锥与圆柱"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第3题｜圆锥与圆柱</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 小锥与大锥相似</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">高度6:12＝1:2</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">体积＝1:8 → 大锥需8</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">分钟</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 算圆柱注水时间</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">总时间1＋30＝31分钟</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">上部圆柱：31－8＝23</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">分钟</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 等体积换算</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">同底：圆锥高12厘米</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">水倒入同底圆柱，高4厘</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">米</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 接上圆柱段</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">4÷8＝0.5厘米／分钟</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">12＋23×0.5＝23.5厘米</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答B；4厘米是同底圆柱水高。</text></g></svg>