<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第6题｜先总后扣"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第6题｜先总后扣</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先数全部安排</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">周四 4 场，周五 5 场</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">9 场里选 3 场：84 种</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 扣重复选甲</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">固定两天的甲</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">第三场从其余 7 场选</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 扣重复选乙</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">同理扣 7 种</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">选 3 场，两类不会同时</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">发生</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 得到合法方案</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">84−7−7=70 种</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">参考 D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原卷记录 C；本人回忆猜 D，差异保留。</text></g></svg>