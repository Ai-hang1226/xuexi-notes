<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-label="互联网发展：先抓四组内容"><rect width="1200" height="710" rx="22" fill="#f7faf9"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">互联网发展：先抓四组内容</text><text x="30" y="105" font-size="27" fill="#526378" font-weight="600" xml:space="preserve">三段、四段都要回到材料核对</text><rect x="30" y="145" width="552" height="168" rx="16" fill="#dceee7" stroke="#aac5be" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">① 接入与起步</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">接入国际互联网；慢、少 → 普及</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">从模仿到孕育内生力量</text><rect x="618" y="145" width="552" height="168" rx="16" fill="#e8edf8" stroke="#aac5be" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">② 迈向网络大国</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">三项第一；企业快速发展</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">互联网＋拓展并获国家重视</text><rect x="30" y="373" width="552" height="168" rx="16" fill="#f3e7d8" stroke="#aac5be" stroke-width="2"/><text x="50" y="413" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">③ 建设网络强国</text><text x="50" y="468" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">提出目标；乌镇大会搭建平台</text><text x="50" y="510" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">共享共治；参与全球网络治理</text><rect x="618" y="373" width="552" height="168" rx="16" fill="#dceee7" stroke="#aac5be" stroke-width="2"/><text x="638" y="413" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">④ 新技术与自主创新</text><text x="638" y="468" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">5G商用；展现多样应用场景</text><text x="638" y="510" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">区块链：核心技术自主创新</text><text x="30" y="590" font-size="25" fill="#785b35" font-weight="600" xml:space="preserve">三段写法可将③④放在同一阶段，</text><text x="30" y="628" font-size="25" fill="#785b35" font-weight="600" xml:space="preserve">关键是治理和技术两组信息都覆盖。</text><text x="30" y="666" font-size="25" fill="#785b35" font-weight="600" xml:space="preserve">本图为学习整理，不代表官方评分。</text></g></svg>