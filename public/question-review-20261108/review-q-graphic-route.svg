<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" role="img" aria-labelledby="t d"><title id="t">图形推理：先看见，再动手</title><desc id="d">固定对象、按特征列候选、执行操作、验证全组、用陌生真题验证。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1180" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">图形推理｜看见再动手</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">① 固定观察对象</text><text x="58" y="198" font-size="32" fill="#26374c">看黑白、完整轮廓</text><text x="58" y="242" font-size="32" fill="#26374c">找多幅图里重复的部分</text><path d="M300 268 V294" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="355" font-size="38" font-weight="700" fill="#176659">② 按特征列候选</text><text x="58" y="404" font-size="32" fill="#26374c">交点、连接、笔画</text><text x="58" y="448" font-size="32" fill="#26374c">元素种类、视图等</text><path d="M300 474 V500" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="561" font-size="38" font-weight="700" fill="#78511c">③ 把方法变成动作</text><text x="58" y="610" font-size="32" fill="#26374c">数公共边、查奇点</text><text x="58" y="654" font-size="32" fill="#26374c">画投影或比较最短距离</text><path d="M300 680 V706" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="718" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="767" font-size="38" font-weight="700" fill="#5e4487">④ 验证整组</text><text x="58" y="816" font-size="32" fill="#26374c">同一对象、同一口径</text><text x="58" y="860" font-size="32" fill="#26374c">所有题图和选项一起核对</text><path d="M300 886 V912" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="924" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="973" font-size="38" font-weight="700" fill="#173d79">⑤ 用陌生真题验证</text><text x="58" y="1022" font-size="32" fill="#26374c">先独立判断，再看解析</text><text x="58" y="1066" font-size="32" fill="#26374c">记录答案、实际用时和把握</text><text x="36" y="1160" font-size="27" font-weight="600" fill="#3b4c61">特征只提示候选，不保证一定考该规律。</text></g></svg>