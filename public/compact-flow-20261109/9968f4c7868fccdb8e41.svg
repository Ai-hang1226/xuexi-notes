<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-label="态度题｜区分请求与结果"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="390" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">态度题｜区分请求与结果</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 题干已知</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">甲希望乙告知态度</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">乙的态度会影响甲</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 不要直接跳步</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">请求乙告知</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">不等于乙一定会告知</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 留意原题边界</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">现存为题干与选项摘要</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">须结合完整设问判断</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/></g><text x="30" y="334" font-size="27" font-weight="600" fill="#3b4c61">“不能确定会告知”不等于“不可能告知”。</text></g></svg>