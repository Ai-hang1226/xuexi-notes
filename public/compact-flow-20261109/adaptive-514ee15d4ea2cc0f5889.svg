<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 801" role="img" aria-label="错题复盘闭环"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="801" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">错题复盘闭环</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">错题、猜对、慢题都检查</text><rect x="30" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">① 归位</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">定位模块和知识点</text><text x="50" y="286" font-size="27" fill="#26374c" font-weight="500">关联真实方法笔记</text><rect x="618" y="150" width="552" height="184" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="638" y="188" font-size="31" fill="#7e591c" font-weight="700">② 找病因</text><text x="638" y="246" font-size="27" fill="#26374c" font-weight="500">条件漏看？方法不会？</text><text x="638" y="286" font-size="27" fill="#26374c" font-weight="500">计算出错？速度偏慢？</text><rect x="30" y="399" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="437" font-size="31" fill="#2b5288" font-weight="700">③ 记对策</text><text x="50" y="495" font-size="27" fill="#26374c" font-weight="500">留下可复用的触发线索</text><text x="50" y="535" font-size="27" fill="#26374c" font-weight="500">写清方法和易错提醒</text><rect x="618" y="399" width="552" height="184" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="437" font-size="31" fill="#176552" font-weight="700">④ 新题复测</text><text x="638" y="495" font-size="27" fill="#26374c" font-weight="500">遮住解析，独立做新题</text><text x="638" y="535" font-size="27" fill="#26374c" font-weight="500">记录正确率、用时和错因</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 242 H613"/><path d="M894 338 V366.5 H306 V394"/><path d="M584 491 H613"/></g><text x="30" y="633" font-size="27" fill="#3b4c61" font-weight="600">猜对仍待验证</text><text x="30" y="669" font-size="27" fill="#3b4c61" font-weight="600">复盘完成 ≠ 独立掌握</text><text x="30" y="705" font-size="27" fill="#3b4c61" font-weight="600">未通过 → 回到找病因</text><text x="30" y="741" font-size="27" fill="#3b4c61" font-weight="600">跨时间复测，再更新状态</text></g></svg>