<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="平均数与比重｜先看问法"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">平均数与比重｜先看问法</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">只问升降</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">a＞b 上升；a＜b 下降</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">a＝b 不变</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">若问平均数增长率</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">（a－b）÷（1＋b）</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">结果是增长率，用百分数表示</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">若问两期比重差</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">（A÷B）×（a－b）÷（1＋a）</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">两期占比之差，用百分点表示</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">所有情况核对口径</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">A、B是现期分子、分母</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">a、b是对应同一基期的增速</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">比较同口径正数；单位不要混用。</text></g></svg>