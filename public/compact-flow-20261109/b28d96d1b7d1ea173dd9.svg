<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 916" role="img" aria-label="语病辨析｜先看关系，再判错误"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="916" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">语病辨析｜先看关系，再判错误</text><text x="30" y="112" font-size="27" font-weight="700" fill="#182a48">关键词提醒你检查，不能替你完成判断</text><rect x="30" y="150" width="360" height="264" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="188" font-size="31" font-weight="700" fill="#173d79">① 找主干</text><text x="50" y="246" font-size="27" font-weight="500" fill="#26374c">谁怎样？谁做什么？什么</text><text x="50" y="286" font-size="27" font-weight="500" fill="#26374c">是什么？</text><text x="50" y="326" font-size="27" font-weight="500" fill="#26374c">先缩句，再放回修饰；不</text><text x="50" y="366" font-size="27" font-weight="500" fill="#26374c">强求句句主谓宾</text><rect x="420" y="150" width="360" height="264" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="440" y="188" font-size="31" font-weight="700" fill="#173d79">② 查搭配</text><text x="440" y="246" font-size="27" font-weight="500" fill="#26374c">主谓、动宾、修饰关系，</text><text x="440" y="286" font-size="27" font-weight="500" fill="#26374c">分别读得通吗？</text><text x="440" y="326" font-size="27" font-weight="500" fill="#26374c">并列宾语逐项代回；比喻</text><text x="440" y="366" font-size="27" font-weight="500" fill="#26374c">要看对应关系</text><rect x="810" y="150" width="360" height="264" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="830" y="188" font-size="31" font-weight="700" fill="#173d79">③ 查语序与句式</text><text x="830" y="246" font-size="27" font-weight="500" fill="#26374c">时间、程度、动作、递进</text><text x="830" y="286" font-size="27" font-weight="500" fill="#26374c">顺序是否合理？</text><text x="830" y="326" font-size="27" font-weight="500" fill="#26374c">两套句型有没有拼接？能</text><text x="830" y="366" font-size="27" font-weight="500" fill="#26374c">否保留一种？</text><rect x="30" y="479" width="360" height="264" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="517" font-size="31" font-weight="700" fill="#173d79">④ 查指代与歧义</text><text x="50" y="575" font-size="27" font-weight="500" fill="#26374c">他／其／对谁／谁在做，</text><text x="50" y="615" font-size="27" font-weight="500" fill="#26374c">能否明确？</text><text x="50" y="655" font-size="27" font-weight="500" fill="#26374c">可省略不等于可含混；按</text><text x="50" y="695" font-size="27" font-weight="500" fill="#26374c">本意补明试读</text><rect x="420" y="479" width="360" height="264" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="440" y="517" font-size="31" font-weight="700" fill="#173d79">⑤ 查逻辑</text><text x="440" y="575" font-size="27" font-weight="500" fill="#26374c">否定、数量、范围、因果</text><text x="440" y="615" font-size="27" font-weight="500" fill="#26374c">、两面对应</text><text x="440" y="655" font-size="27" font-weight="500" fill="#26374c">换成直白话：最终到底想</text><text x="440" y="695" font-size="27" font-weight="500" fill="#26374c">表达什么？</text><rect x="810" y="479" width="360" height="264" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="830" y="517" font-size="31" font-weight="700" fill="#173d79">⑥ 回题问并复核</text><text x="830" y="575" font-size="27" font-weight="500" fill="#26374c">找“有语病”还是“没有</text><text x="830" y="615" font-size="27" font-weight="500" fill="#26374c">语病”？</text><text x="830" y="655" font-size="27" font-weight="500" fill="#26374c">说出缺陷并尝试最小修改</text><text x="830" y="695" font-size="27" font-weight="500" fill="#26374c">，再选答案</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M392 282 H415"/><path d="M782 282 H805"/><path d="M990 418 V446.5 H210 V474"/><path d="M392 611 H415"/><path d="M782 611 H805"/></g><text x="30" y="793" font-size="27" font-weight="600" fill="#3b4c61">省主语不必错；“通过＋使”要看全句主语</text><text x="30" y="829" font-size="27" font-weight="600" fill="#3b4c61">两面对应看句义，不按“是否”字数配对</text><text x="30" y="865" font-size="27" font-weight="600" fill="#3b4c61">口诀：主干 → 搭配 → 句式 → 指代 → 逻辑</text></g></svg>