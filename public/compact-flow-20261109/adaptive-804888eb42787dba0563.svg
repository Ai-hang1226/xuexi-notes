<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第8题｜求基期总量"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第8题｜求基期总量</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 找目标</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">2022年三类作品登记量</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">先找当年作品登记总量</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 还原基期总量</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">642.8277 ÷ 1.423</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">约451.74万件</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 还原三类比重</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">95.32%－4.86%</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">＝90.46%</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 两者相乘</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">451.74 × 90.46%</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">约408.65万件 → 参考C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答A；估商可用回乘核对。</text></g></svg>