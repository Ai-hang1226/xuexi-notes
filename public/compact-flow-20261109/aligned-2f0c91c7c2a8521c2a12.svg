<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 892" role="img" aria-label="语病辨析｜先看句子主干"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="892" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">语病辨析｜先看句子主干</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 找主干</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">谁做什么？</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">说的是什么？</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 检查搭配</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">主谓、动宾与修饰</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">并列项分别代回</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 语序和句式</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">修饰位置是否合适？</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">是否混用了两种句式？</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 指代和歧义</text><text x="638" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">对象指的是谁？</text><text x="638" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">会不会出现两种理解？</text><rect x="30" y="596" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="636" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">⑤ 检查逻辑</text><text x="50" y="691" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">否定、数量、范围</text><text x="50" y="733" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">是否符合原意？</text><rect x="618" y="596" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="636" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">⑥ 回到题问</text><text x="638" y="691" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">选有语病还是没有？</text><text x="638" y="733" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">比较各项明确缺陷</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 194 H613"/><path d="M894 292 V318 H306 V343"/><path d="M584 442 H613"/><path d="M894 540 V566 H306 V591"/><path d="M584 690 H613"/></g><text x="30" y="834" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">方法供检查，陌生题独立运用仍需验证。</text></g></svg>