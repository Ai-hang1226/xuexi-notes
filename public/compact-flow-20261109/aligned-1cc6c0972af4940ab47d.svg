<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第5题｜飞镖组合"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第5题｜飞镖组合</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 确认计数对象</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">三支得分之和恰好30</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">同组得分不计先后顺序</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 固定最大得分</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">最大为30：1组</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">最大为25：2组</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 继续分类</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">最大为20：2组</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">最大为15：2组</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 检查停止条件</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">最大为10：1组；再小不足30</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">1＋2＋2＋2＋1＝8组</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">原答C；顺序枚举避免遗漏重复。</text></g></svg>