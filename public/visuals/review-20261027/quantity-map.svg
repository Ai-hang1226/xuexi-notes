<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-label="数量关系：条件 → 结构 → 短解">
<rect width="100%" height="100%" rx="28" fill="#f5f8fc"/>
<g font-family="Times New Roman, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="55" y="72" font-size="44" font-weight="800">数量关系：条件 → 结构 → 短解</text>
<rect x="45" y="110" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="71" y="161" font-size="38" font-weight="800">混合与权重｜2、9</text>
<text x="71" y="210" font-size="32" font-weight="600">均值 = 总量 ÷ 数量</text>
<text x="71" y="251" font-size="32" font-weight="600">先认分母，再配平差额</text>
<rect x="670" y="110" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="696" y="161" font-size="38" font-weight="800">比例与余数｜3、6</text>
<text x="696" y="210" font-size="32" font-weight="600">共同对象统一份数</text>
<text x="696" y="251" font-size="32" font-weight="600">余数条件转化为整除</text>
<rect x="45" y="335" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="71" y="386" font-size="38" font-weight="800">工程与费用｜4、11、12</text>
<text x="71" y="435" font-size="32" font-weight="600">先分段，再写真实倍率</text>
<text x="71" y="476" font-size="32" font-weight="600">工费 ÷ 效率 = 单位成本</text>
<rect x="670" y="335" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="696" y="386" font-size="38" font-weight="800">概率｜7、10、15</text>
<text x="696" y="435" font-size="32" font-weight="600">比较正反算；分步看条件</text>
<text x="696" y="476" font-size="32" font-weight="600">相对先后不等于相邻</text>
<rect x="45" y="560" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="71" y="611" font-size="38" font-weight="800">几何｜5、19、20</text>
<text x="71" y="660" font-size="32" font-weight="600">辅助线把关系变清楚</text>
<text x="71" y="701" font-size="32" font-weight="600">局部增幅按原占比加权</text>
<rect x="670" y="560" width="590" height="200" rx="20" fill="white" stroke="#bed3e8" stroke-width="2"/>
<text x="696" y="611" font-size="38" font-weight="800">决策与检查｜6、12、16</text>
<text x="696" y="660" font-size="32" font-weight="600">核完明确约束就决策</text>
<text x="696" y="701" font-size="32" font-weight="600">末步运算用另一种方式核对</text>
</g></svg>
