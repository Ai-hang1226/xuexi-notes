<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#496b80"/></marker></defs><rect width="1200" height="1640" fill="#ffffff"/><text x="40" y="62" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="44" font-weight="600" fill="#17384d">11/02｜卷面成绩与解法掌握分开记录</text><rect x="40" y="95" width="545" height="155" rx="14" fill="#eaf3fb"/><text x="65" y="145" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="44" font-weight="600" fill="#17384d">行测 8/8 · 8分钟</text><text x="65" y="200" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#17384d">第5、8题：选对，自述不会</text><rect x="615" y="95" width="545" height="155" rx="14" fill="#e9f5ef"/><text x="640" y="145" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="44" font-weight="600" fill="#17384d">申论 15/15 · 5分钟</text><text x="640" y="200" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#17384d">137字，三组措施与成效保留</text><text x="40" y="315" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="40" font-weight="600" fill="#17384d">第5题｜先固定E、F的位置，再排除违规</text><text x="40" y="365" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#17384d">每种E、F位置组合，其他4项都对应6种合规排法。</text><rect x="40" y="400" width="330" height="155" rx="14" fill="#f0f5f8"/><text x="60" y="445" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">30种位置组合</text><text x="60" y="493" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">E有6个位置</text><text x="60" y="535" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">F再选剩余5个</text><rect x="435" y="400" width="330" height="155" rx="14" fill="#f0f5f8"/><text x="455" y="445" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">排除9种</text><text x="455" y="493" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">E首5种＋F尾5种</text><text x="455" y="535" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">重复1种，只排一次</text><rect x="830" y="400" width="330" height="155" rx="14" fill="#f0f5f8"/><text x="850" y="445" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">保留21种</text><text x="850" y="493" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">30－5－5＋1</text><text x="850" y="535" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">21÷30＝7/10</text><line x1="377" y1="475" x2="424" y2="475" stroke="#496b80" stroke-width="4" marker-end="url(#arrow)"/><line x1="772" y1="475" x2="819" y2="475" stroke="#496b80" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="600" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#17384d">“在前”允许中间夹项目；没有要求相邻。</text><text x="40" y="665" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="40" font-weight="600" fill="#17384d">第8题｜谁挡住光，谁就在中间</text><text x="40" y="716" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="36" font-weight="600" fill="#17384d">甲：日食（朔附近）</text><circle cx="180" cy="810" r="66" fill="#ffd36f" stroke="#17384d" stroke-width="3"/><text x="180" y="823" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">太阳</text><circle cx="580" cy="810" r="66" fill="#ced7de" stroke="#17384d" stroke-width="3"/><text x="580" y="823" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">月球</text><circle cx="980" cy="810" r="66" fill="#87bfe9" stroke="#17384d" stroke-width="3"/><text x="980" y="823" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">地球</text><line x1="263" y1="810" x2="490" y2="810" stroke="#496b80" stroke-width="4" marker-end="url(#arrow)"/><line x1="663" y1="810" x2="890" y2="810" stroke="#496b80" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="945" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="36" font-weight="600" fill="#17384d">乙：月食（望附近）</text><circle cx="180" cy="1050" r="66" fill="#ffd36f" stroke="#17384d" stroke-width="3"/><text x="180" y="1063" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">太阳</text><circle cx="580" cy="1050" r="66" fill="#87bfe9" stroke="#17384d" stroke-width="3"/><text x="580" y="1063" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">地球</text><circle cx="980" cy="1050" r="66" fill="#ced7de" stroke="#17384d" stroke-width="3"/><text x="980" y="1063" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#17384d">月球</text><line x1="263" y1="1050" x2="490" y2="1050" stroke="#496b80" stroke-width="4" marker-end="url(#arrow)"/><line x1="663" y1="1050" x2="890" y2="1050" stroke="#496b80" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="1165" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#17384d">朔、望只是月相条件，并不保证每次都会发生食。</text><text x="40" y="1240" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="40" font-weight="600" fill="#17384d">字数保持记录｜本次137字，限150字</text><line x1="805" y1="1285" x2="805" y2="1520" stroke="#a84444" stroke-width="3" stroke-dasharray="9 7"/><text x="817" y="1282" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#a84444">150字</text><text x="40" y="1338" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="36" font-weight="600" fill="#17384d">10/26</text><rect x="355" y="1296" width="540" height="52" rx="14" fill="#a3b5c4"/><text x="911" y="1334" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#17384d">180</text><text x="40" y="1418" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="36" font-weight="600" fill="#17384d">10/28</text><rect x="355" y="1376" width="597" height="52" rx="14" fill="#a3b5c4"/><text x="968" y="1414" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#17384d">199</text><text x="40" y="1498" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="36" font-weight="600" fill="#17384d">11/02</text><rect x="355" y="1456" width="411" height="52" rx="14" fill="#17826e"/><text x="782" y="1494" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#17384d">137</text><text x="40" y="1585" text-anchor="start" font-family="Times New Roman, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#17384d">材料不同：这里只看本次字数达标，不推断总能力趋势。</text></svg>