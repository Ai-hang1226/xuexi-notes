<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 482" role="img" aria-label="第119题｜单位量比较"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="482" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第119题｜单位量比较</text><rect x="30" y="100" width="360" height="310" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 求 2025 年 12 月</text><text x="50" y="242" font-size="27" font-weight="500" fill="#26374c">98.1 ÷ 171.8 × 100</text><text x="50" y="282" font-size="27" font-weight="500" fill="#26374c">约 57.10 千瓦时／辆</text><rect x="420" y="100" width="360" height="310" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 还原 2025 年 </text><text x="440" y="184" font-size="31" font-weight="700" fill="#78511c">11 月</text><text x="440" y="242" font-size="27" font-weight="500" fill="#26374c">(98.1 ÷ 1.049) ÷ (</text><text x="440" y="282" font-size="27" font-weight="500" fill="#26374c">171.8 ÷ 0.914)</text><text x="440" y="322" font-size="27" font-weight="500" fill="#26374c">再乘 100，约 49.75 </text><text x="440" y="362" font-size="27" font-weight="500" fill="#26374c">千瓦时／辆</text><rect x="810" y="100" width="360" height="310" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 比较差值</text><text x="830" y="242" font-size="27" font-weight="500" fill="#26374c">约 57.10 − 49.75 = </text><text x="830" y="282" font-size="27" font-weight="500" fill="#26374c">7.35</text><text x="830" y="322" font-size="27" font-weight="500" fill="#26374c">高不到 10；参考 C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 255 H415"/><path d="M782 255 H805"/></g></g></svg>