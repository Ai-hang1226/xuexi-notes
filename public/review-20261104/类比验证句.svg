<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-label="类比关系验证句复习图"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-weight:700} .num{font-family:'Times New Roman',serif}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="66" font-size="44" fill="#24354b">类比：把词义变成可核对的短句</text><rect x="30" y="120" width="440" height="210" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="50" y="175" font-size="38" fill="#24354b">先后顺序</text><text x="50" y="232" font-size="32" fill="#24354b">同类时间称谓＋由早到晚</text><text x="50" y="280" font-size="32" fill="#24354b">不再要求无缝相接</text><rect x="500" y="120" width="440" height="210" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="520" y="175" font-size="38" fill="#24354b">种属与组成</text><text x="520" y="232" font-size="32" fill="#24354b">寓言是一种故事</text><text x="520" y="280" font-size="32" fill="#24354b">指针是钟表的一部分</text><rect x="30" y="355" width="440" height="210" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="50" y="410" font-size="38" fill="#24354b">概念包含与流程</text><text x="50" y="467" font-size="32" fill="#24354b">可行性研究属于论证内容</text><text x="50" y="515" font-size="32" fill="#24354b">不能自行补一次论证会</text><rect x="500" y="355" width="440" height="210" rx="16" fill="#f3f6fb" stroke="#b9c9df" stroke-width="2"/><text x="520" y="410" font-size="38" fill="#24354b">场景联想后核词</text><text x="520" y="467" font-size="32" fill="#24354b">越野训练关联士兵</text><text x="520" y="515" font-size="32" fill="#24354b">仍须核对“军事演习”</text><text x="35" y="640" font-size="32" fill="#24354b">核词义 → 造短句 → 比角色、方向和边界。</text><text x="35" y="688" font-size="32" fill="#24354b">有联想或大类关系后，仍须回到原词逐项核对。</text></svg>