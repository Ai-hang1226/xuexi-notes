<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="第20题｜构造截面"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="800" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第20题｜构造截面</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 抓住边长比</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">设长宽高为5、4、3</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">构造两种可等分截面</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 构造较大截面</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">一边为5，另一边为√(4</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">²＋3²)</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">面积＝25</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 构造较小截面</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">过中心平行最小面</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">面积＝4×3＝12</text><rect x="30" y="430" width="360" height="264" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="468" font-size="31" font-weight="700" fill="#5e4487">④ 根据选项比较</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">最大／最小 ≥ 25/12 ＞</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c"> 2</text><text x="50" y="606" font-size="27" font-weight="500" fill="#26374c">足以选D，无须证明绝对</text><text x="50" y="646" font-size="27" font-weight="500" fill="#26374c">极值</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/><path d="M990 368 V397 H210 V425"/></g><text x="30" y="744" font-size="27" font-weight="600" fill="#3b4c61">原答D；最长棱平方不是通用公式。</text></g></svg>