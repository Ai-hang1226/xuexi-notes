<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第5题｜两块图形距离"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第5题｜两块图形距离</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 先看原图</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">每幅都有两块黑色区域</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">不要只比较形状</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 找最近的两点</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">从两块黑色区域的边缘</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">找距离最近的两个点</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 比较最短直线</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">可能是斜线，不限水平竖直</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">不是两块图形中心的距离</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 对照每组</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">各组内部保持各自的间距</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">原题与平台标线图见正文</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答B；猜测状态未确认。</text></g></svg>