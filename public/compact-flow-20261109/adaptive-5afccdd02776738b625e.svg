<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="定义：按条件逐项对"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="520" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">定义：按条件逐项对</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">题干定义是判断标准</text><rect x="30" y="150" width="360" height="224" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">① 先看问法</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">属于／不属于？</text><text x="50" y="286" font-size="27" fill="#26374c" font-weight="500">问哪个定义先读哪条</text><rect x="420" y="150" width="360" height="224" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="440" y="188" font-size="31" fill="#7e591c" font-weight="700">② 圈必要条件</text><text x="440" y="246" font-size="27" fill="#26374c" font-weight="500">谁对谁做？用何方式？</text><text x="440" y="286" font-size="27" fill="#26374c" font-weight="500">原因、目的、结果是什么</text><text x="440" y="326" font-size="27" fill="#26374c" font-weight="500">？</text><rect x="810" y="150" width="360" height="224" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="830" y="188" font-size="31" fill="#176552" font-weight="700">③ 逐项对照</text><text x="830" y="246" font-size="27" fill="#26374c" font-weight="500">关键条件不符 → 排除</text><text x="830" y="286" font-size="27" fill="#26374c" font-weight="500">剩余选项比较贴合程度</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M392 262 H415"/><path d="M782 262 H805"/></g><text x="30" y="424" font-size="27" fill="#3b4c61" font-weight="600">以题干定义为准</text><text x="30" y="460" font-size="27" fill="#3b4c61" font-weight="600">生活常识不能替代定义</text></g></svg>