<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1160" role="img" aria-label="空间折叠：先面，再边与端点，再核对顶点顺序"><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1160" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">空间折叠｜先面再边和点</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="149" font-size="38" font-weight="700" fill="#173d79">① 先辨认立体</text><text x="54" y="198" font-size="31" fill="#26374c">正方体／长方体：可找相对面</text><text x="54" y="242" font-size="31" fill="#26374c">四面体：没有相对面</text><path d="M300 268 V293" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="54" y="355" font-size="38" font-weight="700" fill="#176659">② 固定参照面</text><text x="54" y="404" font-size="31" fill="#26374c">先选一个有明显图案的面</text><text x="54" y="448" font-size="31" fill="#26374c">注意统一观察方向</text><path d="M300 474 V499" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="54" y="561" font-size="38" font-weight="700" fill="#78511c">③ 核对公共边</text><text x="54" y="610" font-size="31" fill="#26374c">先确认折后对应同一条边</text><text x="54" y="654" font-size="31" fill="#26374c">再比边上图案与两端点</text><path d="M300 680 V705" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="718" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="54" y="767" font-size="38" font-weight="700" fill="#5e4487">④ 三面交于同一顶点</text><text x="54" y="816" font-size="31" fill="#26374c">固定同一顶点与同组三个面</text><text x="54" y="860" font-size="31" fill="#26374c">从同方向比较环绕顺序</text><path d="M300 886 V911" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="924" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="973" font-size="38" font-weight="700" fill="#173d79">⑤ 最后代回原图</text><text x="54" y="1022" font-size="31" fill="#26374c">检查题目特殊条件与选项</text><text x="54" y="1066" font-size="31" fill="#26374c">原图保留在下方，可放大看</text></g></svg>