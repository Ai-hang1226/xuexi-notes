<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="第5题｜浓度两列记账"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="720" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第5题｜浓度两列记账</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 恢复原浓度</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">甲新增水20克＋纯酒精30</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">克</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">新增部分浓度＝30÷50</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 得到原浓度</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">原浓度＝60%</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">设原溶液质量m克</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 两瓶中间浓度相等</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">甲：0.6m÷(m＋20)</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">乙：(0.6m＋15)÷(m＋</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">50)</text><rect x="30" y="390" width="360" height="224" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="428" font-size="31" font-weight="700" fill="#5e4487">④ 联立并代回</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">解得m＝100克</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">中间浓度均为50% → 参</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/><path d="M990 328 V357 H210 V385"/></g><text x="30" y="664" font-size="27" font-weight="600" fill="#3b4c61">原答A但本人表示不会；待再验证。</text></g></svg>