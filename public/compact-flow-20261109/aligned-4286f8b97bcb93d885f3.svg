<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第58题｜教师分配"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第58题｜教师分配</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 先选A校3人</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">共6名教师</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">从中选3人安排到A校</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 计算全部选法</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">6选3＝20种</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">剩余3人自然安排到B校</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 排除不符合条件</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">A校至少1位数学老师</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">全是英语老师有4选3＝4种</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 相减得到结果</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">20－4＝16种</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">题库参考C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">详情见正文；单题用时未记录。</text></g></svg>