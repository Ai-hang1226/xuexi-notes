<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" role="img" aria-label="第51题｜拆开点号看差值"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="436" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第51题｜拆开点号看差值</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 点号两侧分别看</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">13 − 1 = 12；18 − 3</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c"> = 15</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">25 − 7 = 18；25 − 4</text><text x="50" y="316" font-size="27" font-weight="500" fill="#26374c"> = 21</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 差值每次增加 3</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">再算 33 − 9 = 24</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">下一项应有差值 27</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 对照选项</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">35 − 8 = 27</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">参考 B：8.35</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/></g></g></svg>