<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="第4题｜范围不能扩大"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="800" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第4题｜范围不能扩大</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 读清选非</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">看完四项后回原文</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">找证据最明确的错误项</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 原文有地区限定</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">欧洲、南美、澳大利亚</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">道路交通可能是主要驱动</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 对比D项</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">把部分地区的可能性</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">扩大成整体的确定判断</text><rect x="30" y="430" width="360" height="264" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="468" font-size="31" font-weight="700" fill="#5e4487">④ 再看原答C</text><text x="50" y="526" font-size="27" font-weight="500" fill="#26374c">“无处不在”等支持分布</text><text x="50" y="566" font-size="27" font-weight="500" fill="#26374c">广</text><text x="50" y="606" font-size="27" font-weight="500" fill="#26374c">不必逐地点证明 → 参考</text><text x="50" y="646" font-size="27" font-weight="500" fill="#26374c">D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/><path d="M990 368 V397 H210 V425"/></g><text x="30" y="744" font-size="27" font-weight="600" fill="#3b4c61">原答C；概括与扩大范围要分开。</text></g></svg>