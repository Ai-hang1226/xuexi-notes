<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 892" role="img" aria-label="语句排序｜先衔接再验证"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="892" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">语句排序｜先衔接再验证</text><rect x="30" y="100" width="552" height="188" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 看选项差异</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">哪里顺序不同？</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">优先比较这些位置</text><rect x="618" y="100" width="552" height="188" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 标句子功能</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">背景、观点、解释</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">例子、转折或对策</text><rect x="30" y="348" width="552" height="188" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 找衔接证据</text><text x="50" y="443" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">指代、因果、时间</text><text x="50" y="485" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">话题怎样继续？</text><rect x="618" y="348" width="552" height="188" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 比候选组合</text><text x="638" y="443" font-size="26" 