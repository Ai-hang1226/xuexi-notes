<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" role="img" aria-labelledby="t d"><title id="t">逻辑判断：对象、因果与反例</title><desc id="d">对象结论、因果关系、条件反例和范围约束四类检查。</desc><rect width="600" height="1010" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">逻辑判断｜四类检查</text><rect x="30" y="100" width="540" height="175" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="152" font-size="38" font-weight="700" fill="#173d79">对象与结论</text><text x="58" y="205" font-size="32" fill="#26374c">细菌 ≠ 衍生产物</text><text x="58" y="250" font-size="32" fill="#26374c">安全与有效可分别核对</text><rect x="30" y="310" width="540" height="175" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">因果链方向</text><text x="58" y="415" font-size="32" fill="#26374c">新信息补通还是切断关系？</text><text x="58" y="460" font-size="32" fill="#26374c">不自行否认题内已知论据</text><rect x="30" y="520" width="540" height="175" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="572" font-size="38" font-weight="700" fill="#78511c">同条件反例</text><text x="58" y="625" font-size="32" fill="#26374c">A → B；反例为 A 且非 B</text><text x="58" y="670" font-size="32" fill="#26374c">对象、条件、程度须对齐</text><rect x="30" y="730" width="540" height="175" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="782" font-size="38" font-weight="700" fill="#5e4487">范围词与必选</text><text x="58" y="835" font-size="32" fill="#26374c">“通常”允许个别例外</text><text x="58" y="880" font-size="32" fill="#26374c">必选项取全部合法情况交集</text><text x="36" y="991" font-size="27" font-weight="600" fill="#3b4c61">理解与独立应用分开；慢因按事实记录。</text></g></svg>