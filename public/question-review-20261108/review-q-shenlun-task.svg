<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">DAY5和DAY6：先分清题目任务</title><desc id="desc">DAY5概括主要做法，DAY6概括措施和成效；先看任务再整理答案。</desc><rect width="600" height="650" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">先看题目问什么</text><rect x="30" y="100" width="540" height="205" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="151" font-size="38" font-weight="700" fill="#173d79">DAY5｜F市城市绿化</text><text x="58" y="207" font-size="32" fill="#26374c">问：有哪些主要做法？</text><text x="58" y="255" font-size="32" fill="#26374c">抓行动，归同类，分条概括</text><rect x="30" y="330" width="540" height="205" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="381" font-size="38" font-weight="700" fill="#176659">DAY6｜H市营商环境</text><text x="58" y="437" font-size="32" fill="#26374c">问：采取什么措施？取得什么成效？</text><text x="58" y="485" font-size="32" fill="#26374c">把每组做法与对应结果接起来</text><text x="36" y="607" font-size="30" font-weight="600" fill="#3b4c61">按题目要求写，不把两题套成一样。</text></g></svg>