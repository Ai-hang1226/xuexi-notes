<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第18题｜同比增量"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第18题｜同比增量</text><rect x="30" y="100" width="360" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 固定比较对象</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">智能手机当期产量</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">同比＝对比上年同月</text><rect x="420" y="100" width="360" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#176659">② 按范围初筛</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">增速非正先排除</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">其余用上界检查</text><rect x="810" y="100" width="360" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#78511c">③ 核算边界月份</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">3月约667万，未超过700</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">6月约848万，超过700</text><rect x="30" y="350" width="360" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 统计符合月份</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">仅6月，共1个月</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 192 H415"/><path d="M782 192 H805"/><path d="M990 288 V317 H210 V345"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答D；本人确认曾把环比当同比。</text></g></svg>