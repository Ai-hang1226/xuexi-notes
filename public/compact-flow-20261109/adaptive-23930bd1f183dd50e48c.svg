<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第131题｜绿证换电量"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第131题｜绿证换电量</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 找不可交易数量</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">当年总数47.34亿个</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">减去可交易31.58亿个</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 算差额</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">47.34－31.58＝15.76亿个</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">不是累计核发数量</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 换算电量</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">1个绿证对应1000千瓦时</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">15.76亿×1000＝1.576万亿</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 对照选项</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">约1.6万亿千瓦时</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">题库参考A</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">详情见正文；先对齐当年口径。</text></g></svg>