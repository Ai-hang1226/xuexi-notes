<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="言语复习：先认问题，再选方法"><rect width="1200" height="760" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#17394a" font-weight="700">言语复习：先认问题，再选方法</text><text x="30" y="110" font-size="27" fill="#526378" font-weight="600">原卷 17/30 · 28:18 ｜ 讨论完成 ≠ 独立掌握</text><rect x="30" y="150" width="552" height="278" rx="16" fill="#e6f2f5" stroke="#78a8b8" stroke-width="2"/><text x="50" y="192" font-size="31" fill="#173d59" font-weight="700">逻辑填空：别只凭顺口</text><text x="50" y="250" font-size="27" fill="#263d4c" font-weight="600">读完整句 → 预判空意 → 比侧重 → 整</text><text x="50" y="290" font-size="27" fill="#263d4c" font-weight="600">组回代</text><text x="50" y="330" font-size="27" fill="#263d4c" font-weight="600">提醒：陌生搭配不等于错误，词义更强未必</text><text x="50" y="370" font-size="27" fill="#263d4c" font-weight="600">更好</text><rect x="618" y="150" width="552" height="278" rx="16" fill="#edf2fc" stroke="#9aadd2" stroke-width="2"/><text x="638" y="192" font-size="31" fill="#173d59" font-weight="700">阅读与排序：看关系，不只看关键词</text><text x="638" y="250" font-size="27" fill="#263d4c" font-weight="600">标句子作用 → 找衔接证据 → 验证整段</text><text x="638" y="290" font-size="27" fill="#263d4c" font-weight="600">提醒：首句不必最重要，局部通顺不证明整</text><text x="638" y="330" font-size="27" fill="#263d4c" font-weight="600">组对</text><rect x="30" y="452" width="552" height="278" rx="16" fill="#f2f3ea" stroke="#a8b291" stroke-width="2"/><text x="50" y="494" font-size="31" fill="#173d59" font-weight="700">语病辨析：先找主干，再逐项检查</text><text x="50" y="552" font-size="27" fill="#263d4c" font-weight="600">搭配 → 句式与语序 → 指代 → 逻辑</text><text x="50" y="592" font-size="27" fill="#263d4c" font-weight="600">提醒：省略主语未必错，提示词不能机械判</text><text x="50" y="632" font-size="27" fill="#263d4c" font-weight="600">病</text><rect x="618" y="452" width="552" height="278" rx="16" fill="#fff" stroke="#245c77" stroke-width="2"/><text x="638" y="494" font-size="31" fill="#173d59" font-weight="700">下一步：遮住解析，独立说出判断依据</text><text x="638" y="552" font-size="27" fill="#263d4c" font-weight="600">旧题能复述 → 新题无提示验证 → 延后</text><text x="638" y="592" font-size="27" fill="#263d4c" font-weight="600">复测</text></g></svg>