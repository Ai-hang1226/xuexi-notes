<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1020" role="img" aria-labelledby="title desc"><title id="title">第13题｜环比增量</title><desc id="desc">依题干、本人思路及最终解析绘制的复习流程。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="1020" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei, sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#182a48">第13题｜环比增量</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="58" y="149" font-size="38" font-weight="700" fill="#173d79">① 把问法翻成式子</text><text x="58" y="198" font-size="32" fill="#26374c">每年的第二季度环比增量</text><text x="58" y="242" font-size="32" fill="#26374c">＝同年第二季度－第一季度</text><path d="M300 269 V298" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="313" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="58" y="362" font-size="38" font-weight="700" fill="#176659">② 四年分别求差</text><text x="58" y="411" font-size="32" fill="#26374c">2022：－631；2023：2473</text><text x="58" y="455" font-size="32" fill="#26374c">2024：7581；2025：－3176</text><path d="M300 482 V511" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="526" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="58" y="575" font-size="38" font-weight="700" fill="#78511c">③ 看变化趋势</text><text x="58" y="624" font-size="32" fill="#26374c">先上升，再上升，最后下降</text><text x="58" y="668" font-size="32" fill="#26374c">2025年为四年最低</text><path d="M300 695 V724" fill="none" stroke="#476bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="30" y="739" width="540" height="160" rx="18" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="58" y="788" font-size="38" font-weight="700" fill="#5e4487">④ 对照原选项</text><text x="58" y="837" font-size="32" fill="#26374c">选择对应趋势的折线图</text><text x="58" y="881" font-size="32" fill="#26374c">参考A</text><text x="36" y="1000" font-size="30" font-weight="600" fill="#3b4c61">原答A；比较的是增量，不是总量。</text></g></svg>