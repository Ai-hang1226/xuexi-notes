<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="第1题｜提取关键词"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第1题｜提取关键词</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 找全文对象</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">从特殊微生物引出光合细菌</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">全文主要讨论光合细菌</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">② 抓核心特征</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">生化催化、营养益生</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">归并为代谢功能</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">③ 看应用领域</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">新药和原料药等医药开发</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">归并为医药应用</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">④ 比较组合覆盖</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">光合细菌＋代谢功能＋医药</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">覆盖全文 → 参考D</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">原答D；不机械判断意义一定次要。</text></g></svg>