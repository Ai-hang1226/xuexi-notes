<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-labelledby="t d"><title id="t">定义判断：读懂后再比较</title><desc id="d">本轮两题的方法路线，讨论完成与独立运用分别记录。</desc><rect width="1240" height="480" rx="20" fill="#f5f7fa"/><g font-family="Times New Roman,Microsoft YaHei,微软雅黑,sans-serif" fill="#182b43" font-weight="700"><text x="48" y="66" font-size="44">定义判断：读懂后再比较</text><rect x="48" y="108" width="550" height="266" rx="15" fill="#e8f2ed"/><text x="72" y="164" font-size="38">第1题｜陌生诗句</text><text x="72" y="225" font-size="32">定义转成一句大白话</text><text x="72" y="283" font-size="32">抓读懂的短语，比较态度</text><text x="72" y="341" font-size="32">读不出差别时标记后继续</text><rect x="638" y="108" width="550" height="266" rx="15" fill="#e8eff6"/><text x="662" y="164" font-size="38">第5题｜最适合</text><text x="662" y="225" font-size="32">通过已有对象介绍同类</text><text x="662" y="283" font-size="32">先看能否采用，再比适合度</text><text x="662" y="341" font-size="32">隐蔽是择优线索，非必需</text><text x="48" y="439" font-size="32">原答和真实用时保留；听懂与认可不等于独立新题掌握。</text></g></svg>
