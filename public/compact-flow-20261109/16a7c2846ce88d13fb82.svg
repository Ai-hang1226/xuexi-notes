<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" role="img" aria-label="第37题｜只推材料能支持的"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="436" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第37题｜只推材料能支持的</text><rect x="30" y="100" width="360" height="264" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 题干给出</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">现代洛阳属于古今重叠型</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">城市</text><text x="50" y="276" font-size="27" font-weight="500" fill="#26374c">这一类型涉及现代城市下</text><text x="50" y="316" font-size="27" font-weight="500" fill="#26374c">古城址</text><rect x="420" y="100" width="360" height="264" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 对照 C 项</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">可推出洛阳有古代城市遗</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">迹</text><text x="440" y="276" font-size="27" font-weight="500" fill="#26374c">不必扩大到所有现代城市</text><rect x="810" y="100" width="360" height="264" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 留意范围</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">“多为”不等于全部</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">参考 C；原卷首答 C</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 232 H415"/><path d="M782 232 H805"/></g></g></svg>