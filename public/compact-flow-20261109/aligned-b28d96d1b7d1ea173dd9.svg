<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1009" role="img" aria-label="语病辨析｜先看关系，再判错误"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="1009" rx="22" fill="#f7fafc"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">语病辨析｜先看关系，再判错误</text><text x="30" y="105" font-size="27" fill="#17394a" font-weight="600" xml:space="preserve">关键词提醒你检查，不能替你完成判断</text><rect x="30" y="145" width="552" height="188" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">① 找主干</text><text x="50" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">谁怎样？谁做什么？什么是什么？</text><text x="50" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">先缩句，再放回修饰；不强求句句主谓宾</text><rect x="618" y="145" width="552" height="188" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="638" y="185" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">② 查搭配</text><text x="638" y="240" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">主谓、动宾、修饰关系，分别读得通吗？</text><text x="638" y="282" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">并列宾语逐项代回；比喻要看对应关系</text><rect x="30" y="393" width="552" height="188" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="433" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">③ 查语序与句式</text><text x="50" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">时间、程度、动作、递进顺序是否合理？</text><text x="50" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">两套句型有没有拼接？能否保留一种？</text><rect x="618" y="393" width="552" height="188" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="638" y="433" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">④ 查指代与歧义</text><text x="638" y="488" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">他／其／对谁／谁在做，能否明确？</text><text x="638" y="530" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">可省略不等于可含混；按本意补明试读</text><rect x="30" y="641" width="552" height="188" rx="16" fill="#e4f1f1" stroke="#b4c9d2" stroke-width="2"/><text x="50" y="681" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">⑤ 查逻辑</text><text x="50" y="736" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">否定、数量、范围、因果、两面对应</text><text x="50" y="778" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">换成直白话：最终到底想表达什么？</text><rect x="618" y="641" width="552" height="188" rx="16" fill="#edf1fa" stroke="#b4c9d2" stroke-width="2"/><text x="638" y="681" font-size="29" fill="#173d59" font-weight="700" xml:space="preserve">⑥ 回题问并复核</text><text x="638" y="736" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">找“有语病”还是“没有语病”？</text><text x="638" y="778" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">说出缺陷并尝试最小修改，再选答案</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 239 H613"/><path d="M894 337 V363 H306 V388"/><path d="M584 487 H613"/><path d="M894 585 V611 H306 V636"/><path d="M584 735 H613"/></g><text x="30" y="879" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">省主语不必错；“通过＋使”要看全句主语</text><text x="30" y="915" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">两面对应看句义，不按“是否”字数配对</text><text x="30" y="951" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">口诀：主干 → 搭配 → 句式 → 指代 → 逻辑</text></g></svg>