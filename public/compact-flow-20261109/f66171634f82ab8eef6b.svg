<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-label="第40题｜抓全文的作用链"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="396" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第40题｜抓全文的作用链</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 面临的问题</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">深度学习中不易确定误差</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">引入损失函数</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 材料中的方法</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">对损失函数进行微分</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">观察参数变化的影响</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 文段的目的</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">据此调整参数、尽量减小</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">损失</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">参考 A；按文段语境理解</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/></g></g></svg>