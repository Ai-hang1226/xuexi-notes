<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="第39题｜找没有提到的：参考阅读"><defs><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#476bb0"/></marker></defs><rect width="600" height="760" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="40" font-weight="700" fill="#182a48">第39题｜找没有提到的</text><rect x="30" y="100" width="540" height="160" rx="18" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="54" y="149" font-size="38" font-weight="700" fill="#173d79">① 已提到的做法</text><text x="54" y="198" font-size="31" fill="#26374c">番薯叶与高汤炖煮</text><text x="54" y="242" font-size="31" fill="#26374c">对应烹饪方式</text><path d="M300 268 V293" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="306" width="540" height="160" rx="18" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="54" y="355" font-size="38" font-weight="700" fill="#78511c">② 已提到的外观与名称</text><text x="54" y="404" font-size="31" fill="#26374c">太极图案；少帝赐名</text><text x="54" y="448" font-size="31" fill="#26374c">对应视觉美感和名字由来</text><path d="M300 474 V499" stroke="#476bb0" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="512" width="540" height="160" rx="18" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="54" y="561" font-size="38" font-weight="700" fill="#176659">③ 核对问法</text><text x="54" y="610" font-size="31" fill="#26374c">没有交代传承途径</text><text x="54" y="654" font-size="31" fill="#26374c">参考 B；原卷首答 B</text></g></svg>