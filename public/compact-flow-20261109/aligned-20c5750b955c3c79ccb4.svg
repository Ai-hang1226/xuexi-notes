<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890.4000000000001" role="img" aria-label="假言：只找一个假"><desc>假言命题A蕴含B的真值表。仅A真且B假时为假；等价逆否为非B蕴含非A。肯前、否后可推；否前、肯后不必然。</desc><rect width="1200" height="890.4000000000001" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="62" font-size="42" fill="#17394a" font-weight="700" xml:space="preserve">假言：只找一个假</text><text x="30" y="105" font-size="27" fill="#526378" font-weight="600" xml:space="preserve">A → B</text><svg x="30" y="145" width="552" height="524.4000000000001" viewBox="0 150 500 475" overflow="hidden"><image href="data:image/svg+xml;base64," x="0" y="0" width="500" height="1130"/></svg><svg x="618" y="145" width="552" height="309.12" viewBox="0 630 500 280" overflow="hidden"><image href="data:image/svg+xml;base64," x="0" y="0" width="500" height="1130"/></svg><rect x="30" y="705.4000000000001" width="1140" height="160" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="760.4000000000001" font-size="29" fill="#26374c" font-weight="600" xml:space="preserve">如果 A 那么 B：A → B</text><text x="638" y="760.4000000000001" font-size="29" fill="#26374c" font-weight="600" xml:space="preserve">只有 A 才 B：B → A</text><text x="50" y="825.4000000000001" font-size="29" fill="#785b35" font-weight="700" xml:space="preserve">必要条件放箭头后</text></g></svg>