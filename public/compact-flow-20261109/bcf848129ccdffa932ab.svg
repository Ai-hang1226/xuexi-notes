<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-label="第83题｜定义条件一起看"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="396" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">第83题｜定义条件一起看</text><rect x="30" y="100" width="360" height="224" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">① 看发生时期</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">幼雏的敏感期或关键期</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">人类婴儿也可能出现</text><rect x="420" y="100" width="360" height="224" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="440" y="138" font-size="31" font-weight="700" fill="#78511c">② 检查必要条件</text><text x="440" y="196" font-size="27" font-weight="500" fill="#26374c">刺激物是活动的</text><text x="440" y="236" font-size="27" font-weight="500" fill="#26374c">与幼雏有亲缘或相似性</text><rect x="810" y="100" width="360" height="224" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="830" y="138" font-size="31" font-weight="700" fill="#176659">③ 对照已有讨论</text><text x="830" y="196" font-size="27" font-weight="500" fill="#26374c">本人首答 A；参考 D</text><text x="830" y="236" font-size="27" font-weight="500" fill="#26374c">不要只因 D 是动物而排</text><text x="830" y="276" font-size="27" font-weight="500" fill="#26374c">除</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M392 212 H415"/><path d="M782 212 H805"/></g></g></svg>