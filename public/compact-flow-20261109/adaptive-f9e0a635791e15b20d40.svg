<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 657" role="img" aria-label="图形：按组成找规律"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="657" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700">图形：按组成找规律</text><text x="30" y="112" font-size="27" fill="#526378" font-weight="600">平面与空间，分路观察</text><rect x="30" y="150" width="552" height="184" rx="16" fill="#fff" stroke="#bfd0e8" stroke-width="2"/><text x="50" y="188" font-size="31" fill="#2b5288" font-weight="700">平面图｜先看组成</text><text x="50" y="246" font-size="27" fill="#26374c" font-weight="500">同：位置；似：样式</text><text x="50" y="286" font-size="27" fill="#26374c" font-weight="500">异：数量、属性</text><rect x="618" y="150" width="552" height="184" rx="16" fill="#fff8e9" stroke="#ead39c" stroke-width="2"/><text x="638" y="188" font-size="31" fill="#7e591c" font-weight="700">不同元素｜查两类</text><text x="638" y="246" font-size="27" fill="#26374c" font-weight="500">数：面、线、点、笔画</text><text x="638" y="286" font-size="27" fill="#26374c" font-weight="500">看：对称、曲直、封闭</text><rect x="30" y="399" width="552" height="184" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="50" y="437" font-size="31" fill="#176552" font-weight="700">空间图｜另走此路</text><text x="50" y="495" font-size="27" fill="#26374c" font-weight="500">特殊面 → 箭头判邻位</text><text x="50" y="535" font-size="27" fill="#26374c" font-weight="500">面太远 → 移面再画箭头</text><rect x="618" y="399" width="552" height="184" rx="16" fill="#effaf7" stroke="#a5d6ca" stroke-width="2"/><text x="638" y="437" font-size="31" fill="#176552" font-weight="700">空间核对｜再验证</text><text x="638" y="495" font-size="27" fill="#26374c" font-weight="500">公共棱、时针法辅助</text><text x="638" y="535" font-size="27" fill="#26374c" font-weight="500">方向与相邻面一起核对</text><g fill="none" stroke="#476bb0" stroke-width="4" marker-end="url(#a)"><path d="M584 242 H613"/><path d="M584 491 H613"/></g></g></svg>