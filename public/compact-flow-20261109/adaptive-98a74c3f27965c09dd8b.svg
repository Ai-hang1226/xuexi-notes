<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="平均数与比重｜先看问法"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="640" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" font-weight="700" fill="#182a48">平均数与比重｜先看问法</text><rect x="30" y="100" width="552" height="184" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="138" font-size="31" font-weight="700" fill="#173d79">只问升降</text><text x="50" y="196" font-size="27" font-weight="500" fill="#26374c">a＞b 上升；a＜b 下降</text><text x="50" y="236" font-size="27" font-weight="500" fill="#26374c">a＝b 不变</text><rect x="618" y="100" width="552" height="184" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="138" font-size="31" font-weight="700" fill="#176659">若问平均数增长率</text><text x="638" y="196" font-size="27" font-weight="500" fill="#26374c">（a－b）÷（1＋b）</text><text x="638" y="236" font-size="27" font-weight="500" fill="#26374c">结果是增长率，用百分数表示</text><rect x="30" y="350" width="552" height="184" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="388" font-size="31" font-weight="700" fill="#78511c">若问两期比重差</text><text x="50" y="446" font-size="27" font-weight="500" fill="#26374c">（A÷B）×（a－b）÷（1＋a）</text><text x="50" y="486" font-size="27" font-weight="500" fill="#26374c">两期占比之差，用百分点表示</text><rect x="618" y="350" width="552" height="184" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="388" font-size="31" font-weight="700" fill="#5e4487">所有情况核对口径</text><text x="638" y="446" font-size="27" font-weight="500" fill="#26374c">A、B是现期分子、分母</text><text x="638" y="486" font-size="27" font-weight="500" fill="#26374c">a、b是对应同一基期的增速</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 192 H613"/><path d="M894 288 V317 H306 V345"/><path d="M584 442 H613"/></g><text x="30" y="584" font-size="27" font-weight="600" fill="#3b4c61">比较同口径正数；单位不要混用。</text></g></svg>