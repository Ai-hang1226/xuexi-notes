<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" role="img" aria-label="第6题｜标题统摄全文"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#476bb0"/></marker></defs><rect width="1200" height="602" rx="22" fill="#f7f9fd"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="65" font-size="42" fill="#182a48" font-weight="700" xml:space="preserve">第6题｜标题统摄全文</text><rect x="30" y="100" width="552" height="168" rx="16" fill="#e8f0ff" stroke="#9fb9e6" stroke-width="2"/><text x="50" y="140" font-size="29" fill="#173d79" font-weight="700" xml:space="preserve">① 抓主要观点</text><text x="50" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">真理的理解与条件有关</text><text x="50" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">文段突出相对性</text><rect x="618" y="100" width="552" height="168" rx="16" fill="#e8f6f2" stroke="#a0d0c4" stroke-width="2"/><text x="638" y="140" font-size="29" fill="#176659" font-weight="700" xml:space="preserve">② 理清两个例子</text><text x="638" y="195" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">三角形例子</text><text x="638" y="237" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">内卷与躺平的价值评判</text><rect x="30" y="328" width="552" height="168" rx="16" fill="#fff2df" stroke="#dfc49a" stroke-width="2"/><text x="50" y="368" font-size="29" fill="#78511c" font-weight="700" xml:space="preserve">③ 找共同主题</text><text x="50" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">标题应覆盖整体观点</text><text x="50" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">不能只抓某个例子</text><rect x="618" y="328" width="552" height="168" rx="16" fill="#f0ebfa" stroke="#c1b2dc" stroke-width="2"/><text x="638" y="368" font-size="29" fill="#5e4487" font-weight="700" xml:space="preserve">④ 比较选项</text><text x="638" y="423" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">B点出相对性并覆盖全文</text><text x="638" y="465" font-size="26" fill="#26374c" font-weight="600" xml:space="preserve">D只覆盖末尾例子</text><g fill="none" stroke="#476bb0" stroke-width="4" stroke-linejoin="round" marker-end="url(#a)"><path d="M584 184 H613"/><path d="M894 272 V298 H306 V323"/><path d="M584 412 H613"/></g><text x="30" y="546" font-size="25" fill="#3b4c61" font-weight="600" xml:space="preserve">原答B但纠结；只按本文语境选。</text></g></svg>